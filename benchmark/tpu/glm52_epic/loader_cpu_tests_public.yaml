name: glm52-night-20261113-loader-cpu-public
exp_type: TRAINING
artifact_type: GCS
cluster_name: gke-tpu-train-us-central1-1-prod
config: '{"purpose":"real CPU tensor checkpoint ABI and ordinary FP8 fallback tests; no TPU validation","source_commit":"322a967f78aeaf5201c31c0370635b2ecd9a5ad2"}'
role_to_task_spec:
  worker:
    replica: 1
    device_type: cpu
    image: lmsysorg/sglang:v0.1.0-tpu
    resources:
      cpu_request: "4"
      cpu_limit: "4"
      memory_request: 16Gi
      memory_limit: 16Gi
    envs:
      SGLANG_PLATFORM: cpu
      PYTHONUNBUFFERED: "1"
    sources:
      - name: sglang-torchtpu
        type: git
        repo: https://github.com/sgl-project/sglang-torchtpu.git
        ref: epic/glm52-channelwise-port-20261113
        commit: 322a967f78aeaf5201c31c0370635b2ecd9a5ad2
        path: /workspace/sglang-torchtpu
    command: |
      set -eu
      ulimit -c 0
      cd /workspace/sglang-torchtpu
      git rev-parse HEAD
      python3 -c 'import importlib.metadata,json; print(json.dumps({k:importlib.metadata.version(k) for k in ["torch","jax","jaxlib"]}))'
      export PYTHONPATH=/workspace/sglang-torchtpu:/workspace/sglang-torchtpu/python
      timeout 900 python3 test/registered/unit/hardware_backend/tpu/test_glm52_channelwise_fp8.py
