name: glm52-night-20261113-oot-main-control
exp_type: TRAINING
artifact_type: GCS
cluster_name: gke-tpu-train-us-central1-1-prod
config: '{"purpose":"CPU-only loader ABI checks, corrected CPU platform selection","source_commit":"d6f54cc2899b2f9b23dde8e6e0605cac6d405120"}'
role_to_task_spec:
  worker:
    replica: 1
    device_type: cpu
    image: lmsysorg/sglang:v0.1.0-tpu
    resources:
      cpu_request: "4"
      cpu_limit: "4"
      memory_request: 16Gi
      memory_limit: 16Gi
    envs:
      SGLANG_USE_CPU_ENGINE: "1"
      PYTHONUNBUFFERED: "1"
    sources:
      - name: sglang-torchtpu
        type: git
        repo: https://github.com/sgl-project/sglang-torchtpu.git
        ref: main
        commit: d6f54cc2899b2f9b23dde8e6e0605cac6d405120
        path: /workspace/sglang-torchtpu
    command: |
      set -eu
      ulimit -c 0
      unset SGLANG_PLATFORM
      cd /workspace/sglang-torchtpu
      git rev-parse HEAD
      python3 -c 'import importlib.metadata,json; print(json.dumps({k:importlib.metadata.version(k) for k in ["torch","jax","jaxlib"]}))'
      export PYTHONPATH=/workspace/sglang-torchtpu:/workspace/sglang-torchtpu/python
      timeout 900 python3 -c 'import runpy; from sglang.test.test_utils import maybe_stub_sgl_kernel; maybe_stub_sgl_kernel(); runpy.run_path("test/registered/unit/plugins/test_tpu_oot_platform_contract.py", run_name="__main__")' 
