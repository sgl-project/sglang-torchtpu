# Reviewable current GLM52 short-smoke template. UNSUBMITTED: replace every
# USER_* placeholder from the exact Falcon allocation, then submit once.
# This intentionally avoids an inline/base64 runner: the source checkout at the
# pinned commit contains the reviewed runner and removes stale-payload drift.
name: glm52-torch-8chip-current-UNSUBMITTED
exp_type: TRAINING
artifact_type: GCS
cluster_name: USER_REVALIDATE_CLUSTER
config: '{"status":"UNSUBMITTED","scope":"GLM52 short-input eager qblock smoke; no performance claim","source_commit":"ccac23572442fb2dacb696c0eca74fe9c6d701b7","runner":"benchmark/tpu/glm52_epic/torch_8chip_runner.sh","baseline_mode":"eager","physical_chips":8,"hosts":2,"framework_devices":16}'
role_to_task_spec:
  worker:
    replica: 2
    device_type: v7x
    device_count: 8
    device_topo: 2x2x2
    shared_memory_size: 256Gi
    image: USER_PROVIDED_IMMUTABLE_IMAGE@sha256:REPLACE_64_HEX_DIGEST
    envs:
      GLM52_IMAGE: USER_PROVIDED_IMMUTABLE_IMAGE@sha256:REPLACE_64_HEX_DIGEST
      SOURCE_COMMIT: ccac23572442fb2dacb696c0eca74fe9c6d701b7
      SOURCE_SHA: ccac23572442fb2dacb696c0eca74fe9c6d701b7
      GLM52_BASELINE_MODE: eager
      TPU_TOPOLOGY: 2x2x2
      TPU_WORKER_HOSTNAMES: USER_RANK0_HOST,USER_RANK1_HOST
      PYTHONPATH: /workspace/sglang-torchtpu:/workspace/sglang-torchtpu/python
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TORCH_TPU_WHEEL: USER_PROVIDE_PINNED_WHEEL_FILENAME
      TORCH_TPU_WHEEL_SHA256: USER_PROVIDE_64_HEX_WHEEL_SHA256
    sources:
      - name: sglang-torchtpu
        type: git
        repo: https://github.com/sgl-project/sglang-torchtpu.git
        ref: epic/glm52-channelwise-port-20261113
        commit: ccac23572442fb2dacb696c0eca74fe9c6d701b7
        path: /workspace/sglang-torchtpu
    mounts:
      - name: glm52-channelwise-model
        type: gcs
        bucket: inference-model-storage-poc-tpu-hns
        prefix: GLM5.2-fp8-channel-wise
        mount_path: /models/GLM5.2-fp8-channel-wise
        read_only: true
        mount_options:
          - implicit-dirs
          - metadata-cache:ttl-secs:-1
          - metadata-cache:stat-cache-max-size-mb:-1
          - metadata-cache:type-cache-max-size-mb:-1
          - file-system:kernel-list-cache-ttl-secs:-1
          - read:enable-buffered-read:true
          - read:block-size-mb:32
          - read:max-blocks-per-handle:64
          - read:global-max-blocks:2048
          - read_ahead_kb=1024
    command: |
      set -eu
      ulimit -c 0
      cd /workspace/sglang-torchtpu
      test "$(git rev-parse HEAD)" = ccac23572442fb2dacb696c0eca74fe9c6d701b7
      exec bash benchmark/tpu/glm52_epic/torch_8chip_runner.sh
