# SPDX-License-Identifier: Apache-2.0
# The out-of-tree TPU plugin. Installs next to the fork in python/:
#     pip install -e python/ && pip install --no-deps -e .
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-tpu"
version = "0.0.0.dev0"
description = "Out-of-tree TPU platform plugin for SGLang, backed by torch_tpu."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
# Not published to PyPI while the plugin still needs the fork tree.
dependencies = ["sglang"]

[tool.setuptools.packages.find]
include = ["sglang_tpu*"]
