[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang"
dynamic = ["version"]
description = "SGLang is a fast serving framework for large language models and vision language models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]

dependencies = [
  "IPython",
  "aiohttp",
  "anthropic>=0.20.0",
  "anyio>=4.13.0",
  "blobfile==3.0.0",
  "av",
  "build",
  "compressed-tensors",
  "datasets",
  "einops",
  "fastapi",
  "easydict",
  "gguf",
  "hf_transfer",
  "huggingface_hub",
  "interegular",
  "llguidance>=0.7.11,<0.8.0",
  "modelscope",
  "msgspec",
  "ninja",
  "numpy",
  "openai-harmony==0.0.4",
  "openai==2.6.1",
  "orjson",
  "outlines==0.1.11",
  "packaging",
  "partial_json_parser",
  "pillow",
  "prometheus-client>=0.20.0",
  "psutil",
  "py-spy",
  "pybase64",
  "pydantic",
  "python-multipart",
  "pyzmq>=25.1.2",
  "requests",
  "scipy",
  "sentencepiece",
  "setproctitle",
  "soundfile==0.13.1",
  "tiktoken",
  "timm==1.0.16",
  "torchao==0.9.0",
  "tqdm",
  "mistral_common>=1.11.0",
  "transformers==5.17.0",
  "uvicorn",
  "uvloop",
  "zstandard",
  "xgrammar==0.2.7",
  "smg-grpc-servicer>=0.5.0",

  # The pins below form one TPU stack and must be upgraded and validated
  # together:
  # - torch_tpu and torch must be ABI compatible.
  # - torch and torchvision must be ABI compatible.
  # - torch_tpu and libtpu must be validated together.
  # - jax and jaxlib must be compatible with libtpu.
  # - tpu-sync-torch's native extension links torch_tpu's per-torch-version
  #   glue library, so it must be upgraded and validated with torch_tpu.
  "torch_tpu==0.2.0",
  # PJRT raw-transfer / KV-cache DMA engine backing the raiden disaggregation
  # connector (sglang/srt/disaggregation/raiden/) and the raiden HiCache
  # transfer backend (sglang/srt/hardware_backend/tpu/raiden_transfer.py).
  # Published to PyPI as nightly .dev pre-releases.
  "tpu-sync-torch==0.0.1.dev20261013083150",
  "libtpu==0.0.50",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "jax==0.10.2",
  "jaxlib==0.10.2",
]

[project.optional-dependencies]
checkpoint-engine = ["checkpoint-engine==0.1.2"]
runai = ["runai-model-streamer[s3,gcs,azure]>=0.15.7"]

# Ray is required only for the --use-ray multihost launch path (RayEngine).
# Mirrors the `ray` extra in the base pyproject so `sglang[ray]` resolves on TPU
# builds too; pulled into dev_tpu so the TPU unit-test image gets it (otherwise
# test_ray_bundle_order.py's importorskip("ray") silently skips forever).
ray = ["ray[default]>=2.54.0"]

tracing = [
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-exporter-otlp-proto-grpc",
  "opentelemetry-sdk",
]

test = [
  "accelerate",
  "blobfile",
  "expecttest",
  "gguf",
  "jsonlines",
  "lm-eval[api]>=0.4.9.2",
  "matplotlib",
  "openai",
  "pandas",
  "peft>=0.18.0",
  "pytest",
  "sentence_transformers",
  # mini-LB for the P/D feature-combo row (sglang_router.launch_router --mini-lb).
  "sglang-router",
  "tabulate",
]

# Mirrors srt_npu / all_npu / dev_npu shape. All TPU stack pins (torch_tpu,
# libtpu, torch, torchvision, jax, jaxlib) live in `dependencies`.
srt_tpu = []
all_tpu = []
# The `diffusion` extra minus CUDA-only kernels and model-specific tooling;
# pins track pyproject.toml.
diffusion_tpu = [
  "addict==2.4.0",
  "av==16.1.0",
  "cache-dit==1.3.0",
  "cloudpickle==3.1.2",
  "diffusers==0.37.0",
  "imageio==2.36.0",
  "imageio-ffmpeg==0.5.1",
  # test/test_utils.py imports cv2 unconditionally; the server harness needs it.
  "opencv-python-headless==4.10.0.84",
  "PyYAML==6.0.1",
]
dev_tpu = [
  "sglang[all_tpu]",
  "sglang[test]",
  "sglang[ray]",
  "sglang[runai]",
]

[project.urls]
"Homepage" = "https://github.com/sgl-project/sglang"
"Bug Tracker" = "https://github.com/sgl-project/sglang/issues"

[project.entry-points."sglang.srt.platforms"]
tpu = "sglang.srt.hardware_backend.tpu:activate"

# The plugin's hooks under the in-tree tpu platform, whose selection skips the
# sglang-tpu dist; mode B loads the same function from sglang-tpu.
[project.entry-points."sglang.srt.plugins"]
tpu_hooks = "sglang_tpu.hooks:register"

[project.scripts]
sglang = "sglang.cli.main:main"

[tool.setuptools.package-data]
"sglang" = [
  "srt/**/*",
  "kernels/**/*",
  "multimodal_gen/apps/realtime_webui/**/*"
]

[tool.setuptools.exclude-package-data]
"sglang" = [
  "kernels/aot/*",
  "kernels/aot/**/*",
]
# .claude/skills is a directory symlink; setuptools build_py cannot copy it.
"sglang.multimodal_gen" = [".claude/*"]

[tool.setuptools.packages.find]
exclude = [
  "assets*",
  "benchmark*",
  "docs*",
  "dist*",
  "playground*",
  "scripts*",
  "sglang.kernels.aot*",
  "tests*",
]

[tool.wheel]
exclude = [
  "assets*",
  "benchmark*",
  "docs*",
  "dist*",
  "playground*",
  "scripts*",
  "tests*",
]

[tool.setuptools_scm]
root = ".."
version_file = "sglang/_version.py"
git_describe_command = ["python3", "python/tools/get_version_tag.py"]
# Allow editable installs even when .git metadata is not available.
fallback_version = "0.0.0.dev0"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
