[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang"
dynamic = ["version"]
description = "SGLang is a fast serving framework for large language models and vision language models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]

# torch_tpu and libtpu are pinned to specific wheels published to a private
# package server (workload-identity auth on CI; gcloud ADC on dev); see the
# [[tool.uv.index]] block below. torch and jax[tpu] are installed alongside by
# scripts/ci/tpu/tpu_ci_install_dependency.sh. Installing this pyproject
# requires credentials for the torch-tpu virtual registry.
dependencies = [
  "IPython",
  "aiohttp",
  "anthropic>=0.20.0",
  "blobfile==3.0.0",
  "av",
  "build",
  "compressed-tensors",
  "datasets",
  "einops",
  "fastapi",
  "easydict",
  "gguf",
  "hf_transfer",
  "huggingface_hub",
  "interegular",
  "llguidance>=0.7.11,<0.8.0",
  "modelscope",
  "msgspec",
  "ninja",
  "numpy",
  "openai-harmony==0.0.4",
  "openai==2.6.1",
  "orjson",
  "outlines==0.1.11",
  "packaging",
  "partial_json_parser",
  "pillow",
  "prometheus-client>=0.20.0",
  "psutil",
  "py-spy",
  "pybase64",
  "pydantic",
  "python-multipart",
  "pyzmq>=25.1.2",
  "requests",
  "scipy",
  "sentencepiece",
  "setproctitle",
  "soundfile==0.13.1",
  "tiktoken",
  "timm==1.0.16",
  "torchao==0.9.0",
  "tqdm",
  "mistral_common>=1.11.0",
  "transformers==5.8.1",
  "uvicorn",
  "uvloop",
  "xgrammar==0.2.0",
  "smg-grpc-servicer>=0.5.0",
  "torch-tpu==0.1.1.dev20260515095303",
  # Keep libtpu (PJRT runtime) pinned with the torch-tpu wheel. libtpu 0.0.41
  # regresses GDN compilation with scoped VMEM OOMs in CI.
  "libtpu==0.0.40",
]

[project.optional-dependencies]
checkpoint-engine = ["checkpoint-engine==0.1.2"]

tracing = [
  "opentelemetry-api",
  "opentelemetry-exporter-otlp",
  "opentelemetry-exporter-otlp-proto-grpc",
  "opentelemetry-sdk",
]

test = [
  "accelerate",
  "expecttest",
  "gguf",
  "jsonlines",
  "matplotlib",
  "pandas",
  "peft>=0.18.0",
  "pytest",
  "sentence_transformers",
  "tabulate",
]

# Mirrors srt_npu / all_npu / dev_npu shape. torch_tpu and libtpu are
# pinned in `dependencies`; jax[tpu] is installed by the CI script. See header.
srt_tpu = []
all_tpu = []
dev_tpu = ["sglang[all_tpu]", "sglang[test]"]

[project.urls]
"Homepage" = "https://github.com/sgl-project/sglang"
"Bug Tracker" = "https://github.com/sgl-project/sglang/issues"

[project.entry-points."sglang.srt.platforms"]
tpu = "sglang.srt.hardware_backend.tpu:activate"

[project.scripts]
sglang = "sglang.cli.main:main"

[tool.setuptools.package-data]
"sglang" = [
  "srt/**/*",
  "jit_kernel/**/*"
]

[tool.setuptools.packages.find]
exclude = [
  "assets*",
  "benchmark*",
  "docs*",
  "dist*",
  "playground*",
  "scripts*",
  "tests*",
]

[tool.wheel]
exclude = [
  "assets*",
  "benchmark*",
  "docs*",
  "dist*",
  "playground*",
  "scripts*",
  "tests*",
]

[tool.setuptools_scm]
root = ".."
version_file = "sglang/_version.py"
git_describe_command = ["python3", "python/tools/get_version_tag.py"]
# Allow editable installs even when .git metadata is not available.
fallback_version = "0.0.0.dev0"

[tool.uv]
keyring-provider = "subprocess"

[[tool.uv.index]]
name = "torch-tpu-registry"
# torch-tpu-virtual-registry is a virtual registry that combines the PyTorch CPU index, Torch TPU index,
# and the PyPI index. It prioritizes package installs as such: PyTorch CPU index > Torch TPU index > PyPI index.
url = "https://oauth2accesstoken@us-python.pkg.dev/ml-oss-artifacts-transient/torch-tpu-virtual-registry/simple/"
