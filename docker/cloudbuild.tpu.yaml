# Cloud Build: build the SGLang TPU test image from sglang-tpu-base and push to Artifact Registry.
#
substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu"
  _TAG: "latest"
  _BASE_IMAGE: "us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu-base:latest"

serviceAccount: "projects/sglang-torchtpu/serviceAccounts/tpu-ci@sglang-torchtpu.iam.gserviceaccount.com"

# GCS copy of the build log, streamed into the GitHub Actions job log by
# run_cloudbuild.py. External collaborators cannot open this project's Cloud
# Console / Cloud Logging, so the Actions log is the only surface they can read.
# LEGACY keeps the Cloud Logging / console log view working for maintainers.
logsBucket: "gs://sglang-torchtpu_cloudbuild/logs"

options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-final
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        DOCKER_BUILDKIT=1 docker build \
          -f docker/tpu.Dockerfile \
          --build-arg BASE_IMAGE="${_BASE_IMAGE}" \
          -t "${_IMAGE}:${_TAG}" .

images:
  - "${_IMAGE}:${_TAG}"
