# Cloud Build: override torch_tpu wheel in the built SGLang TPU image and push to Artifact Registry.
substitutions:
  _IMAGE: "sglang-tpu"
  _TAG: "latest"
  _BASE_IMAGE: "sglang-tpu:latest"
  _WHEEL: "torch-tpu"

options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8

steps:
  - id: override-wheel
    name: gcr.io/cloud-builders/docker
    env:
      - "WHEEL=${_WHEEL}"
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "============================================================"
        echo "Cloud Build: Starting Single-Layer Mutation"
        echo "Base Container: ${_BASE_IMAGE}"
        echo "Wheel candidate configured"
        echo "Target Tag:     ${_IMAGE}:${_TAG}"
        echo "============================================================"

        TOKEN="$$(curl -sf -H 'Metadata-Flavor: Google' \
          http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token \
          | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')"
        printf '%s' "$$TOKEN" > /workspace/gcp_token

        mkdir -p /workspace/wheel_override
        touch /workspace/wheel_override/.gitkeep
        LOCAL_WHL="$$(find /workspace/wheel_override -name '*.whl' 2>/dev/null | head -n 1 || true)"
        if [[ -n "$$LOCAL_WHL" && -f "$$LOCAL_WHL" ]]; then
          echo "Using pre-staged candidate wheel file: $$LOCAL_WHL ($$(ls -lh "$$LOCAL_WHL"))"
        elif [[ "$${WHEEL}" == gs://* ]]; then
          echo "Fetching wheel from GCS: $${WHEEL}"
          tok_file="/workspace/tok.txt"
          printf '%s' "$$TOKEN" > "$$tok_file"
          gcloud storage cp "$${WHEEL}" /workspace/wheel_override/ --access-token-file="$$tok_file"
          rm -f "$$tok_file"
        elif [[ "$${WHEEL}" == https://* ]]; then
          echo "Fetching wheel from HTTPS URL"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            -O --output-dir /workspace/wheel_override "$${WHEEL}"
        elif [[ "$${WHEEL}" == http://* ]]; then
          echo "Wheel downloads require HTTPS or gs://" >&2
          exit 1
        fi

        DOCKER_BUILDKIT=1 docker build \
          -f docker/tpu-override-wheel.Dockerfile \
          --secret id=gcp_token,src=/workspace/gcp_token \
          --build-arg BASE_IMAGE="${_BASE_IMAGE}" \
          --build-arg WHEEL="$${WHEEL}" \
          -t "${_IMAGE}:${_TAG}" .
        rm -rf /workspace/gcp_token /workspace/wheel_override/*.whl

images:
  - "${_IMAGE}:${_TAG}"
