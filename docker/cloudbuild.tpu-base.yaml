# Cloud Build: build the SGLang TPU base image and push to Artifact Registry.
#
substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu-base"
  _TAG: "latest"

serviceAccount: "projects/sglang-torchtpu/serviceAccounts/tpu-ci@sglang-torchtpu.iam.gserviceaccount.com"

# GCS copy of the build log, streamed into the GitHub Actions job log by
# run_cloudbuild.py; see docker/cloudbuild.tpu.yaml for why.
logsBucket: "gs://sglang-torchtpu_cloudbuild/logs"

options:
  logging: LEGACY
  machineType: E2_HIGHCPU_8

steps:
  # Use the build service account for nightly wheels; keep its token out of
  # the Docker context, image layers, build arguments, and logs.
  - id: registry-auth
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    volumes:
      - name: registry-auth
        path: /registry-auth
    args:
      - -c
      - |
        set -euo pipefail
        umask 077
        token="$$(gcloud auth print-access-token)"
        printf 'machine us-python.pkg.dev login oauth2accesstoken password %s\n' \
          "$$token" > /registry-auth/netrc

  - id: build-base
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    volumes:
      - name: registry-auth
        path: /registry-auth
    args:
      - -c
      - |
        set -euo pipefail
        trap 'rm -f /registry-auth/netrc' EXIT
        DOCKER_BUILDKIT=1 docker build \
          --secret id=gar_netrc,src=/registry-auth/netrc \
          -f docker/tpu-base.Dockerfile \
          -t "${_IMAGE}:${_TAG}" .

images:
  - "${_IMAGE}:${_TAG}"
