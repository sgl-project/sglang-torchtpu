# CI slice shapes. A CI node pool is any pool whose nodes carry a ci-tpu-pool label (unique
# per pool); its shape is its cloud.google.com/gke-tpu-topology label. Every lane may run on
# every pool of a shape: reconcile_quota.py gives each lane one ClusterQueue per shape, all
# in the shape's Kueue cohort, and splits the shape's live slices between them.
#
#   lanes     : one queue per lane and shape, tpu-<lane without dashes>-<hosts>h.
#   priority  : holds every slice no lane reserves, gets freed slices first, and lends them
#               to the other lanes while idle. Running jobs are never preempted.
#   shapes    : topology -> hosts per slice, and min_hosts per lane: hosts that lane always
#               keeps and never lends. A whole number of slices.
#
# A new pool of a listed shape needs no edit here (label it ci-tpu-pool=<unique name>); a
# new shape is one line under `shapes`.
lanes: [pr-gate, nightly]
priority: nightly
shapes:
  2x2x1: { hosts: 1, min_hosts: { pr-gate: 5 } }
  2x2x2: { hosts: 2 }
