# Kueue gang-admits the TPU CI JobSets against slice quota.
# Install, ConfigMap settings and verification: README.md "Enabling Kueue".
#
# One ResourceFlavor per slice: GKE tpu7x nodes expose no per-slice label, so ci-tpu-pool
# is the finest slice selector and a pool must hold exactly one slice.
# tpu7x-standard-4t = 4 chips/host -> 2x2x1 = 1 node, 2x2x2 = 2 nodes.
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x1-pr-gate
spec:
  nodeLabels:
    ci-tpu-pool: pr-gate
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x2-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
# 4 nodes x 4 chips = 16, each node a whole slice. Quota'd at 12 so one node going
# NotReady does not over-state it -- an over-stated quota admits a gang the cluster
# cannot hold, and the extra pod then goes Pending inside an *admitted* workload.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: tpu-singlehost
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: tpu7x-2x2x1-pr-gate
          resources:
            - name: "google.com/tpu"
              nominalQuota: 12
---
# One slice = 8 chips = one concurrent job. No headroom possible here: a 2-host job needs
# exactly 8, so any lower value admits nothing. Second slice = new pool + new flavor +
# one more entry in this list; no workflow change.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: tpu-multihost
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: tpu7x-2x2x2-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: tpu-singlehost
  namespace: tpu-ci
spec:
  clusterQueue: tpu-singlehost
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: tpu-multihost
  namespace: tpu-ci
spec:
  clusterQueue: tpu-multihost
