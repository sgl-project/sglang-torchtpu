# Kueue gang-admits the TPU CI JobSets against slice quota.
# Install, ConfigMap settings and verification: README.md "Enabling Kueue".
# Pools and their chip counts: provision-pools.sh.
#
# One ResourceFlavor per slice: GKE tpu7x nodes expose no per-slice label, so ci-tpu-pool
# is the finest slice selector and a multi-host pool must hold exactly one slice.
# tpu7x-standard-4t = 4 chips/host -> 2x2x1 = 1 node, 2x2x2 = 2 nodes, 2x2x4 = 4 nodes.
#
# One ClusterQueue per (lane, host count), matching topology.yaml's `queue`. Shapes must
# NOT share a queue: a 2-host job needs 8 chips, which a single-host flavor satisfies on
# quota while being unschedulable, so mixing them would admit a workload that can never run.
# Lanes are separate so pr-gate and nightly cannot borrow each other's capacity.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x1-pr-gate
spec:
  nodeLabels:
    ci-tpu-pool: pr-gate
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x2-pr-gate
spec:
  nodeLabels:
    ci-tpu-pool: pr-gate-2h
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x1-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly-1h
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x2-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x4-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly-4h
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
# pr-gate 1-host: 6 nodes x 4 chips = 24, each node a whole slice. Quota'd at 20 so one node
# going NotReady does not over-state it -- an over-stated quota admits a gang the cluster
# cannot hold, and the extra pod goes Pending inside an *admitted* workload.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-prgate-1h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: tpu7x-2x2x1-pr-gate
          resources:
            - name: "google.com/tpu"
              nominalQuota: 20
---
# pr-gate 2-host: one slice = 8 chips = one concurrent job. No headroom possible: a 2-host
# job needs exactly 8, so any lower value admits nothing.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-prgate-2h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: tpu7x-2x2x2-pr-gate
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
---
# nightly 1-host: 2 nodes x 4 = 8. Taken at full capacity rather than under-stated -- at two
# nodes, one node of headroom would cost half the lane. waitForPodsReady absorbs the drift
# by evicting and requeuing instead of deadlocking.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-1h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: tpu7x-2x2x1-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
---
# nightly 2-host: one slice. A second 2-host slice = new pool + new flavor + one more entry
# in this flavors list; no workflow change.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-2h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: tpu7x-2x2x2-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
---
# nightly 4-host: one slice = 16 chips. Exact, same reason as the 2-host queues.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-4h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu"]
      flavors:
        - name: tpu7x-2x2x4-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 16
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-prgate-1h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-prgate-1h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-prgate-2h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-prgate-2h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-1h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-1h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-2h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-2h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-4h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-4h
