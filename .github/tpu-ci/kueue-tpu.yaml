# Kueue gang-admits the TPU CI JobSets. Install and verification: README "Enabling Kueue".
#
# One ResourceFlavor per slice -- GKE tpu7x nodes expose no per-slice label, so ci-tpu-pool
# is the finest selector and a multi-host pool must hold exactly one slice.
# One ClusterQueue per (lane, hosts), matching topology.yaml's `queue`.
#
# Quotas here are a startup default: kueue-quota-reconciler.yaml resets them every 10min
# from live allocatable chips. cpu and memory are derived from the chip count (pods take
# 4 chips / 4 cpu / 32Gi, so 1 cpu and 8Gi per chip) to keep TPU the only binding resource.
# Every resource a pod requests must appear in coveredResources or nothing is admittable.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x1-pr-gate
spec:
  nodeLabels:
    ci-tpu-pool: pr-gate
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x2-pr-gate
spec:
  nodeLabels:
    ci-tpu-pool: pr-gate-2h
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x1-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly-1h
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x2-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x2-nightly-b
spec:
  nodeLabels:
    ci-tpu-pool: nightly-b
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tpu7x-2x2x4-nightly
spec:
  nodeLabels:
    ci-tpu-pool: nightly-4h
  tolerations:
    - key: google.com/tpu
      operator: Exists
      effect: NoSchedule
---
# 2 nodes x 4 chips = 8, each node a whole slice.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-prgate-1h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x1-pr-gate
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: 64Gi
---
# One slice = 8 chips = one 2-host job, or two 1-host PR jobs (one per host). No headroom
# possible: a 2-host job needs exactly 8, so any lower value admits nothing.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-prgate-2h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x2-pr-gate
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: 64Gi
---
# 3 nodes x 4 = 12.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-1h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x1-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 12
            - name: "cpu"
              nominalQuota: 12
            - name: "memory"
              nominalQuota: 96Gi
---
# One slice. A second = new pool + new flavor + one more entry here; no workflow change.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-2h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x2-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: 64Gi
        - name: tpu7x-2x2x2-nightly-b
          resources:
            - name: "google.com/tpu"
              nominalQuota: 8
            - name: "cpu"
              nominalQuota: 8
            - name: "memory"
              nominalQuota: 64Gi
---
# One slice = 16 chips. Exact, same reason as the 2-host queues.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: tpu-nightly-4h
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  resourceGroups:
    - coveredResources: ["google.com/tpu", "cpu", "memory"]
      flavors:
        - name: tpu7x-2x2x4-nightly
          resources:
            - name: "google.com/tpu"
              nominalQuota: 16
            - name: "cpu"
              nominalQuota: 16
            - name: "memory"
              nominalQuota: 128Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-prgate-1h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-prgate-1h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-prgate-2h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-prgate-2h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-1h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-1h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-2h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-2h
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: tpu-nightly-4h
  namespace: tpu-ci
spec:
  clusterQueue: tpu-nightly-4h
