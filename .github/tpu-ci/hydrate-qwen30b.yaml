# One-time hydration for the Qwen3-30B-A3B-FP8 ReadOnlyMany weights.
#
# Step 1 of the ROX flow: create a ReadWriteOnce Hyperdisk ML volume (qwen30b-rwo) and
# download the FP8 checkpoint into it. A hydrated RWO Hyperdisk is later re-referenced
# by a ReadOnlyMany PV (pvc-qwen30b-rox.yaml); on GKE >=1.30.2 the disk auto-converts
# to READ_ONLY_MANY, so every host of the multi-host JobSet can mount it read-only.
#
#   kubectl -n tpu-ci apply -f .github/tpu-ci/hydrate-qwen30b.yaml
#   # wait for the Job to Complete, then follow pvc-qwen30b-rox.yaml
#
# The SC is Retain, so deleting qwen30b-rwo after hydration keeps the underlying disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen30b-rwo
  namespace: tpu-ci
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: hyperdisk-ml-smoke   # 400Mi/s provisioned throughput (cost-modest)
  resources:
    requests:
      storage: 80Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hydrate-qwen30b
  namespace: tpu-ci
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # Run on a TPU node (spare CPU; the small CPU pools are full). No TPU chip is
      # requested, so this consumes only CPU, not the reservation.
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        ci-tpu-pool: pr-gate
      tolerations:
        - key: google.com/tpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: qwen30b-rwo
      containers:
        - name: hydrate
          image: python:3.12-slim
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              pip install --no-cache-dir "huggingface_hub[hf_transfer]"
              # Keep every byte on the Hyperdisk (not the node's ephemeral disk).
              export HF_HUB_ENABLE_HF_TRANSFER=1 HF_HOME=/weights/.hf-cache
              python - <<'PY'
              from huggingface_hub import snapshot_download
              p = snapshot_download(
                  "Qwen/Qwen3-30B-A3B-FP8",
                  local_dir="/weights/Qwen3-30B-A3B-FP8",
                  # weights + config only; skip the duplicate .pth / originals if any
                  ignore_patterns=["*.pth", "original/*", "*.gguf"],
              )
              print("hydrated ->", p)
              PY
              echo "== contents =="; ls -la /weights/Qwen3-30B-A3B-FP8
              echo "== size =="; du -sh /weights/Qwen3-30B-A3B-FP8
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: weights
              mountPath: /weights
