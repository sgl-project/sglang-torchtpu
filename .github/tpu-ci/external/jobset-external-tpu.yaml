# External TPU test workload -- ONE JobSet per group, one slice. Rendered by
# .github/tpu-ci/external/render_external_jobset.py from external-topology.yaml. Render vars (do NOT
# write them as dollar-brace tokens in these comments -- the renderer would substitute them
# here too):
#   IMAGE          digest-pinned image (Artifact Registry in Project A; external nodes pull it)
#   RUN_NAME       DNS-safe label for the JobSet
#   NAMESPACE      target namespace (default; no Kueue on this cluster)
#   HOSTS          completions/parallelism (== the slice's host count)
#   TOPOLOGY       cloud.google.com/gke-tpu-topology label
#   NODEPOOL       cloud.google.com/gke-nodepool -- pins the whole gang to ONE slice
#   ACCELERATOR    cloud.google.com/gke-tpu-accelerator label (tpu7x)
#   ACTIVE_DEADLINE JobSet activeDeadlineSeconds
#   MODE           launch | self | exec (see "Launch model" below)
#   LAUNCH_SCRIPT  launch: the group's recipe (relative to benchmark/tpu/)
#   SUITE          self: the run_suite suite the files register to
#   EXEC_CMD       exec: the command every host runs
#   TEST_FILES     space-separated test files of the group
#   MODEL_PATH     serve model dir (gcsfuse mount path + weights prefix + model subdir)
#   TP_SIZE/EP_SIZE  parallelism (== HOSTS x devices_per_host)
#   EXTRA_ARGS     loader/serve flags appended by the recipe (gcsfuse-tuned; see README)
#   TIMEOUT_PER_FILE per-file timeout for rank-0's live-server run
#   WEIGHTS_BUCKET / WEIGHTS_MOUNT_OPTIONS / WEIGHTS_MOUNT_PATH   gcsfuse CSI attributes
#   WEIGHTS_DIR    the bucket's weights/ dir; linked to /weights, the in-project path
#   EPHEMERAL_LIMIT  gke-gcsfuse ephemeral-storage-limit (must exceed the file cache size)
#
# Launch model, by MODE:
#   * launch -- mirrors the in-project multi-host template: every host runs the group's
#     recipe (it owns model + config); rank 0 runs each TEST_FILES entry in LIVE-SERVER mode
#     against the one server; workers serve until the leader tears down, then exit 0.
#   * self   -- single-host tests that launch their own server. There is no 1-host slice,
#     so rank 0 drops the slice-wide TPU env and runs each file through run_suite on its
#     own host; the other ranks exit 0 and idle.
#   * exec   -- mirrors the in-project exec mode: every host runs EXEC_CMD; rank 0 gates.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: ${RUN_NAME}-
  namespace: ${NAMESPACE}
spec:
  ttlSecondsAfterFinished: 7200
  failurePolicy:
    maxRestarts: 0
  network:
    enableDNSHostnames: true         # stable pod DNS for multi-host rendezvous
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          completions: ${HOSTS}
          parallelism: ${HOSTS}
          activeDeadlineSeconds: ${ACTIVE_DEADLINE}
          template:
            metadata:
              labels:
                app: external-tpu-ci
              annotations:
                gke-gcsfuse/volumes: "true"
                gke-gcsfuse/ephemeral-storage-limit: "${EPHEMERAL_LIMIT}"
            spec:
              restartPolicy: Never
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: ${ACCELERATOR}
                cloud.google.com/gke-tpu-topology: ${TOPOLOGY}
                cloud.google.com/gke-nodepool: ${NODEPOOL}
              tolerations:
                - key: google.com/tpu
                  operator: Exists
                  effect: NoSchedule
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi  # tier-2/3 compile caches, as in-project
                - name: weights
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: ${WEIGHTS_BUCKET}
                      mountOptions: "${WEIGHTS_MOUNT_OPTIONS}"
              containers:
                - name: test
                  image: ${IMAGE}
                  imagePullPolicy: IfNotPresent
                  env:
                    # HF token for gated datasets; optional -- pods start without it.
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: hf-token
                          key: token
                          optional: true
                  command: ["bash", "-lc"]
                  args:
                    - |
                      set -uo pipefail
                      cd /sgl-workspace/sglang
                      export HF_HOME=/tmp/hf SGLANG_PLATFORM=tpu SGLANG_IS_IN_CI=true PYTHONUNBUFFERED=1
                      # torch_tpu's tier-3 cache defaults to $HOME, on the pod's ephemeral
                      # overlay; warmup fills the node disk and the kubelet evicts the pod.
                      export TORCH_TPU_TIER3_ROOT=/dev/shm/torch_tpu_tier3
                      # Tests and recipes hard-code the in-project weights path.
                      [ -e /weights ] || ln -s "${WEIGHTS_DIR}" /weights
                      # No internet on this cluster: the GSM8K evals read the cached
                      # /tmp/test.jsonl, and HF repo ids resolve from the bucket's offline
                      # hub cache (weights/hf-hub, staged from huggingface.co).
                      [ -f /tmp/test.jsonl ] || cp /weights/datasets/gsm8k/test.jsonl /tmp/test.jsonl
                      export HF_HUB_CACHE=/weights/hf-hub HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
                      # gpt-oss's harmony encoding loads its tiktoken vocab from here.
                      export TIKTOKEN_ENCODINGS_BASE=/weights/datasets/tiktoken
                      NNODES=$(awk -F, '{print NF}' <<<"${TPU_WORKER_HOSTNAMES:-x}")
                      RANK="${TPU_WORKER_ID:-0}"
                      echo "run=${RUN_NAME} mode=${MODE} nnodes=$NNODES rank=$RANK"

                      if [ "${MODE}" = "exec" ]; then
                        # Name the test before anything can fail, as the other modes do.
                        echo "== test files: ${TEST_FILES} =="
                        t0=$SECONDS
                        ${EXEC_CMD}
                        rc=$?
                        # Teardown SIGTERMs surviving workers; rank-0 gates real failures.
                        if [ "$RANK" != "0" ] && [ "$rc" = 143 ]; then
                          echo "worker rank=$RANK: SIGTERM during teardown; success"; rc=0
                        fi
                        # Rank 0 only: every pod runs the same command, and N records
                        # would be N rows for one test.
                        if [ "$RANK" = "0" ]; then
                          passed=true
                          [ "$rc" -eq 0 ] || passed=false
                          echo "========== TIMINGS BEGIN =========="
                          printf '{"file": "%s", "passed": %s, "elapsed": %s}\n' \
                            "${TEST_FILES}" "$passed" "$((SECONDS - t0))"
                          echo "========== TIMINGS END =========="
                        fi
                        exit $rc
                      fi

                      if [ "${MODE}" = "self" ]; then
                        if [ "$RANK" != "0" ]; then
                          echo "rank $RANK idle for single-host tests; exiting 0"; exit 0
                        fi
                        echo "== test files: ${TEST_FILES} =="
                        # libtpu on GKE is env-driven: the injected TPU_* vars describe the
                        # whole slice, so a single-host engine would wait for its idle peer.
                        # Without them, local hardware discovery finds this host alone.
                        unset TPU_WORKER_ID TPU_WORKER_HOSTNAMES TPU_PROCESS_ADDRESSES \
                              TPU_TOPOLOGY TPU_TOPOLOGY_WRAP TPU_TOPOLOGY_ALT TPU_HOST_BOUNDS \
                              TPU_ACCELERATOR_TYPE
                        for v in $(compgen -e | grep '^MEGASCALE'); do unset "$v"; done
                        rc=0
                        # One run_suite per file: each prints its own TIMINGS record.
                        for f in ${TEST_FILES}; do
                          python3 test/run_suite.py --hw tpu --suite ${SUITE} --nightly --continue-on-error \
                            --test-file "$f" --timeout-per-file ${TIMEOUT_PER_FILE} || rc=1
                        done
                        exit $rc
                      fi

                      # Launch mode only: the other modes' tests read these names themselves.
                      # EXTRA_ARGS is single-quoted so JSON flags survive, e.g.
                      # --model-loader-extra-config {"num_threads":8}
                      export MODEL="${MODEL_PATH}" TP_SIZE="${TP_SIZE}" EP_SIZE="${EP_SIZE}"
                      export EXTRA_ARGS='${EXTRA_ARGS}'
                      echo "model=$MODEL tp=$TP_SIZE"
                      # Every host runs the launch group's recipe (owns model+config). Announce
                      # the files BEFORE anything can fail so a bring-up death is still attributed
                      # to the test, not the job.
                      echo "== test files: ${TEST_FILES} =="
                      ( HOST=127.0.0.1 PORT=30000 ENABLE_PROFILER_ENDPOINT=0 ENABLE_COMPILE_CACHE=0 \
                          bash "benchmark/tpu/${LAUNCH_SCRIPT}" ) > >(tee /tmp/server.log) 2>&1 &
                      spid=$!
                      if [ "$RANK" = "0" ]; then
                        ok=0
                        # 90 min of health polling: a 450G checkpoint's first gcsfuse
                        # read plus tp=16 compile warmup can exceed the old 50 min cap.
                        HEALTH_TRIES=540; HEALTH_POLL=10; HEALTH_CURL_MAX=5
                        for i in $(seq 1 "$HEALTH_TRIES"); do
                          curl -sf --max-time "$HEALTH_CURL_MAX" http://127.0.0.1:30000/health_generate >/dev/null 2>&1 && { ok=1; break; }
                          kill -0 "$spid" 2>/dev/null || { echo "server exited early"; break; }
                          sleep "$HEALTH_POLL"
                        done
                        echo "== server.log tail =="; tail -n 60 /tmp/server.log
                        [ "$ok" = 1 ] || { echo "FAIL: server never healthy"; exit 1; }
                        # rank 0 runs every file in this launch group against the one server.
                        rc=0
                        timings=""
                        for f in ${TEST_FILES}; do
                          echo "== live-server test: $f =="
                          t0=$SECONDS
                          SGLANG_TPU_USE_LIVE_SERVER=1 BASE_URL=http://127.0.0.1:30000 timeout ${TIMEOUT_PER_FILE} python3 "$f"
                          frc=$?
                          passed=true
                          if [ "$frc" -ne 0 ]; then passed=false; rc=1; fi
                          timings="$timings{\"file\": \"$f\", \"passed\": $passed, \"elapsed\": $((SECONDS - t0))}"$'\n'
                        done
                        echo "========== TIMINGS BEGIN =========="
                        printf '%s' "$timings"
                        echo "========== TIMINGS END =========="
                        kill "$spid" 2>/dev/null || true
                        exit $rc
                      else
                        # A worker is a shard of the same server as rank-0; rank-0's exit code
                        # gates every real failure. Teardown (leader gone -> peer disconnect /
                        # SIGTERM 143 / SIGKILL 137 on "Connection reset by peer") passes; a
                        # genuine local crash (OOM 137 without that signature, SIGSEGV 139) fails.
                        wait "$spid"; src=$?
                        if [ "$src" = 137 ] && grep -q "Connection reset by peer" /tmp/server.log; then
                          echo "worker rank=$RANK: leader closed (teardown); success"; exit 0
                        fi
                        case "$src" in
                          137|139) echo "worker rank=$RANK server crashed rc=$src"; exit 1 ;;
                          *)       echo "worker rank=$RANK done (server rc=$src)"; exit 0 ;;
                        esac
                      fi
                  resources:
                    requests:
                      google.com/tpu: "4"
                      cpu: "4"
                      memory: 32Gi
                    limits:
                      google.com/tpu: "4"
                  volumeMounts:
                    - name: dshm
                      mountPath: /dev/shm
                    - name: weights
                      mountPath: ${WEIGHTS_MOUNT_PATH}
                      readOnly: true
                  # NO securityContext.privileged here: the external cluster's
                  # ValidatingAdmissionPolicy 'cf-disallow-privileged-controllers'
                  # rejects Job creation outright for privileged containers (the
                  # in-project template runs privileged; GKE TPU access needs only
                  # the google.com/tpu resource + device plugin).
