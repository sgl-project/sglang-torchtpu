# External TPU test config for the `external-nightly-*` suites. See README.md.
#
# Partner-internal identifiers (cluster name, project id, nodepool names) are NOT stored in
# source -- they come from repo secrets at workflow time:
#   secrets.EXTERNAL_CLUSTER, secrets.EXTERNAL_PROJECT, secrets.EXTERNAL_NODEPOOL_<shape>
# This file holds only non-sensitive structure. Each suite names the SECRET that holds its
# nodepool (`nodepool_var`), resolved by the workflow; the value never lands in git.

cluster:
  namespace: default            # no Kueue; JobSets land here directly
  accelerator: tpu7x
  # tpu7x-standard-4t = 4 chips/host x 2 TensorCores/chip = 8 devices/host. tp = hosts x 8.
  devices_per_host: 8

weights:
  # The CI artifacts bucket doubles as the weight store under weights/<model>/. Stage with:
  #   gcloud storage rsync -r ./<model> gs://sglang-torchtpu-ci-artifacts/weights/<model>
  bucket: sglang-torchtpu-ci-artifacts
  prefix: weights
  mount_path: /gcs-weights
  # gcsfuse mount tuned for safetensors weight loading. cache-file-for-range-read turns the
  # loader's many small seeky reads into one whole-file sequential download into a bounded,
  # node-local file cache; every subsequent read hits local disk. See README.
  mount_options: "implicit-dirs,file-cache:max-size-mb:102400,file-cache:cache-file-for-range-read:true"
  ephemeral_storage_limit: 120Gi
  default_extra_args: "--weight-loader-disable-mmap"

# Suite name -> slice shape. The suite fixes hosts/topology; `nodepool_vars` lists the repo
# secrets holding this shape's interchangeable slices (a GKE multi-host nodepool IS one
# physical slice). There is no Kueue on this cluster, so discovery round-robins the launch
# groups across these slices -- up to len(nodepool_vars) groups of a shape run in PARALLEL;
# any beyond that share a slice and serialize (their pods stay Pending until it frees).
# The nodepool NAMES stay out of source: each entry is the NAME of a repo secret.
suites:
  external-nightly-2x2x2:
    hosts: 2                                   # tp=16 (8 chips, 2 hosts)
    topology: 2x2x2
    nodepool_vars:                             # 4 interchangeable 2x2x2 slices
      - EXTERNAL_NODEPOOL_2X2X2_0
      - EXTERNAL_NODEPOOL_2X2X2_1
      - EXTERNAL_NODEPOOL_2X2X2_2
      - EXTERNAL_NODEPOOL_2X2X2_3
    # Tests wired here instead of discovered, as feature-validation-tpu.yml's static jobs
    # are in-project: every pod runs `cmd`. A `pd` entry gets prefill and decode replicated
    # jobs (CI_PD_ROLE set); 1+1 shares one slice, and roles that each fill a slice take a
    # slice pair. Without `pd`, every host of one slice runs `cmd` and rank 0 gates.
    commands:
      - files: test/registered/e2e/hardware_backend/tpu/test_node_normalization.py
        cmd: env JAX_PLATFORMS=cpu TORCH_TPU_TOPOLOGY=2,2,2,2 python3 test/registered/e2e/hardware_backend/tpu/test_node_normalization.py -v
      - files: test/registered/tpu/e2e/test_diffusion_tpu_multihost_collectives.py
        cmd: python3 test/registered/tpu/e2e/test_diffusion_tpu_multihost_collectives.py
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost.py integration
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_kv_offload_resharding.py
        cmd: env MODEL_PROFILE=gpt_oss_120b python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_kv_offload_resharding.py
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload.py
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload_spec.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload_spec.py integration
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload_spec_reshard.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload_spec_reshard.py integration
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_spec_gsm8k.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_spec_gsm8k.py integration
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_qwen3_coder_480b_pd_multihost_kv_offload_resharding.py
        cmd: env MODEL_PROFILE=qwen3_coder_480b python3 test/registered/tpu/e2e/test_tpu_qwen3_coder_480b_pd_multihost_kv_offload_resharding.py
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_qwen3_vl_8b_pd_multihost_eagle3.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_qwen3_vl_8b_pd_multihost_eagle3.py integration
        pd: {prefill_hosts: 2, decode_hosts: 2}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_decode_radix.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_decode_radix.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_kv_offload.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_kv_offload.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_kv_offload_spec.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_kv_offload_spec.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_kv_offload_dflash.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_kv_offload_dflash.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      # Issue #1066. bf16 KV until the TPU image ships the MXINT8 backend
      # extension (with the test's default mxint8 both engines refuse to start);
      # then drop the PD_KV_CACHE_DTYPE override.
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_prefix_cache_kv_offload_spec_mxint8.py
        cmd: env PD_KV_CACHE_DTYPE=bfloat16 python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_prefix_cache_kv_offload_spec_mxint8.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_spec.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_spec.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_eagle3_perf.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_eagle3_perf.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_dflash_perf.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_dflash_perf.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_eagle3_dpa_perf.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_eagle3_dpa_perf.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_dflash_dpa_perf.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_pp_dflash_dpa_perf.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_qwen3_8b_pd_singlehost_dspark_recompile.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_qwen3_8b_pd_singlehost_dspark_recompile.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_qwen3_8_27b_pd_singlehost_mtp_recompile.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_qwen3_8_27b_pd_singlehost_mtp_recompile.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
      - files: test/registered/tpu/e2e/test_tpu_qwen3_8_27b_pd_singlehost_dflash2_recompile.py
        cmd: python3 test/registered/tpu/e2e/test_tpu_qwen3_8_27b_pd_singlehost_dflash2_recompile.py integration
        pd: {prefill_hosts: 1, decode_hosts: 1}
  # Single-host tests that launch their own server (no launch dict). There is no 1-host
  # slice here, so a group takes a whole 2x2x2 slice: rank 0 drops the slice-wide TPU env
  # and runs each file through run_suite on its own host; rank 1 idles.
  external-nightly-1host:
    hosts: 2
    topology: 2x2x2
    self_launch: true
    nodepool_vars:
      - EXTERNAL_NODEPOOL_2X2X2_0
      - EXTERNAL_NODEPOOL_2X2X2_1
      - EXTERNAL_NODEPOOL_2X2X2_2
      - EXTERNAL_NODEPOOL_2X2X2_3
  external-nightly-2x2x4:
    hosts: 4                                   # tp=32 (16 chips, 4 hosts)
    topology: 2x2x4
    nodepool_vars:                             # 2 interchangeable 2x2x4 slices
      - EXTERNAL_NODEPOOL_2X2X4_0
      - EXTERNAL_NODEPOOL_2X2X4_1
