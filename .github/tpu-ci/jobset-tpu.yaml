# Unified TPU test workload -- ONE JobSet for ANY host count. Rendered by
# .github/tpu-ci/render_jobset.py. Render vars (do NOT write them as dollar-brace tokens
# in these comments -- the renderer would substitute them here too):
#   IMAGE         digest-pinned image
#   HOSTS         completions/parallelism (single-host = 1)
#   TOPOLOGY/QUEUE slice shape and Kueue queue (looked up by host count in topology.yaml)
#   RUN_NAME      DNS-safe label for the JobSet (a suite name or a launch-group name)
#   SUITE         single-host: the run_suite suite; NIGHTLY_FLAG: --nightly or empty
#   LAUNCH_SCRIPT multi-host: the launch group's recipe (relative to benchmark/tpu/);
#                 a .py is a recipe config run by benchmark/tpu/launch_server.py
#   TEST_FILES    multi-host: space-separated test files rank-0 runs against the server
#   WEIGHTS_VOLUME / WEIGHTS_MOUNT   indented YAML blocks (empty when no weights PVC)
#   TIMEOUT_PER_FILE per-file timeout (run_suite.py single-host; `timeout` per live-server file)
#   PARTITION_FLAGS single-host run_suite partition arguments (empty when unsharded)
#   TEST_FILE_FLAG single-host exact-file selection (empty when running a whole suite)
#   CHIP_WORKERS_FLAG single-host --tpu-chip-workers (empty when chip sharing is off)
#   FULL_MATRIX   1 on nightly runs: tests that trim their sweep for the gate run it whole
#   SERVICE_ACCOUNT  indented serviceAccountName line (empty -> namespace default KSA)
# The renderer substitutes only those; the container's own $spid / TPU_WORKER_ID stay
# literal. Gating is handled by the kind-aware _tpu-test.
#
# Launch model (branch on NNODES, from GKE's TPU_WORKER_HOSTNAMES):
#   * single-host (nnodes<=1) -> each registered test self-launches (popen_launch_server);
#     run_suite runs the suite directly.
#   * multi-host  (nnodes>1)  -> every host runs the launch GROUP's recipe (it owns the
#     model + config); rank 0 runs each of the group's TEST_FILES in LIVE-SERVER mode
#     against the one server; workers serve until the leader tears down, then exit 0.
#     Files sharing an identical launch spec share this one server (grouping).
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  generateName: tpu-ci-${RUN_NAME}-
  namespace: tpu-ci
  labels:
    # Created suspended; Kueue releases it when a whole slice is free (reconcile_quota.py
    # keeps the queues).
    kueue.x-k8s.io/queue-name: ${QUEUE}
spec:
  ttlSecondsAfterFinished: 7200
  failurePolicy:
    maxRestarts: 0
  network:
    enableDNSHostnames: true       # stable pod DNS for multi-host rendezvous
  replicatedJobs:
    - name: slice
      replicas: 1
      template:
        spec:
          backoffLimit: 0
          completions: ${HOSTS}
          parallelism: ${HOSTS}
          # Set by render_jobset.py per mode (suite: derived from est_times).
          activeDeadlineSeconds: ${ACTIVE_DEADLINE}
          template:
            metadata:
              labels:
                app: tpu-ci
              annotations:
                gke-gcsfuse/volumes: "true"
            spec:
              restartPolicy: Never
${SERVICE_ACCOUNT}
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: ${TOPOLOGY}
${POOL_AFFINITY}
              tolerations:
                - key: google.com/tpu
                  operator: Exists
                  effect: NoSchedule
              volumes:
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi  # tier-2 compile cache lives here; R1's reaches ~57GB
                # Unmounted, /tmp is the container writable layer: unbounded node
                # ephemeral-storage. Overrunning it evicts whoever the kubelet picks,
                # so a pod's own logs took out unrelated jobs on the same node.
                - name: tmp
                  emptyDir:
                    sizeLimit: 64Gi
                # JAX compile cache shared across CI runs; objects expire after 7 days.
                - name: compile-cache
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    volumeAttributes:
                      bucketName: sglang-torchtpu-ci-compile-cache
                      mountOptions: "implicit-dirs"
${WEIGHTS_VOLUME}
              containers:
                - name: test
                  image: ${IMAGE}
                  imagePullPolicy: IfNotPresent
                  env:
                    # HF token for gated datasets (GPQA in the gpt-oss lm-eval test).
                    # One-time: kubectl -n tpu-ci create secret generic hf-token \
                    #   --from-literal=token=hf_...   (fine-grained, read-only)
                    # optional: pods must still start when the secret is absent --
                    # only the gated-dataset eval needs it.
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: hf-token
                          key: token
                          optional: true
                  command: ["bash", "-lc"]
                  args:
                    - |
                      set -uo pipefail
                      cd /sgl-workspace/sglang
                      export HF_HOME=/tmp/hf SGLANG_PLATFORM=${PLATFORM} SGLANG_IS_IN_CI=true PYTHONUNBUFFERED=1
                      export SGLANG_TPU_FULL_MATRIX=${FULL_MATRIX}
                      # torch_tpu's tier-3 cache defaults to $HOME, on the pod's ephemeral
                      # overlay; warmup fills the node disk and the kubelet evicts the pod.
                      export TORCH_TPU_TIER3_ROOT=/dev/shm/torch_tpu_tier3
                      export JAX_COMPILATION_CACHE_DIR=/compile-cache/jax
                      NNODES=$(awk -F, '{print NF}' <<<"${TPU_WORKER_HOSTNAMES:-x}")
                      RANK="${TPU_WORKER_ID:-0}"
                      echo "run=${RUN_NAME} nnodes=$NNODES rank=$RANK"

                      # Where a perf test must point bench_serving.sh's OUTPUT_DIR. Fixed
                      # and exported so the gate can find each sweep point's JSONL without
                      # guessing the model slug and timestamp the script defaults to.
                      # The numbers themselves leave via dump_metric's [METRIC] stdout
                      # lines, which the dashboard scrapes from this job's log.
                      export TPU_CI_BENCH_OUTPUT_ROOT=/tmp/tpu-perf-bench
                      mkdir -p "$TPU_CI_BENCH_OUTPUT_ROOT"

                      # Print /tmp usage to debug a disk eviction after the fact: the
                      # kubelet only reports a total, and the container log is unreadable
                      # by then. Past 20 GiB each line grows a du breakdown.
                      #   == /tmp 24K ==
                      #   == /tmp 3220292K ==
                      # Backgrounded, not trapped -- the single-host path ends in exec.
                      if [ "$RANK" = "0" ]; then
                        ( while sleep 120; do
                            tot=$(du -sxk /tmp 2>/dev/null | cut -f1)
                            echo "== /tmp ${tot:-?}K =="
                            [ "${tot:-0}" -gt 20971520 ] && du -xhd2 /tmp 2>/dev/null | sort -rh | head -10
                          done ) &
                      fi

                      # Exec mode (render_jobset.py --exec): every host runs the same
                      # command; pod exit codes gate the JobSet. Empty unless --exec.
                      if [ -n "${EXEC_CMD}" ]; then
                        # Name the test before anything can fail, as both other modes do.
                        echo "== test files: ${TEST_FILES} =="
                        t0=$SECONDS
                        ${EXEC_CMD}
                        rc=$?
                        # Teardown SIGTERMs surviving workers; rank-0 gates real failures.
                        if [ "$RANK" != "0" ] && [ "$rc" = 143 ]; then
                          echo "worker rank=$RANK: SIGTERM during teardown; success"; rc=0
                        fi
                        # Per-file verdict in TIMINGS format, rank 0 only: every pod runs
                        # the same command, and N records would be N rows for one test.
                        if [ "$RANK" = "0" ] && [ -n "${TEST_FILES}" ]; then
                          passed=true
                          [ "$rc" -eq 0 ] || passed=false
                          echo "========== TIMINGS BEGIN =========="
                          printf '{"file": "%s", "passed": %s, "elapsed": %s}\n' \
                            "${TEST_FILES}" "$passed" "$((SECONDS - t0))"
                          echo "========== TIMINGS END =========="
                        fi
                        exit $rc
                      fi

                      if [ "$NNODES" -le 1 ]; then
                        # Single-host: each test self-launches its own server.
                        exec python3 test/run_suite.py --hw tpu --suite ${SUITE} ${NIGHTLY_FLAG} ${PARTITION_FLAGS} ${TEST_FILE_FLAG} ${CHIP_WORKERS_FLAG} --timeout-per-file ${TIMEOUT_PER_FILE}
                      fi

                      # Multi-host: every host runs the launch group's recipe (owns model+config).
                      # Announce the group's files BEFORE anything can fail. A job that dies in
                      # bring-up (server never healthy, OOM) otherwise reaches the dashboard with
                      # no test name at all and gets filed under the job, which reads as a test
                      # that does not exist. Printed once, unconditionally, so attribution never
                      # depends on how far the run got.
                      echo "== test files: ${TEST_FILES} =="
                      # A .py launch script is a recipe config the Python launcher runs
                      # directly (it resolves this host's rank from the JobSet topology);
                      # anything else is a shell recipe that execs launch_server.sh itself.
                      case "${LAUNCH_SCRIPT}" in
                        *.py) launch=(python3 -m benchmark.tpu.launch_server
                                      --config "${LAUNCH_SCRIPT}"
                                      --working-directory benchmark/tpu) ;;
                        *)    launch=(bash "benchmark/tpu/${LAUNCH_SCRIPT}") ;;
                      esac
                      # Normalization may move serving to another pod; the input
                      # leader forwards this port to that pod's reachable listener.
                      ( HOST=0.0.0.0 PORT=30000 ENABLE_PROFILER_ENDPOINT=0 ENABLE_COMPILE_CACHE=0 \
                          "${launch[@]}" ) > >(tee /tmp/server.log) 2>&1 &
                      spid=$!
                      if [ "$RANK" = "0" ]; then
                        ok=0
                        for i in $(seq 1 300); do
                          curl -sf --max-time 5 http://127.0.0.1:30000/health_generate >/dev/null 2>&1 && { ok=1; break; }
                          kill -0 "$spid" 2>/dev/null || { echo "server exited early"; break; }
                          sleep 10
                        done
                        echo "== server.log tail =="; tail -n 60 /tmp/server.log
                        [ "$ok" = 1 ] || { echo "FAIL: server never healthy"; exit 1; }
                        # rank 0 runs every file in this launch group against the one server.
                        # Per-file verdicts are emitted in run_suite's TIMINGS format, so a
                        # dashboard reads multi-host and single-host through one parser. The
                        # loop's own rc is a single bit for the whole group, which cannot say
                        # WHICH file failed.
                        rc=0
                        timings=""
                        for f in ${TEST_FILES}; do
                          echo "== live-server test: $f =="
                          t0=$SECONDS
                          SGLANG_TPU_USE_LIVE_SERVER=1 BASE_URL=http://127.0.0.1:30000 timeout ${TIMEOUT_PER_FILE} python3 "$f"
                          frc=$?
                          passed=true
                          if [ "$frc" -ne 0 ]; then passed=false; rc=1; fi
                          timings="$timings{\"file\": \"$f\", \"passed\": $passed, \"elapsed\": $((SECONDS - t0))}"$'\n'
                        done
                        echo "========== TIMINGS BEGIN =========="
                        printf '%s' "$timings"
                        echo "========== TIMINGS END =========="
                        kill "$spid" 2>/dev/null || true
                        exit $rc
                      else
                        # A worker is a shard of the same server as rank-0, so its crash
                        # normally also fails rank-0's inference. But flag the unambiguous
                        # local deaths -- OOM-kill (137) / SIGSEGV (139) -- so a worker
                        # crash is never masked as success. This matters once independent
                        # groups (e.g. P/D disaggregation) share one slice, where rank-0
                        # may not exercise every group. NOTE: this JobSet runs ONE global
                        # TP group (every host runs the same recipe; TP spans all hosts) --
                        # true per-group gating for P/D is future work (needs role-aware
                        # launch, which MULTIHOST_LAUNCH does not model yet). Teardown-
                        # induced exits (leader gone -> peer disconnect / SIGTERM 143) pass.
                        wait "$spid"; src=$?
                        # 137 is also normal teardown: rank-0 exits first and this worker dies on
                        # the severed socket (gloo: "Connection reset|closed by peer"); rank-0 gates.
                        if [ "$src" = 137 ] && grep -qE "Connection (reset|closed) by peer" /tmp/server.log; then
                          echo "worker rank=$RANK: leader closed (teardown); success"; exit 0
                        fi
                        case "$src" in
                          137|139) echo "worker rank=$RANK server crashed rc=$src"; exit 1 ;;
                          *)       echo "worker rank=$RANK done (server rc=$src)"; exit 0 ;;
                        esac
                      fi
                  resources:
                    requests:
                      google.com/tpu: "4"
                      cpu: "4"
                      memory: 32Gi
                      # No ephemeral-storage here: the CI ClusterQueues' coveredResources
                      # omit it, and Kueue silently never admits a workload asking
                      # for a resource the ClusterQueue does not cover.
                    limits:
                      google.com/tpu: "4"
                  volumeMounts:
                    - name: compile-cache
                      mountPath: /compile-cache
                    - name: dshm
                      mountPath: /dev/shm
                    - name: tmp
                      mountPath: /tmp
${WEIGHTS_MOUNT}
                  securityContext:
                    privileged: true
