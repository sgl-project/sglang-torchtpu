apiVersion: v1
kind: PersistentVolume
metadata:
  name: model-weights-filestore-pv
spec:
  storageClassName: ""
  capacity:
    storage: 10Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    namespace: tpu-ci
    name: model-weights-filestore
  mountOptions:
    - nfsvers=3
    - hard
  nfs:
    server: <FILESTORE_IP>  # internal Filestore address; substituted at apply time (see README)
    path: /weights
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-weights-filestore
  namespace: tpu-ci
spec:
  storageClassName: ""
  volumeName: model-weights-filestore-pv
  accessModes:
    - ReadOnlyMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Ti
