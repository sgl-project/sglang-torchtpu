# Isolated trigger for the registered GPT-OSS-120B 2P+2D feature test.
# The same test also runs from nightly-test-tpu.yml.
#   gh workflow run combo-test-tpu.yml [-f ref=<branch>]
name: Combo Test (TPU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main

concurrency:
  # Different refs can use separate nightly slices. Runs for one ref serialize.
  group: tpu-combo-${{ inputs.ref || github.ref }}
  cancel-in-progress: false # Let a running test finish. Do not stack runs.

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  pd-mh-gpt-120b-pc-offload-spec:
    needs: build
    name: pd-mh-gpt-120b-pc-offload-spec
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload_spec.py integration
      files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_prefix_cache_kv_offload_spec.py
      weights_pvc: model-weights-rox
      run_name: pd-mh-gpt-120b-pc-offload-spec
    permissions:
      contents: read
      id-token: write
