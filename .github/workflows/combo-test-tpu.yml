# TEMPORARY CARRIER (probe branch only, never for merge): dispatches the P/D
# TP resharding integration JobSet while integration-test-tpu.yml does not exist
# on the default branch.
name: Combo Test (TPU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: chenjincheng/test-coverage
      target:
        description: "Which model profile to run (or all)"
        required: false
        default: all
        type: choice
        options: [all, gpt_oss_120b, qwen3_coder_480b]

concurrency:
  group: tpu-integration-2x2
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'chenjincheng/test-coverage' }}
    permissions:
      contents: read
      id-token: write

  pd-tp-resharding:
    needs: build
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: ${{ (inputs.target == 'gpt_oss_120b' && fromJSON('["gpt_oss_120b"]')) || (inputs.target == 'qwen3_coder_480b' && fromJSON('["qwen3_coder_480b"]')) || fromJSON('["gpt_oss_120b","qwen3_coder_480b"]') }}
    name: pd-tp-resharding-${{ matrix.model }}-2p2d
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'chenjincheng/test-coverage' }}
      image: ${{ needs.build.outputs.digest }}
      hosts: 2
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=${{ matrix.model }} python3 test/registered/tpu/integration/test_pd_tp_resharding.py
      weights_pvc: model-weights-rox
      run_name: pd-tpreshard-${{ matrix.model }}
    permissions:
      contents: read
      id-token: write
