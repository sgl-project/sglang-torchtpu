# Nightly TPU e2e. Builds the image ONCE, then:
#   * single-host  -> run three LPT-balanced shards sequentially.
#   * multi-host    -> discover_multihost.py finds multi-host test files (MULTIHOST_LAUNCH)
#                      registered to nightly-tpu-multihost and GROUPS them by launch spec;
#                      one JobSet per group (launch once, rank-0 runs the group's files).
# Same-setup files share a server. Every job runs in the `nightly` lane (topology.yaml), so
# it uses the nightly pools rather than competing with the PR gate, and Kueue queues the
# groups against that lane's slice quota instead of a GitHub-side mutex.
name: Nightly Test (TPU)

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily (low-PR hour); adjust as needed
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      # Scheduled runs (inputs empty) run everything.
      only:
        description: "Run only one part (combo = both combo layers)"
        required: false
        default: all
        type: choice
        options:
          - all
          - accuracy
          - combo
          - combo-mh
          - combo-sh
          - mh
          - pd-mh-gpt-120b
          - pd-mh-gpt-120b-pc-offload
          - pd-mh-gpt-120b-tp-reshard
          - pd-sh-gpt-120b
          - pd-sh-gpt-120b-spec
          - perf
          - sh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  single-host:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'sh' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        partition: [0, 1, 2]
    name: sh-${{ matrix.partition }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      suite: nightly-tpu-4-v7
      nightly: true
      partition_id: ${{ matrix.partition }}
      partition_size: 3
      run_name: nightly-tpu-4-v7-${{ matrix.partition }}
      # The spec-decoding gsm8k gates serve gpt-oss-120b / qwen3-coder-480b from
      # the ROX weights disk at /weights; harmless for tests that don't use it.
      weights_pvc: model-weights-rox
    permissions:
      contents: read
      id-token: write

  # P/D disaggregation integration tests: same JobSets as the standalone
  # integration-test-tpu.yml action, which is workflow_dispatch-only. Only
  # SCHEDULED runs are ingested by the CI dashboard, so a dispatch-only test
  # never earns a history row -- these jobs give them a nightly cadence and
  # therefore a green/red trend. Each engine role holds a whole 2x2x2 nightly
  # slice, so every P/D job holds BOTH nightly-2h slices at once; the shared
  # tpu-pd-lock in _tpu-test.yml serializes them (and against pd-singlehost /
  # pd-multihost below). See the runner-cap gap in .github/tpu-ci/README.md.
  # P/D pods are named tpu-ci-<run_name>-<rand>-{prefill,decode}-<idx>; names
  # use compact abbreviations (pd-{sh,mh}-gpt-120b[-<feature>]) to stay well
  # under k8s's 63-char pod-name cap.
  pd-mh-gpt-120b-pc-offload:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-mh-gpt-120b-pc-offload"]'), inputs.only || 'all') }}
    name: pd-mh-gpt-120b-pc-offload
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      # hosts feeds only the slice concurrency group; the P/D topology below
      # sizes the JobSet (2-host prefill slice + 2-host decode slice).
      hosts: 2
      # The nightly lane is the only one owning two 2x2x2 slices, which is what
      # a prefill engine and a decode engine need at the same time.
      lane: nightly
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=gpt_oss_120b python3 test/registered/tpu/e2e/test_tpu_pd_multihost_prefix_cache_kv_offload.py
      # Names the dashboard row and the TIMINGS record; required in P/D mode.
      files: test/registered/tpu/e2e/test_tpu_pd_multihost_prefix_cache_kv_offload.py
      weights_pvc: model-weights-rox
      run_name: pd-mh-gpt-120b-pc-offload
    permissions:
      contents: read
      id-token: write

  pd-mh-gpt-120b-tp-reshard:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-mh-gpt-120b-tp-reshard"]'), inputs.only || 'all') }}
    name: pd-mh-gpt-120b-tp-reshard
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      hosts: 2
      lane: nightly
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=gpt_oss_120b python3 test/registered/tpu/integration/test_pd_tp_resharding.py
      # Names the dashboard row and the TIMINGS record; required in P/D mode.
      files: test/registered/tpu/integration/test_pd_tp_resharding.py
      weights_pvc: model-weights-rox
      run_name: pd-mh-gpt-120b-tp-reshard
    permissions:
      contents: read
      id-token: write

  # Feature-combination layers: same exec-mode runs as the standalone
  # combo-test-tpu.yml action; these jobs add nightly cadence.
  singlehost-combo:
    needs: build
    if: ${{ contains(fromJSON('["all","combo","combo-sh"]'), inputs.only || 'all') }}
    name: combo-sh
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      exec_cmd: python3 test/manual/tpu/feature_combo/test_feature_combos_singlehost.py all
      run_name: combo-sh
    permissions:
      contents: read
      id-token: write

  combo-multihost-spec:
    # Unchained: Kueue queues the hosts=2 jobs, so this need not wait out multi-host.
    # spec: gated Llama-3.1-8B from HF (HF_TOKEN needs Meta license access). The pd
    # row was dropped -- it duplicated pd-mh-gpt-120b-pc-offload.
    needs: build
    if: ${{ contains(fromJSON('["all","combo","combo-mh"]'), inputs.only || 'all') }}
    name: combo-mh-spec
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      exec_cmd: python3 test/manual/tpu/feature_combo/multihost/test_feature_combos.py spec
      weights_pvc: model-weights-rox
      run_name: combo-mh-spec
    permissions:
      contents: read
      id-token: write

  # One host per P/D engine isolates this gate from intra-engine multihost issues.
  # Kueue queues it against other P/D jobs contending for the nightly lane.
  pd-singlehost:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-sh-gpt-120b"]'), inputs.only || 'all') }}
    name: pd-sh-gpt-120b
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      pd_prefill_hosts: 1
      pd_decode_hosts: 1
      exec_cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_gsm8k.py integration
      # Names the dashboard row and the TIMINGS record; required in P/D mode.
      files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_gsm8k.py
      weights_pvc: model-weights-rox
      run_name: pd-sh-gpt-120b
    permissions:
      contents: read
      id-token: write

  # Keep the CI identifier compact: <category>-<topology>-<model>-<feature>.
  # The full model and testcase remain visible in the dashboard file key.
  pd-sh-gpt-120b-spec:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-sh-gpt-120b-spec"]'), inputs.only || 'all') }}
    name: pd-sh-gpt-120b-spec
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      pd_prefill_hosts: 1
      pd_decode_hosts: 1
      exec_cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_spec_gsm8k.py integration
      files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_spec_gsm8k.py
      weights_pvc: model-weights-rox
      run_name: pd-sh-gpt-120b-spec
    permissions:
      contents: read
      id-token: write

  # Multihost P/D GSM8K accuracy test with 2 prefill and 2 decode hosts.
  pd-multihost:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-mh-gpt-120b"]'), inputs.only || 'all') }}
    name: pd-mh-gpt-120b
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_gsm8k.py integration
      # Used for dashboard and timing records.
      files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_multihost_gsm8k.py
      weights_pvc: model-weights-rox
      run_name: pd-mh-gpt-120b
    permissions:
      contents: read
      id-token: write

  # Throughput sweeps, one job per model so they take separate slices and run in
  # parallel -- same exec-mode shape as the combo layers above. Also dispatchable
  # on its own (perf-test-tpu.yml) to collect a datapoint without a full nightly.
  perf:
    needs: build
    if: ${{ contains(fromJSON('["all","perf"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        # qwen3-30b was retired: its 480B sibling's perf source is the agentic
        # sweep in the multi-host job, which dumps its own workload metrics.
        include:
          - suite: nightly-tpu-perf-gpt-oss-120b
            name: perf-sh-gpt-120b
    name: ${{ matrix.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      weights_pvc: model-weights-rox
      timeout_per_file: 1800
    permissions:
      contents: read
      id-token: write

  # Accuracy gates, one job per model -- the same fan-out as perf, so a broken
  # model costs the others nothing. Also dispatchable on its own
  # (accuracy-test-tpu.yml) to collect a datapoint without a full nightly.
  accuracy:
    needs: build
    if: ${{ contains(fromJSON('["all","accuracy"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: nightly-tpu-accuracy-gpt-oss-120b
            name: accuracy-sh-gpt-120b
    name: ${{ matrix.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      # gpt-oss-120b serves from the shared ROX disk at /weights.
      weights_pvc: model-weights-rox
      # est_time 2400 (GPQA at 8 repeats + MMLU at 2000 examples) plus bring-up.
      timeout_per_file: 3600
    permissions:
      contents: read
      id-token: write

  # Discover multi-host launch groups from the test files (test-owned launch specs).
  discover:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'mh' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        run: |
          set -euo pipefail
          groups="$(python3 .github/tpu-ci/discover_multihost.py --suite nightly-tpu-multihost)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  # One JobSet per launch group. matrix.group is a discovered object.
  multi-host:
    needs: [build, discover]
    if: needs.discover.outputs.groups != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      timeout_per_file: ${{ matrix.group.timeout_per_file }}
      run_name: ${{ matrix.group.name }}
    permissions:
      contents: read
      id-token: write
