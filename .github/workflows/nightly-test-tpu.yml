# Nightly TPU e2e. Builds the image ONCE, then:
#   * single-host  -> run_suite over the single-host suite (each test self-launches).
#   * multi-host    -> discover_multihost.py finds multi-host test files (MULTIHOST_LAUNCH)
#                      registered to nightly-tpu-multihost and GROUPS them by launch spec;
#                      one JobSet per group (launch once, rank-0 runs the group's files).
# Same-setup files share a server. Every job runs in the `nightly` lane (topology.yaml), so
# it uses the nightly pools rather than competing with the PR gate, and Kueue queues the
# groups against that lane's slice quota instead of a GitHub-side mutex.
name: Nightly Test (TPU)

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily (low-PR hour); adjust as needed
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      # Scheduled runs (inputs empty) run everything.
      only:
        description: "Run only one part (combo = both combo layers)"
        required: false
        default: all
        type: choice
        options:
          - all
          - accuracy
          - combo
          - integration
          - multihost
          - multihost-combo
          - pd-e2e
          - pd-integration
          - pd-singlehost
          - perf
          - single-host
          - singlehost-combo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  single-host:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'single-host' }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      suite: nightly-tpu-4-v7
      nightly: true
      # The spec-decoding gsm8k gates serve gpt-oss-120b / qwen3-coder-480b from
      # the ROX weights disk at /weights; harmless for tests that don't use it.
      weights_pvc: model-weights-rox
    permissions:
      contents: read
      id-token: write

  # Registered single-server integration tests. JobSet provisioning and mounted
  # weights stay in this runner layer; test fixtures only own sgl.Engine lifetime.
  integration:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'integration' }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      suite: nightly-tpu-integration
      nightly: true
      weights_pvc: model-weights-rox
      timeout_per_file: 16200
    permissions:
      contents: read
      id-token: write

  # P/D disaggregation integration tests: same JobSets as the standalone
  # integration-test-tpu.yml action, which is workflow_dispatch-only. Only
  # SCHEDULED runs are ingested by the CI dashboard, so a dispatch-only test
  # never earns a history row -- this job is what gives these two a nightly
  # cadence and therefore a green/red trend.
  pd-integration:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-integration"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      # Each row holds BOTH 2x2x2 nightly slices at once (one per engine role),
      # i.e. the whole tpu-nightly-2h quota, so the rows cannot overlap -- and
      # they serialize behind multihost/multihost-combo, which draw on the same
      # queue. See the runner-cap gap in .github/tpu-ci/README.md.
      max-parallel: 1
      matrix:
        include:
          - name: pd-kvoff
            model: gpt_oss_120b
            file: test/registered/tpu/e2e/test_tpu_pd_multihost_prefix_cache_kv_offload.py
          - name: pd-tpreshard
            model: qwen3_coder_480b
            file: test/registered/tpu/integration/test_pd_tp_resharding.py
    name: ${{ matrix.name }}-${{ matrix.model }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      # hosts feeds only the slice concurrency group; the P/D topology below
      # sizes the JobSet (2-host prefill slice + 2-host decode slice).
      hosts: 2
      # The nightly lane is the only one owning two 2x2x2 slices, which is what
      # a prefill engine and a decode engine need at the same time.
      lane: nightly
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=${{ matrix.model }} python3 ${{ matrix.file }}
      # Names the dashboard row and the TIMINGS record; required in P/D mode.
      files: ${{ matrix.file }}
      weights_pvc: model-weights-rox
      run_name: ${{ matrix.name }}-${{ matrix.model }}
    permissions:
      contents: read
      id-token: write

  # Feature-combination layers: same exec-mode runs as the standalone
  # combo-test-tpu.yml action; these jobs add nightly cadence.
  singlehost-combo:
    needs: build
    if: ${{ contains(fromJSON('["all","combo","singlehost-combo"]'), inputs.only || 'all') }}
    name: singlehost-combo-test
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      exec_cmd: python3 test/manual/tpu/feature_combo/test_feature_combos_singlehost.py all
      run_name: singlehost-combo-test
    permissions:
      contents: read
      id-token: write

  multihost-combo:
    # Unchained: Kueue queues the hosts=2 jobs, so this need not wait out multi-host.
    needs: build
    if: ${{ contains(fromJSON('["all","combo","multihost-combo"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        row: [pd, spec]
    name: multihost-combo-test-${{ matrix.row }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      # pd: FP8 30B from the shared disk (functional oracle -- quant-safe).
      # spec: gated Llama-3.1-8B from HF (HF_TOKEN needs Meta license access).
      exec_cmd: >-
        ${{ matrix.row == 'pd'
            && 'env MODEL=/weights/Qwen3-30B-A3B-FP8 python3 test/manual/tpu/feature_combo/multihost/test_feature_combos.py pd'
            || 'python3 test/manual/tpu/feature_combo/multihost/test_feature_combos.py spec' }}
      weights_pvc: model-weights-rox
      run_name: multihost-combo-test-${{ matrix.row }}
    permissions:
      contents: read
      id-token: write

  # One host per P/D engine isolates this gate from intra-engine multihost issues.
  # The shared P/D lock serializes it with pd-e2e.
  pd-singlehost:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-singlehost"]'), inputs.only || 'all') }}
    name: pd-singlehost-gpt-oss-120b-gsm8k
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      pd_prefill_hosts: 1
      pd_decode_hosts: 1
      exec_cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_gsm8k.py integration
      # Names the dashboard row and the TIMINGS record; required in P/D mode.
      files: test/registered/tpu/e2e/test_tpu_gpt_oss_120b_pd_singlehost_gsm8k.py
      weights_pvc: model-weights-rox
      run_name: gpt-oss-120b-pd-singlehost-gsm8k
    permissions:
      contents: read
      id-token: write

  # P/D Disaggregation multihost accuracy E2E tests on Nightly lane.
  pd-e2e:
    needs: build
    if: ${{ contains(fromJSON('["all","pd-e2e"]'), inputs.only || 'all') }}
    name: pd-e2e-gpt-oss-120b-gsm8k
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: python3 test/registered/tpu/e2e/test_tpu_gpt_oss_120b_multihost_pd_gsm8k.py integration
      weights_pvc: model-weights-rox
      run_name: pd-gpt-oss-120b-gsm8k
    permissions:
      contents: read
      id-token: write

  # Throughput sweeps, one job per model so they take separate slices and run in
  # parallel -- same exec-mode shape as the combo layers above. Also dispatchable
  # on its own (perf-test-tpu.yml) to collect a datapoint without a full nightly.
  perf:
    needs: build
    if: ${{ contains(fromJSON('["all","perf"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        # qwen3-30b was retired: its 480B sibling's perf source is the agentic
        # sweep in the multi-host job, which dumps its own workload metrics.
        suite: [nightly-tpu-perf-gpt-oss-120b]
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      weights_pvc: model-weights-rox
      timeout_per_file: 1800
    permissions:
      contents: read
      id-token: write

  # Accuracy gates, one job per model -- the same fan-out as perf, so a broken
  # model costs the others nothing. Also dispatchable on its own
  # (accuracy-test-tpu.yml) to collect a datapoint without a full nightly.
  accuracy:
    needs: build
    if: ${{ contains(fromJSON('["all","accuracy"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        suite: [nightly-tpu-accuracy-gpt-oss-120b]
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      # gpt-oss-120b serves from the shared ROX disk at /weights.
      weights_pvc: model-weights-rox
      # est_time 2400 (GPQA at 8 repeats + MMLU at 2000 examples) plus bring-up.
      timeout_per_file: 3600
    permissions:
      contents: read
      id-token: write

  # Discover multi-host launch groups from the test files (test-owned launch specs).
  discover:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'multihost' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        run: |
          set -euo pipefail
          groups="$(python3 .github/tpu-ci/discover_multihost.py --suite nightly-tpu-multihost)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  # One JobSet per launch group. matrix.group is a discovered object.
  multi-host:
    needs: [build, discover]
    if: needs.discover.outputs.groups != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      run_name: ${{ matrix.group.name }}
    permissions:
      contents: read
      id-token: write
