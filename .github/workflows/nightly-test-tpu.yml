# Nightly TPU e2e. Builds the image ONCE, then:
#   * single-host  -> run three LPT-balanced shards sequentially.
#   * multi-host    -> discover_multihost.py finds multi-host test files (MULTIHOST_LAUNCH)
#                      registered to nightly-tpu-multihost and GROUPS them by launch spec;
#                      one JobSet per group (launch once, rank-0 runs the group's files).
# Same-setup files share a server. Every job runs in the `nightly` lane (topology.yaml), so
# it uses the nightly pools rather than competing with the PR gate, and Kueue queues the
# groups against that lane's slice quota instead of a GitHub-side mutex.
name: Nightly Test (TPU)

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily (low-PR hour); adjust as needed
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      # Scheduled runs (inputs empty) run everything. `pd` runs the chained
      # gpt-oss-120b P/D gates (gsm8k -> offloading -> resharding).
      only:
        description: "Run only one part"
        required: false
        default: all
        type: choice
        options: [all, single-host, multihost, combo, singlehost-combo, perf, accuracy, pd]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  single-host:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'single-host' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        partition: [0, 1, 2]
    name: single-host-${{ matrix.partition }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      suite: nightly-tpu-4-v7
      nightly: true
      partition_id: ${{ matrix.partition }}
      partition_size: 3
      run_name: nightly-tpu-4-v7-${{ matrix.partition }}
      # The spec-decoding gsm8k gates serve gpt-oss-120b / qwen3-coder-480b from
      # the ROX weights disk at /weights; harmless for tests that don't use it.
      weights_pvc: model-weights-rox
    permissions:
      contents: read
      id-token: write

  # Single-host feature-combination layer: same exec-mode run as the standalone
  # combo-test-tpu.yml action; this job adds nightly cadence.
  singlehost-combo:
    needs: build
    if: ${{ contains(fromJSON('["all","combo","singlehost-combo"]'), inputs.only || 'all') }}
    name: singlehost-combo-test
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      exec_cmd: python3 test/manual/tpu/feature_combo/test_feature_combos_singlehost.py all
      run_name: singlehost-combo-test
    permissions:
      contents: read
      id-token: write

  # Multihost feature-combination layer: same exec-mode run as the standalone
  # combo-test-tpu.yml action; this job adds nightly cadence.
  multihost-combo:
    needs: build
    if: ${{ contains(fromJSON('["all","combo","multihost-combo"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        row: [pd, spec]
    name: multihost-combo-test-${{ matrix.row }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      # pd: FP8 30B from the shared disk (functional oracle -- quant-safe).
      # spec: gated Llama-3.1-8B from HF (HF_TOKEN needs Meta license access).
      exec_cmd: >-
        ${{ matrix.row == 'pd'
            && 'env MODEL=/weights/Qwen3-30B-A3B-FP8 python3 test/manual/tpu/feature_combo/multihost/test_feature_combos.py pd'
            || 'python3 test/manual/tpu/feature_combo/multihost/test_feature_combos.py spec' }}
      weights_pvc: model-weights-rox
      run_name: multihost-combo-test-${{ matrix.row }}
    permissions:
      contents: read
      id-token: write

  # P/D disaggregation multihost gsm8k gates on the Nightly lane, all on
  # gpt-oss-120b. Chained gsm8k -> offloading -> resharding: each holds BOTH
  # 2x2x2 nightly slices (one per engine role), so they must not overlap;
  # `needs` serializes them and short-circuits the chain when an upstream gate
  # fails. `files` names the dashboard row / TIMINGS record (required in P/D
  # mode) and carries the model name via the test file path.
  pd-gsm8k:
    needs: build
    if: ${{ contains(fromJSON('["all","pd"]'), inputs.only || 'all') }}
    name: gpt_oss_120b_multihost_pd_gsm8k
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: python3 test/registered/tpu/e2e/test_gpt_oss_120b_multihost_pd_gsm8k.py integration
      files: test/registered/tpu/e2e/test_gpt_oss_120b_multihost_pd_gsm8k.py
      weights_pvc: model-weights-rox
      run_name: gpt-oss-120b-pd-gsm8k
    permissions:
      contents: read
      id-token: write

  pd-offloading:
    needs: [build, pd-gsm8k]
    if: ${{ contains(fromJSON('["all","pd"]'), inputs.only || 'all') }}
    name: gpt_oss_120b_multihost_pd_offloading_gsm8k
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=gpt_oss_120b python3 test/registered/tpu/integration/test_gpt_oss_120b_pd_prefix_caching_kv_offload.py
      files: test/registered/tpu/integration/test_gpt_oss_120b_pd_prefix_caching_kv_offload.py
      weights_pvc: model-weights-rox
      run_name: gpt-oss-120b-pd-offloading-gsm8k
    permissions:
      contents: read
      id-token: write

  pd-resharding:
    needs: [build, pd-offloading]
    if: ${{ contains(fromJSON('["all","pd"]'), inputs.only || 'all') }}
    name: gpt_oss_120b_multihost_pd_resharding_gsm8k
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 2
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=gpt_oss_120b python3 test/registered/tpu/integration/test_gpt_oss_120b_pd_tp_resharding.py
      files: test/registered/tpu/integration/test_gpt_oss_120b_pd_tp_resharding.py
      weights_pvc: model-weights-rox
      run_name: gpt-oss-120b-pd-resharding-gsm8k
    permissions:
      contents: read
      id-token: write

  # Throughput sweeps, one job per model so they take separate slices and run in
  # parallel -- same exec-mode shape as the combo layers above. Also dispatchable
  # on its own (perf-test-tpu.yml) to collect a datapoint without a full nightly.
  perf:
    needs: build
    if: ${{ contains(fromJSON('["all","perf"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        # qwen3-30b was retired: its 480B sibling's perf source is the agentic
        # sweep in the multi-host job, which dumps its own workload metrics.
        suite: [nightly-tpu-perf-gpt-oss-120b]
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      weights_pvc: model-weights-rox
      timeout_per_file: 1800
    permissions:
      contents: read
      id-token: write

  # Accuracy gates, one job per model -- the same fan-out as perf, so a broken
  # model costs the others nothing. Also dispatchable on its own
  # (accuracy-test-tpu.yml) to collect a datapoint without a full nightly.
  accuracy:
    needs: build
    if: ${{ contains(fromJSON('["all","accuracy"]'), inputs.only || 'all') }}
    strategy:
      fail-fast: false
      matrix:
        suite: [nightly-tpu-accuracy-gpt-oss-120b]
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      # gpt-oss-120b serves from the shared ROX disk at /weights.
      weights_pvc: model-weights-rox
      # est_time 2400 (GPQA at 8 repeats + MMLU at 2000 examples) plus bring-up.
      timeout_per_file: 3600
    permissions:
      contents: read
      id-token: write

  # Discover multi-host launch groups from the test files (test-owned launch specs).
  discover:
    needs: build
    if: ${{ (inputs.only || 'all') == 'all' || inputs.only == 'multihost' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        run: |
          set -euo pipefail
          groups="$(python3 .github/tpu-ci/discover_multihost.py --suite nightly-tpu-multihost)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  # One JobSet per launch group. matrix.group is a discovered object.
  multi-host:
    needs: [build, discover]
    if: needs.discover.outputs.groups != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      timeout_per_file: ${{ matrix.group.timeout_per_file }}
      run_name: ${{ matrix.group.name }}
    permissions:
      contents: read
      id-token: write
