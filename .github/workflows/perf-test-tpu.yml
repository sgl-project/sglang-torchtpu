# TPU throughput sweeps -- test/registered/tpu/nightly-perf/ via run_suite, ONE
# JOB PER MODEL so they take separate slices and run in parallel.
# A model that fails costs the others nothing, and each gets its own
# --timeout-per-file rather than sharing one with every other model.
# The nightly's perf stage (nightly-test-tpu.yml calls this workflow with a
# prebuilt image); this action is also the isolated trigger, for collecting a
# datapoint on demand without waiting for a nightly:
#   gh workflow run perf-test-tpu.yml [-f model=gpt-oss-120b] [-f ref=<branch>]
name: Perf Test (TPU)
run-name: "Perf Test (TPU)${{ inputs.update-dashboard && ' [publish]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      model:
        description: "Which model to measure"
        required: false
        default: all
        type: choice
        options: [all, gpt-oss-120b, gpt-oss-20b, deepseek-r1-0528, deepseek-v3-1, kimi-k26, gemma4-31b,
          gemma4-26b-a4b, qwen3-5-397b, glm-5-3-flash]
      update-dashboard:
        description: "Publish this run's results to the dashboard (main only)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      model:
        required: false
        default: all
        type: string
      image:
        required: false
        default: ""
        type: string

concurrency:
  # Only governs standalone dispatches (a called workflow rides the caller's
  # group). Keyed on ref and model: one group per selection.
  group: tpu-perf-${{ inputs.ref || github.ref }}-${{ inputs.model || 'all' }}
  cancel-in-progress: false

jobs:
  # Standalone runs build their own image; the nightly passes one in so every
  # stage of the run tests a single build.
  build:
    if: ${{ (inputs.image || '') == '' }}
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  perf:
    needs: build
    # `build` may be skipped (image passed in); !cancelled() keeps this alive then.
    if: ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success') }}
    strategy:
      # A slow or broken model must not cancel the other's measurement.
      fail-fast: false
      matrix:
        # matrix context is unavailable in job-level `if`, so selection shapes the
        # matrix instead -- a ternary over literal arrays, which also keeps every
        # suite spelled out in this file (what the pr-gate lint greps for). A
        # model's entries therefore appear twice: once in its own array, once in
        # the default one.
        # Each entry carries its own budget: one bring-up (weight load + per-shape
        # compile) plus one sweep leg, with slack for a cold compile cache. c64
        # compiles a wider decode bucket than c16, and the speculative legs also
        # load and compile a draft model. The three frontier MoEs stream 550-650 GB
        # of weights before they compile anything, hence 3600.
        # weights_pvc is per entry because the launcher mounts exactly ONE claim at
        # /weights: DeepSeek-V3.1 lives on its own side disk, not the shared one.
        # run_name names the Kubernetes objects. JobSet validates the pod name,
        # tpu-ci-<run_name>-<5 rand>-slice-0-0-<5 rand>, against 63 chars, leaving
        # run_name 34; the suites themselves (29-40) are rejected at admission.
        entry: >-
          ${{ (inputs.model == 'gpt-oss-120b' && fromJSON('[
          {"suite": "nightly-tpu-perf-gpt-oss-120b", "run_name": "perf-gpt-oss-120b", "timeout": 1800, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gpt-oss-120b-c64", "run_name": "perf-gpt-oss-120b-c64", "timeout": 2400, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gpt-oss-120b-eagle3-c64", "run_name": "perf-gpt-oss-120b-eagle3-c64", "timeout": 3000, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gpt-oss-120b-dflash-c64", "run_name": "perf-gpt-oss-120b-dflash-c64", "timeout": 3000, "weights_pvc": "model-weights"}]'))
          || (inputs.model == 'gpt-oss-20b' && fromJSON('[
          {"suite": "nightly-tpu-perf-gpt-oss-20b", "run_name": "perf-gpt-oss-20b", "timeout": 1800, "weights_pvc": "model-weights"}]'))
          || (inputs.model == 'deepseek-r1-0528' && fromJSON('[
          {"suite": "nightly-tpu-perf-deepseek-r1-0528", "run_name": "perf-deepseek-r1-0528", "timeout": 3600, "weights_pvc": "model-weights"}]'))
          || (inputs.model == 'deepseek-v3-1' && fromJSON('[
          {"suite": "nightly-tpu-perf-deepseek-v3-1", "run_name": "perf-deepseek-v3-1", "timeout": 3600, "weights_pvc": "deepseek-v3-1-rox"}]'))
          || (inputs.model == 'kimi-k26' && fromJSON('[
          {"suite": "nightly-tpu-perf-kimi-k26", "run_name": "perf-kimi-k26", "timeout": 7200, "weights_pvc": "model-weights"}]'))
          || (inputs.model == 'gemma4-31b' && fromJSON('[
          {"suite": "nightly-tpu-perf-gemma4-31b", "run_name": "perf-gemma4-31b", "timeout": 3600, "weights_pvc": "model-weights"}]'))
          || (inputs.model == 'gemma4-26b-a4b' && fromJSON('[
          {"suite": "nightly-tpu-perf-gemma4-26b-a4b", "run_name": "perf-gemma4-26b-a4b", "timeout": 3600, "weights_pvc": "model-weights"}]'))
          || (inputs.model == 'qwen3-5-397b' && fromJSON('[
          {"suite": "nightly-tpu-perf-qwen3-5-397b", "run_name": "perf-qwen3-5-397b", "timeout": 3600, "weights_pvc": "model-weights"}]'))
          || (inputs.model == 'glm-5-3-flash' && fromJSON('[
          {"suite": "nightly-tpu-perf-glm-5-3-flash", "run_name": "perf-glm-5-3-flash", "timeout": 3600, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-glm-5-3-flash-mk", "run_name": "perf-glm-5-3-flash-mk", "timeout": 3600, "weights_pvc": "model-weights"}]'))
          || fromJSON('[
          {"suite": "nightly-tpu-perf-gpt-oss-120b", "run_name": "perf-gpt-oss-120b", "timeout": 1800, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gpt-oss-120b-c64", "run_name": "perf-gpt-oss-120b-c64", "timeout": 2400, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gpt-oss-120b-eagle3-c64", "run_name": "perf-gpt-oss-120b-eagle3-c64", "timeout": 3000, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gpt-oss-120b-dflash-c64", "run_name": "perf-gpt-oss-120b-dflash-c64", "timeout": 3000, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gpt-oss-20b", "run_name": "perf-gpt-oss-20b", "timeout": 1800, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-deepseek-r1-0528", "run_name": "perf-deepseek-r1-0528", "timeout": 3600, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-deepseek-v3-1", "run_name": "perf-deepseek-v3-1", "timeout": 3600, "weights_pvc": "deepseek-v3-1-rox"},
          {"suite": "nightly-tpu-perf-kimi-k26", "run_name": "perf-kimi-k26", "timeout": 7200, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gemma4-31b", "run_name": "perf-gemma4-31b", "timeout": 3600, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-gemma4-26b-a4b", "run_name": "perf-gemma4-26b-a4b", "timeout": 3600, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-qwen3-5-397b", "run_name": "perf-qwen3-5-397b", "timeout": 3600, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-glm-5-3-flash", "run_name": "perf-glm-5-3-flash", "timeout": 3600, "weights_pvc": "model-weights"},
          {"suite": "nightly-tpu-perf-glm-5-3-flash-mk", "run_name": "perf-glm-5-3-flash-mk", "timeout": 3600, "weights_pvc": "model-weights"}]') }}
    name: ${{ matrix.entry.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.entry.suite }}
      run_name: ${{ matrix.entry.run_name }}
      nightly: true
      weights_pvc: ${{ matrix.entry.weights_pvc }}
      timeout_per_file: ${{ matrix.entry.timeout }}
    permissions:
      contents: read
      id-token: write
