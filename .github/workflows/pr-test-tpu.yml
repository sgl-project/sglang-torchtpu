# PR gate: runs the registered TPU per-commit suite on a single-host 2x2x1 slice.
#
# Runs when EITHER:
#   * the PR touches a TPU-explicit path (auto), OR
#   * the PR carries the `tpu` label (manual opt-in -- for shared-code changes a
#     maintainer judges need TPU coverage but that don't match those paths).
#
# Why path-OR-label instead of the label alone: a label added by the labeler bot's
# GITHUB_TOKEN does NOT trigger a new workflow run, so relying on the label alone
# would miss the auto case. The path check makes auto reliable; the label covers
# manual. Keep the `tpu` path list below in sync with .github/labeler.yml.
name: PR Test (TPU)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pr-test-tpu-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Detect TPU-explicit path changes
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tpu:
              - 'python/sglang/srt/hardware_backend/tpu/**'
              - 'python/pyproject_tpu.toml'
              - 'benchmark/tpu/**'
              - 'docker/tpu.Dockerfile'
              - 'docker/cloudbuild.tpu.yaml'
              - 'test/registered/tpu/**'
              - '.github/tpu-ci/**'
              - '.github/workflows/_tpu-build.yml'
              - '.github/workflows/_tpu-test.yml'
              - '.github/workflows/pr-test-tpu.yml'
              - '.github/workflows/nightly-test-tpu.yml'
      - name: Gate on tpu-path change OR `tpu` label
        id: gate
        run: |
          if [[ "${{ steps.paths.outputs.tpu }}" == "true" || \
                "${{ contains(github.event.pull_request.labels.*.name, 'tpu') }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the image once (keyless WIF). Fork PRs can't get WIF secrets, so keep the
  # reserved slice for trusted branches only.
  build:
    needs: decide
    if: >-
      needs.decide.outputs.run == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    permissions:
      contents: read
      id-token: write

  # Per-commit TPU suite on a single-host 2x2x1 slice (sized from topology.yaml).
  integration:
    needs: build
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      image: ${{ needs.build.outputs.digest }}
      suite: stage-b-test-tpu-4-v7
    permissions:
      contents: read
      id-token: write
