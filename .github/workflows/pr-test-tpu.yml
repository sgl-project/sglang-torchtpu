# PR gate: runs the registered TPU per-commit suite on a single-host 2x2x1 slice.
#
# Like the other PR test workflows, the suite needs the `run-ci` label, read live
# by pr-gate.yml (add it, or comment `/tag-and-rerun-ci`). Applies to any PR
# base when EITHER:
#   * the PR touches a TPU-explicit path (auto), OR
#   * the PR carries the `tpu` label (manual opt-in -- for shared-code changes a
#     maintainer judges need TPU coverage but that don't match those paths).
#
# Why path-OR-label instead of the label alone: a label added by the labeler bot's
# GITHUB_TOKEN does NOT trigger a new workflow run, so relying on the label alone
# would miss the auto case. The path check makes auto reliable; the label covers
# manual. Keep the `tpu` path list below in sync with .github/labeler.yml.
name: PR Test (TPU)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  # Unrelated label events skip every job, so they get a group of their own and
  # cannot cancel a running TPU suite.
  group: >-
    pr-test-tpu-${{ github.event.pull_request.number }}-${{
      github.event.action == 'labeled' &&
      github.event.label.name != 'tpu' &&
      github.event.label.name != 'run-ci' && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  decide:
    # `labeled` is used only for `run-ci` and `tpu`. Labels are fetched live
    # below so label-then-rerun is not tied to the original event payload.
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'tpu' ||
      github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    # dorny/paths-filter lists the PR's changed files via the GitHub API (read).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Fetch latest PR state
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("labels", JSON.stringify(pr.data.labels.map(l => l.name)));

      - name: Detect TPU-explicit path changes
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tpu:
              - 'sglang_tpu/**'
              - 'pyproject.toml'
              # Re-export shims left by the plugin move.
              - 'python/sglang/srt/hardware_backend/tpu/**'
              - 'python/sglang/srt/layers/attention/pallas/**'
              - 'python/sglang/srt/layers/moe/pallas/**'
              - 'python/sglang/srt/disaggregation/tpu/**'
              - 'python/sglang/test/tpu/**'
              - 'python/sglang/multimodal_gen/runtime/platforms/tpu.py'
              - 'python/sglang/multimodal_gen/runtime/platforms/__init__.py'
              # Shared diffusion files carrying a TPU-only branch.
              - 'python/sglang/multimodal_gen/runtime/layers/custom_op.py'
              - 'python/sglang/multimodal_gen/runtime/layers/layernorm.py'
              - 'python/sglang/multimodal_gen/runtime/layers/vocab_parallel_embedding.py'
              - 'python/sglang/multimodal_gen/runtime/distributed/parallel_state.py'
              - 'python/sglang/multimodal_gen/runtime/disaggregation/transport/manager.py'
              - 'python/sglang/multimodal_gen/runtime/managers/memory_managers/layerwise_offload.py'
              - 'python/sglang/multimodal_gen/test/unit/test_tpu_*.py'
              - 'python/sglang/multimodal_gen/test/unit/test_platform_detection.py'
              - 'python/pyproject_tpu.toml'
              - 'benchmark/tpu/**'
              - 'docker/tpu.Dockerfile'
              - 'docker/tpu-base.Dockerfile'
              - 'docker/cloudbuild.tpu.yaml'
              - 'docker/cloudbuild.tpu-base.yaml'
              - 'test/registered/tpu/**'
              - 'test/registered/unit/hardware_backend/tpu/**'
              - 'test/registered/unit/layers/attention/pallas/**'
              - 'test/registered/unit/layers/moe/pallas/**'
              - 'test/registered/e2e/tpu/**'
              - 'test/registered/e2e/hardware_backend/tpu/**'
              - '.github/tpu-ci/**'
              - '.github/workflows/_tpu-build.yml'
              - '.github/workflows/_tpu-test.yml'
              - '.github/workflows/pr-test-tpu.yml'
              - '.github/workflows/nightly-test-tpu.yml'
              - '.github/workflows/feature-validation-tpu.yml'
              - '.github/workflows/accuracy-test-tpu.yml'
              - '.github/workflows/perf-test-tpu.yml'
      - name: Gate on TPU relevance
        id: gate
        run: |
          if [[ "${{ steps.paths.outputs.tpu }}" == "true" || \
                "${{ contains(fromJson(steps.pr.outputs.labels), 'tpu') }}" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # A TPU-relevant PR FAILS here without run-ci, rather than silently passing
  # without tests.
  pr-gate:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/pr-gate.yml
    secrets: inherit

  # Build the image once (keyless WIF). Fork PRs can't get WIF secrets, so keep the
  # reserved slice for trusted branches only.
  build:
    needs: [decide, pr-gate]
    if: >-
      needs.decide.outputs.run == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_tpu-build.yml
    with:
      # PR head SHA (immutable, matches the pushed code) rather than the test-merge
      # commit, whose merge_commit_sha lags a force-push and can check out stale code.
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      id-token: write

  # Per-commit TPU suite on a single-host 2x2x1 slice (sized from topology.yaml).
  unit:
    name: unit-test
    needs: build
    uses: ./.github/workflows/_tpu-test.yml
    with:
      # PR head SHA (immutable, matches the pushed code) rather than the test-merge
      # commit, whose merge_commit_sha lags a force-push and can check out stale code.
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      image: ${{ needs.build.outputs.digest }}
      # Unit suite (kernels/backends; each test self-contained, no model server) runs
      # first so a broken kernel fails before the serving suite claims the slice.
      suite: stage-a-test-tpu-unit
      # The PR gate runs the plugin platform (mode B); nightly lanes cover mode A.
      platform: tpu_oot
      # Most unit tests are registered chips=1 and run four at a time, each
      # pinned to one chip of the slice. Whole-node tests follow sequentially.
      tpu_chip_workers: 4
    permissions:
      contents: read
      id-token: write

  e2e:
    name: e2e-test
    needs: build
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      image: ${{ needs.build.outputs.digest }}
      suite: stage-b-test-tpu-4-v7
      platform: tpu_oot
      weights_pvc: model-weights
    permissions:
      contents: read
      id-token: write

  # Aggregator finish job for branch protection / required status checks.
  # If tests are skipped (non-TPU PR), this finishes green immediately.
  # If tests are run, it blocks until all TPU stages finish and fails if any fail.
  pr-test-tpu-finish:
    # An unrelated label skips decide. Its trivial success reports under another
    # name so it cannot replace a failed gate's result for the same head.
    name: >-
      ${{ needs.decide.result == 'skipped' && 'pr-test-tpu-finish (label event)'
      || 'pr-test-tpu-finish' }}
    needs: [decide, pr-gate, build, unit, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all TPU job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')

          for job in $job_names; do
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "TPU CI job '$job' failed or was cancelled."
              exit 1
            fi
          done
          echo "All TPU CI jobs completed successfully (or were intentionally skipped)."
          exit 0
