# Nightly TPU e2e on the external cluster. Builds the image ONCE (same _tpu-build as the
# in-project nightly; the external cluster's nodes pull it from the Project A Artifact
# Registry), then discovers the `external-nightly-*` work and runs it as ONE matrix job PER
# SLICE. The external cluster has no Kueue, so discovery buckets launch groups across each
# shape's slices: slices run in PARALLEL (one job each), and the groups on a slice run serially
# inside that job. Weights are served from the Project A GCS bucket over gcsfuse.
# See .github/tpu-ci/external/README.md.
#
name: Nightly Test (External TPU)

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC daily; staggered after the in-project nightly (00:30 PT)
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      test_filter:
        description: "Space-separated substrings of test file paths; runs only the groups that match one"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  # Discover the external-nightly work, bucketed into one entry PER SLICE (test-owned launch
  # specs + round-robin over the shape's slices).
  discover:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slices: ${{ steps.d.outputs.slices }}
      pairs: ${{ steps.d.outputs.pairs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml >/dev/null 2>&1 || true
          slices="$(python3 .github/tpu-ci/external/render_external_jobset.py --list-groups)"
          if [ -n "$TEST_FILTER" ]; then
            slices="$(jq -c --arg f "$TEST_FILTER" \
                        '($f | split(" ") | map(select(. != ""))) as $fs
                         | [.[] | .groups |= map(select(.files as $x | any($fs[]; . as $s | $x | contains($s))))
                                | select(.groups != [])]' <<< "$slices")"
            if [ "$slices" = "[]" ]; then
              echo "::error::test_filter matched no external tests"
              exit 1
            fi
          fi
          # Slice-pair rows (P/D whose roles each fill a slice) run after the single-slice
          # rows: the cluster has no gang scheduling, so a pair overlapping a slice job
          # gets half-placed and its pods time out waiting for peers left Pending.
          pairs="$(jq -c '[.[] | select(.nodepool_var_decode)]' <<< "$slices")"
          slices="$(jq -c '[.[] | select(.nodepool_var_decode | not)]' <<< "$slices")"
          echo "slices=$slices" >> "$GITHUB_OUTPUT"
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
          echo "discovered external-nightly slices: $slices"
          echo "discovered external-nightly slice pairs: $pairs"
          # `|| true`: under set -e a bare `[ ... ] &&` as the step's last command
          # fails the step the moment tests ARE discovered (the scaffold-era bug
          # never fired because slices was always []).
          [ "$slices$pairs" = "[][]" ] && echo "No external-nightly-* tests registered yet; run will be skipped." || true

  # One matrix job PER SLICE (parallel across slices). Each runs its bucketed groups serially.
  run:
    needs: [build, discover]
    if: needs.discover.outputs.slices != '[]'
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.discover.outputs.slices) }}
    name: ${{ matrix.slice.name }}
    uses: ./.github/workflows/_external-tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      suite: ${{ matrix.slice.suite }}
      slice_name: ${{ matrix.slice.name }}
      nodepool_var: ${{ matrix.slice.nodepool_var }}
      nodepool_var_decode: ${{ matrix.slice.nodepool_var_decode || '' }}
      groups_json: ${{ toJSON(matrix.slice.groups) }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # Slice-pair rows, once every single-slice row is done (see the discover step).
  run-pairs:
    needs: [build, discover, run]
    if: ${{ !cancelled() && needs.discover.outputs.pairs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.discover.outputs.pairs) }}
    name: ${{ matrix.slice.name }}
    uses: ./.github/workflows/_external-tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      suite: ${{ matrix.slice.suite }}
      slice_name: ${{ matrix.slice.name }}
      nodepool_var: ${{ matrix.slice.nodepool_var }}
      nodepool_var_decode: ${{ matrix.slice.nodepool_var_decode }}
      groups_json: ${{ toJSON(matrix.slice.groups) }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
