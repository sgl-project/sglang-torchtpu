name: Nightly Test (External TPU)
run-name: Checkpoint prefetch with parallel loading
'on':
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  gpt-prefetch-multithread:
    uses: ./.github/workflows/_external-tpu-test.yml
    with:
      ref: 4cfdbfae398f2fe056403f5b24e8fdfc9f1ea019
      image: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu@sha256:4cba0731aab850af74de3caf5b583044f5b8a74a758e1be9906c29796b8a097f
      suite: external-nightly-1host
      slice_name: gpt-prefetch-multithread-trial
      nodepool_var: EXTERNAL_NODEPOOL_2X2X2_1
      groups_json: '[{"suite":"external-nightly-1host","mode":"exec","name":"gpt-prefetch-multithread-trial","run_name":"gpt-prefetch-mt","files":"test/registered/tpu/e2e/test_tpu_gpt_oss_120b_singlehost_prefix_cache_kv_offload_spec.py","timeout_per_file":3600,"cmd":"if
        [ \"$RANK\" = \"0\" ]; then unset TPU_WORKER_ID TPU_WORKER_HOSTNAMES TPU_PROCESS_ADDRESSES
        TPU_TOPOLOGY TPU_TOPOLOGY_WRAP TPU_TOPOLOGY_ALT TPU_HOST_BOUNDS TPU_ACCELERATOR_TYPE;
        for v in $(compgen -e | grep \"^MEGASCALE\"); do unset \"$v\"; done; timeout
        3600 python3 -c ''import json,runpy; m=runpy.run_path(''\"''\"''test/registered/tpu/e2e/test_tpu_gpt_oss_120b_singlehost_prefix_cache_kv_offload_spec.py''\"''\"'');
        m[\"LAUNCH_ENV\"][\"EXTRA_ARGS\"] += \" --model-loader-extra-config \" + json.dumps({\"enable_multithread_load\":True},separators=(\",\",\":\"));
        m[\"model_config_main\"](m[\"MODEL_CONFIG\"],base_url=m[\"BASE_URL\"])'';
        else true; fi"}]'
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  qwen-prefetch-multithread:
    uses: ./.github/workflows/_external-tpu-test.yml
    with:
      ref: 4cfdbfae398f2fe056403f5b24e8fdfc9f1ea019
      image: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu@sha256:4cba0731aab850af74de3caf5b583044f5b8a74a758e1be9906c29796b8a097f
      suite: external-nightly-1host
      slice_name: qwen-prefetch-multithread-trial
      nodepool_var: EXTERNAL_NODEPOOL_2X2X2_3
      groups_json: '[{"suite":"external-nightly-1host","mode":"exec","name":"qwen-prefetch-multithread-trial","run_name":"qwen-prefetch-mt","files":"test/registered/tpu/e2e/test_tpu_qwen3_coder_480b_singlehost_prefix_cache_kv_offload_gsm8k.py","timeout_per_file":3600,"cmd":"if
        [ \"$RANK\" = \"0\" ]; then unset TPU_WORKER_ID TPU_WORKER_HOSTNAMES TPU_PROCESS_ADDRESSES
        TPU_TOPOLOGY TPU_TOPOLOGY_WRAP TPU_TOPOLOGY_ALT TPU_HOST_BOUNDS TPU_ACCELERATOR_TYPE;
        for v in $(compgen -e | grep \"^MEGASCALE\"); do unset \"$v\"; done; timeout
        3600 python3 -c ''import json,runpy; m=runpy.run_path(''\"''\"''test/registered/tpu/e2e/test_tpu_qwen3_coder_480b_singlehost_prefix_cache_kv_offload_gsm8k.py''\"''\"'');
        m[\"LAUNCH_ENV\"][\"EXTRA_ARGS\"] += \" --model-loader-extra-config \" + json.dumps({\"enable_multithread_load\":True},separators=(\",\",\":\"));
        m[\"model_config_main\"](m[\"MODEL_CONFIG\"],base_url=m[\"BASE_URL\"])'';
        else true; fi"}]'
    secrets: inherit
    permissions:
      contents: read
      id-token: write
