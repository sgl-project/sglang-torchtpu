name: Nightly Test (External TPU)
run-name: Checkpoint prefetch using host page cache
'on':
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  gpt-prefetch-pagecache:
    uses: ./.github/workflows/_external-tpu-test.yml
    with:
      ref: nightly-cleanup-prefetch-pagecache
      image: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu@sha256:4cba0731aab850af74de3caf5b583044f5b8a74a758e1be9906c29796b8a097f
      suite: external-nightly-1host
      slice_name: gpt-prefetch-pagecache
      nodepool_var: EXTERNAL_NODEPOOL_2X2X2_1
      groups_json: '[{"suite":"external-nightly-1host","mode":"self","name":"gpt-prefetch-pagecache","run_name":"gpt-prefetch-pagecache","files":"test/registered/tpu/e2e/test_tpu_gpt_oss_120b_singlehost_prefix_cache_kv_offload_spec.py","timeout_per_file":3600}]'
    secrets: inherit
    permissions:
      contents: read
      id-token: write
  qwen-prefetch-pagecache:
    uses: ./.github/workflows/_external-tpu-test.yml
    with:
      ref: nightly-cleanup-prefetch-pagecache
      image: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu@sha256:4cba0731aab850af74de3caf5b583044f5b8a74a758e1be9906c29796b8a097f
      suite: external-nightly-1host
      slice_name: qwen-prefetch-pagecache
      nodepool_var: EXTERNAL_NODEPOOL_2X2X2_3
      groups_json: '[{"suite":"external-nightly-1host","mode":"self","name":"qwen-prefetch-pagecache","run_name":"qwen-prefetch-pagecache","files":"test/registered/tpu/e2e/test_tpu_qwen3_coder_480b_singlehost_prefix_cache_kv_offload_gsm8k.py","timeout_per_file":3600}]'
    secrets: inherit
    permissions:
      contents: read
      id-token: write
