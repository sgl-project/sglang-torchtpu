name: Nightly Test (External TPU)
run-name: Read live Qwen prefetch logs
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  read-live-log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXTERNAL_CLUSTER: ${{ secrets.EXTERNAL_CLUSTER }}
      EXTERNAL_PROJECT: ${{ secrets.EXTERNAL_PROJECT }}
      EXTERNAL_NODEPOOL_2X2X2_3: ${{ secrets.EXTERNAL_NODEPOOL_2X2X2_3 }}
      CANDIDATE_IMAGE: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu@sha256:4cba0731aab850af74de3caf5b583044f5b8a74a758e1be9906c29796b8a097f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4cfdbfae398f2fe056403f5b24e8fdfc9f1ea019
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
          service_account: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.EXTERNAL_CLUSTER }}
          location: us-central1
          project_id: ${{ env.EXTERNAL_PROJECT }}
          use_dns_based_endpoint: true
      - name: Read only the running candidate pod log
        run: |
          set -euo pipefail
          kubectl -n default get pods -l app=external-tpu-ci -o json > /tmp/pods.json
          python3 - <<'PY' > /tmp/candidate-pod
          import json, os
          pods = [pod for pod in json.load(open('/tmp/pods.json'))['items']
                  if pod['status']['phase'] == 'Running'
                  and pod['spec'].get('nodeSelector', {}).get('cloud.google.com/gke-nodepool') == os.environ['EXTERNAL_NODEPOOL_2X2X2_3']
                  and any(c['image'] == os.environ['CANDIDATE_IMAGE'] for c in pod['spec']['containers'])
                  and pod['metadata']['labels'].get('jobset.sigs.k8s.io/jobset-name', '').startswith('qwen-prefetch-mt-')]
          assert len(pods) == 1, f'Expected one running candidate pod, found {len(pods)}'
          print(pods[0]['metadata']['name'])
          PY
          kubectl -n default get pod "$(cat /tmp/candidate-pod)" -o json > /tmp/candidate-spec.json
          python3 - <<'PYCPU' > /tmp/resources-raw.log
          import json
          pod = json.load(open('/tmp/candidate-spec.json'))
          for c in pod['spec'].get('initContainers', []) + pod['spec']['containers']:
              print(c['name'], json.dumps(c.get('resources', {})))
          PYCPU
          kubectl -n default logs -c gke-gcsfuse-sidecar "$(cat /tmp/candidate-pod)" --tail=300 > /tmp/gcsfuse-raw.log 2>&1 || true
          kubectl -n default exec -c gke-gcsfuse-sidecar "$(cat /tmp/candidate-pod)" -- /bin/sh -c 'cat /sys/fs/cgroup/cpu.stat; cat /sys/fs/cgroup/memory.current; cat /sys/fs/cgroup/memory.max' >> /tmp/resources-raw.log 2>&1 || true
          kubectl -n default exec -c test "$(cat /tmp/candidate-pod)" -- python3 -c 'import json,os,pathlib,urllib.request; v=os.statvfs("/"); print("ROOT_DISK",json.dumps({"total":v.f_blocks*v.f_frsize,"available":v.f_bavail*v.f_frsize})); print("MEMINFO",json.dumps({k:v.strip() for k,v in (l.split(":",1) for l in pathlib.Path("/proc/meminfo").read_text().splitlines()) if k in ("MemTotal","MemAvailable","Cached","Shmem")})); print("CGROUP",json.dumps({n:pathlib.Path("/sys/fs/cgroup/"+n).read_text() for n in ("memory.current","memory.max","cpu.stat") if pathlib.Path("/sys/fs/cgroup/"+n).exists()})); print(urllib.request.urlopen("http://127.0.0.1:62990/metrics",timeout=10).read().decode())' > /tmp/storage-metrics-raw.log 2>&1 || true
          python3 -u .github/tpu-ci/external/sanitize_logs.py < /tmp/storage-metrics-raw.log > storage-metrics.log
          python3 -u .github/tpu-ci/external/sanitize_logs.py < /tmp/resources-raw.log > resources.log
          python3 -u .github/tpu-ci/external/sanitize_logs.py < /tmp/gcsfuse-raw.log > gcsfuse-live.log
          kubectl -n default logs -c test "$(cat /tmp/candidate-pod)" --timestamps --tail=10000 > /tmp/qwen-live-raw.log
          python3 -u .github/tpu-ci/external/sanitize_logs.py < /tmp/qwen-live-raw.log > qwen-live.log
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('qwen-live.log').read_text(errors='replace').splitlines()
          selected = [line for line in lines if len(line) < 1000 and any(word in line for word in ('Load weight', 'Loading safetensors', 'TIMINGS', 'Accuracy [', 'Traceback', 'ERROR', 'prefetch'))]
          print('\n'.join(selected[-80:]))
          print('Last log lines:')
          print('\n'.join(line[:1000] for line in lines[-15:]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-prefetch-live-log
          path: |
            qwen-live.log
            resources.log
            storage-metrics.log
            gcsfuse-live.log
          if-no-files-found: ignore
          retention-days: 1
