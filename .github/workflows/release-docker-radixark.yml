name: Build and Push Docker Image (radixark)
#
# Fork-local Docker pipeline for this private collaboration repo. Pushes to
# radixark/sglang-torchtpu on Docker Hub, never to the upstream lmsysorg
# namespace. Scoped to sgl-project/sglang-torchtpu only so it can never run
# after this repo is merged back / synced from upstream.
#
# docker_target defaults to the existing framework_final stage as a
# connectivity check; swap it once a TPU (torch_xla) build stage lands in
# docker/Dockerfile.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to push (e.g. dev-tpu-poc)"
        required: true
      docker_target:
        description: "Dockerfile target stage to build"
        required: false
        default: "framework_final"
      checkout_ref:
        description: "Git ref to build (leave empty for default branch)"
        required: false
        default: ""

concurrency:
  group: release-docker-radixark-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'sgl-project/sglang-torchtpu'
    environment: radixark-docker
    runs-on: x64-docker-build-node
    steps:
      - name: Cleanup workspace (remove root-owned files from prior runs)
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # RADIXARK_DOCKERHUB_USERNAME/TOKEN MUST be a Docker Hub organization Access
      # Token scoped to only the radixark/sglang-torchtpu repo (Read & Write),
      # generated under Org Settings -> Identity & auth -> Access tokens — never
      # the radixark org owner account or its password. An owner credential here
      # would let a leaked secret (or a malicious PR that reaches this step)
      # push/delete every repo in the org.
      - name: Login to Docker Hub (radixark)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.RADIXARK_DOCKERHUB_USERNAME }}
          password: ${{ secrets.RADIXARK_DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          TAG: ${{ inputs.tag }}
          DOCKER_TARGET: ${{ inputs.docker_target }}
        run: |
          docker buildx build \
            --target "$DOCKER_TARGET" \
            --platform linux/amd64 \
            --push \
            -f docker/Dockerfile \
            -t "radixark/sglang-torchtpu:$TAG" \
            .
