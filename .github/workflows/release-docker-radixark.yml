name: Build and Push Docker Image (radixark)
#
# Fork-local Docker pipeline for this private collaboration repo. Pushes to
# radixark/sglang-torchtpu on Docker Hub, never to the upstream lmsysorg
# namespace. Scoped to sgl-project/sglang-torchtpu only so it can never run
# after this repo is merged back / synced from upstream.
#
# docker_target defaults to the existing framework_final stage as a
# connectivity check; swap it once a TPU (torch_xla) build stage lands in
# docker/Dockerfile.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to push (e.g. dev-tpu-poc)"
        required: true
      docker_target:
        description: "Dockerfile target stage to build"
        required: false
        default: "framework_final"
      checkout_ref:
        description: "Git ref to build (leave empty for default branch)"
        required: false
        default: ""

concurrency:
  group: release-docker-radixark-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.repository == 'sgl-project/sglang-torchtpu'
    environment: radixark-docker
    runs-on: linux-x64-k3s-docker-build
    steps:
      - name: Cleanup workspace (remove root-owned files from prior runs)
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      # Build with an ISOLATED, empty Docker config so NO Docker Hub credential is
      # sent while pulling public base images. RADIXARK_DOCKERHUB_TOKEN is an org
      # Access Token scoped to ONLY radixark/sglang-torchtpu; whenever it is
      # present in ~/.docker/config.json, Docker Hub rejects pulls of out-of-scope
      # repos (e.g. nvidia/cuda) with "insufficient scopes". That credential is
      # written by the login step below AND persists on the runner's volume across
      # runs, so merely ordering login after build is NOT enough — the build must
      # actively ignore it. A throwaway empty DOCKER_CONFIG makes base pulls
      # anonymous; we authenticate only for the push step. (Runner is native
      # linux/amd64, so the image builds into the daemon here, no --platform.)
      - name: Build image
        env:
          TAG: ${{ inputs.tag }}
          DOCKER_TARGET: ${{ inputs.docker_target }}
        run: |
          # BRANCH_TYPE=local builds from this fork's checked-out source; without
          # it the Dockerfile's framework_final stage hits a deliberate `exit 1`.
          BUILD_DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$BUILD_DOCKER_CONFIG"' EXIT
          DOCKER_CONFIG="$BUILD_DOCKER_CONFIG" docker build \
            --target "$DOCKER_TARGET" \
            --build-arg BRANCH_TYPE=local \
            -f docker/Dockerfile \
            -t "radixark/sglang-torchtpu:$TAG" \
            .

      # RADIXARK_DOCKERHUB_USERNAME/TOKEN MUST be a Docker Hub organization Access
      # Token scoped to only the radixark/sglang-torchtpu repo (Read & Write),
      # generated under Org Settings -> Identity & auth -> Access tokens — never
      # the radixark org owner account or its password. An owner credential here
      # would let a leaked secret (or a malicious PR that reaches this step)
      # push/delete every repo in the org.
      - name: Login to Docker Hub (radixark)
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.RADIXARK_DOCKERHUB_USERNAME }}
          password: ${{ secrets.RADIXARK_DOCKERHUB_TOKEN }}

      - name: Push image
        env:
          TAG: ${{ inputs.tag }}
        run: docker push "radixark/sglang-torchtpu:$TAG"
