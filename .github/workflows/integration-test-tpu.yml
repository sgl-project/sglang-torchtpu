# TPU P/D-disaggregation integration test:
#   2p2d-prefix-caching-kv-offload (issue #376): multihost prefill + multihost
#   decode, prefix caching + raiden KV offload on prefill.
#
# pd-tp-resharding (issue #378) lives in combo-test-tpu.yml (-f target=pd-tpreshard),
# which is where it was verified for #415; nightly-test-tpu.yml runs both on a
# schedule, and only scheduled runs reach the CI dashboard.
#
# One JobSet per model profile; matrix rows run serially (the roles' slices are
# shared, scarce capacity). Requires the nightly pool to hold TWO 2x2x2 slices
# (one per role) or the JobSet stays Pending until its deadline.
#
# Trigger:
#   gh workflow run integration-test-tpu.yml [-f ref=<branch>] \
#     [-f suite=all|pd_prefix_caching_kv_offload] \
#     [-f model=all|gpt_oss_120b|qwen3_coder_480b]
name: Integration Test (TPU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      suite:
        description: "Which integration test suite to run"
        required: false
        default: all
        type: choice
        options: [all, pd_prefix_caching_kv_offload]
      model:
        description: "Which model profile(s) to run"
        required: false
        default: all
        type: choice
        options: [all, qwen3_coder_480b, gpt_oss_120b]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  test-2p2d-prefix-caching-kv-offload:
    needs: build
    if: inputs.suite == 'all' || inputs.suite == 'pd_prefix_caching_kv_offload'
    strategy:
      fail-fast: false
      max-parallel: 1   # both rows contend for the same two slices
      matrix:
        # matrix context is unavailable in job-level `if`; selection shapes the matrix.
        model: ${{ (inputs.model == 'all' && fromJSON('["gpt_oss_120b","qwen3_coder_480b"]')) || fromJSON(format('["{0}"]', inputs.model)) }}
    name: test-2p2d-prefix-caching-kv-offload-${{ matrix.model }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      hosts: 2
      lane: nightly
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=${{ matrix.model }} python3 test/registered/tpu/e2e/test_tpu_pd_multihost_prefix_cache_kv_offload.py
      files: test/registered/tpu/e2e/test_tpu_pd_multihost_prefix_cache_kv_offload.py
      weights_pvc: model-weights-rox
      run_name: 2p2d-kvoff-${{ matrix.model }}
    permissions:
      contents: read
      id-token: write
