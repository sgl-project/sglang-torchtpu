# TPU P/D-disaggregation integration tests:
# 1. pd-prefix-caching-kv-offload (issue #376): multihost prefill + multihost
#    decode, prefix caching + raiden KV offload on prefill.
# 2. pd-tp-resharding (issue #378): multihost prefill (TP16EP16) + multihost
#    decode (DP2TP8EP16) with heterogeneous attention TP resharding.
#
# One JobSet per model profile; matrix rows run serially (the roles' slices are
# shared, scarce capacity). Requires the nightly pool to hold TWO 2x2x2 slices
# (one per role) or the JobSet stays Pending until its deadline.
#
# Trigger:
#   gh workflow run integration-test-tpu.yml [-f ref=<branch>] \
#     [-f suite=all|pd_prefix_caching_kv_offload|pd_tp_resharding] \
#     [-f model=all|gpt_oss_120b|qwen3_coder_480b]
name: Integration Test (TPU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      suite:
        description: "Which integration test suite to run"
        required: false
        default: all
        type: choice
        options: [all, pd_prefix_caching_kv_offload, pd_tp_resharding]
      model:
        description: "Which model profile(s) to run"
        required: false
        default: all
        type: choice
        options: [all, qwen3_coder_480b, gpt_oss_120b]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  pd-prefix-caching-kv-offload:
    needs: build
    if: inputs.suite == 'all' || inputs.suite == 'pd_prefix_caching_kv_offload'
    strategy:
      fail-fast: false
      max-parallel: 1   # both rows contend for the same two slices
      matrix:
        # matrix context is unavailable in job-level `if`; selection shapes the matrix.
        model: ${{ (inputs.model == 'gpt_oss_120b' && fromJSON('["gpt_oss_120b"]')) || fromJSON('["gpt_oss_120b"]') }}
    name: pd-prefix-caching-kv-offload-${{ matrix.model }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      hosts: 2
      lane: nightly
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=${{ matrix.model }} python3 test/registered/tpu/integration/test_pd_prefix_caching_kv_offload.py
      weights_pvc: model-weights-rox
      run_name: pd-kvoff-${{ matrix.model }}
    permissions:
      contents: read
      id-token: write

  pd-tp-resharding:
    needs: build
    if: inputs.suite == 'all' || inputs.suite == 'pd_tp_resharding' || inputs.suite == null
    strategy:
      fail-fast: false
      max-parallel: 1   # both rows contend for the same two slices
      matrix:
        # matrix context is unavailable in job-level `if`; selection shapes the matrix.
        model: ${{ (inputs.model == 'qwen3_coder_480b' && fromJSON('["qwen3_coder_480b"]')) || fromJSON('["qwen3_coder_480b"]') }}
    name: pd-tp-resharding-${{ matrix.model }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      # hosts feeds only the slice concurrency group; the P/D topology below
      # sizes the JobSet (2-host prefill slice + 2-host decode slice).
      hosts: 2
      # The nightly lane is the only one owning two 2x2x2 slices, which is what a
      # prefill engine and a decode engine need at the same time.
      lane: nightly
      pd_prefill_hosts: 2
      pd_decode_hosts: 2
      exec_cmd: env MODEL_PROFILE=${{ matrix.model }} python3 test/registered/tpu/integration/test_pd_tp_resharding.py
      weights_pvc: model-weights-rox
      run_name: pd-tpreshard-${{ matrix.model }}
    permissions:
      contents: read
      id-token: write
