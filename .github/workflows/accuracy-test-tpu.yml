# Nightly TPU quality evals, with one TPU slice per suite.
# Scores are emitted for longitudinal tracking without quality thresholds.
# Manual dispatch:
#   gh workflow run accuracy-test-tpu.yml -f model=gpt-oss-120b -f ref=<branch>
name: Accuracy Test (TPU)

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "America/Los_Angeles"  # Two hours after functional nightly.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      model:
        description: "Which model to evaluate"
        required: false
        default: gpt-oss-120b
        type: choice
        options: [all, gpt-oss-120b, deepseek-r1-0528, kimi-k26]

concurrency:
  # Serialize runs for the same ref.
  group: tpu-accuracy-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  eval:
    needs: build
    if: ${{ contains(fromJSON('["all","gpt-oss-120b"]'), inputs.model || 'gpt-oss-120b') }}
    strategy:
      # Preserve independent eval results when one fails.
      fail-fast: false
      matrix:
        # One job per eval isolates failures and runtime budgets.
        suite: ${{ fromJSON('["tpu-eval-gpt-oss-120b-aime",
          "tpu-eval-gpt-oss-120b-gpqa","tpu-eval-gpt-oss-120b-gsm8k","tpu-eval-gpt-oss-120b-mmlupro"]') }}
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      nightly: true
      # Admission is separate; each test file gets a 90-minute runtime budget.
      weights_pvc: model-weights-rox
      timeout_per_file: 5400
    permissions:
      contents: read
      id-token: write

  # Multihost test files own their launch specifications.
  discover-multihost:
    needs: build
    if: ${{ contains(fromJSON('["all","deepseek-r1-0528","kimi-k26"]'), inputs.model || 'gpt-oss-120b') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        env:
          MODEL: ${{ inputs.model || 'gpt-oss-120b' }}
        run: |
          set -euo pipefail
          groups="$(python3 .github/tpu-ci/discover_multihost.py \
                      --suite nightly-tpu-multihost-ondemand)"
          if [ "$MODEL" != "all" ]; then
            groups="$(jq -c --arg m "$MODEL" \
                        '[.[] | select(.name | contains($m))]' <<< "$groups")"
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  eval-multihost:
    needs: [build, discover-multihost]
    if: needs.discover-multihost.outputs.groups != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover-multihost.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.build.outputs.digest }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      timeout_per_file: ${{ matrix.group.timeout_per_file }}
      run_name: ${{ matrix.group.name }}
    permissions:
      contents: read
      id-token: write
