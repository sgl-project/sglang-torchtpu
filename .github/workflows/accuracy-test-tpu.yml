# TPU accuracy evals -- test/registered/tpu/nightly-accuracy/ via run_suite, ONE
# JOB PER BENCHMARK so each eval takes its own slice, runs in parallel, and gets
# its own runtime budget (a slow AIME cannot cost GPQA its score). Scores are
# emitted for longitudinal tracking without quality thresholds (report_only).
# Stage [2] of the nightly (nightly-test-tpu.yml calls this workflow with a
# prebuilt image); this action is also the isolated trigger, for collecting a
# datapoint on demand without waiting for a nightly:
#   gh workflow run accuracy-test-tpu.yml [-f model=gpt-oss-120b] [-f ref=<branch>]
#
# Single-host models go through run_suite; multihost accuracy uses JobSets.
# Each model uses the same serving recipe for scheduled and manual runs.
# MMMU-Pro (the Kimi shards, both Gemma 4 sizes, Qwen3.5-397B) is kept out of the
# nightly's slices; it runs in the two daytime slots below.
name: Accuracy Test (TPU)
run-name: "Accuracy Test (TPU)${{ inputs.update-dashboard && ' [publish]' || '' }}"

on:
  # Pacific time, DST-aware like the nightly. `plan` maps each cron to its tests,
  # so a changed cron must change there too.
  schedule:
    - cron: "0 10 * * *"  # mmmu-kimi: both Kimi shards, one 2-host slice each
      timezone: "America/Los_Angeles"
    - cron: "0 17 * * *"  # mmmu-gemma4-qwen35: two 1-host slices and one 2-host slice
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      model:
        # `nightly` is what the nightly runs (no MMMU-Pro); `mmmu-*` are the two
        # daytime slots; `all` and `full-set` are everything.
        description: "Which model to evaluate"
        required: false
        default: all
        type: choice
        options: [all, nightly, full-set, mmmu-kimi, mmmu-gemma4-qwen35, gpt-oss-120b, gpt-oss-20b, gemma4, deepseek-r1-0528, deepseek-v3-1, kimi-k26, qwen3-5-397b]
      test_filter:
        description: "Substring of a multihost test file path; runs only matching tests"
        required: false
        default: ""
        type: string
      update-dashboard:
        description: "Publish this run's results to the dashboard (main only)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      model:
        required: false
        default: all
        type: string
      test_filter:
        required: false
        default: ""
        type: string
      image:
        required: false
        default: ""
        type: string

concurrency:
  # Only governs standalone runs (a called workflow rides the caller's group).
  # Keyed on ref so runs for different branches proceed in parallel; same ref
  # still serializes, so a re-dispatch cannot race the previous run's scores.
  # Each schedule slot gets its own group: a late Kimi run must not hold 5 PM back.
  group: tpu-accuracy-${{ github.event.schedule || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # The selection every job below filters on: the input when given (a dispatch, or
  # the nightly's `nightly`), else the schedule slot that fired. A called workflow
  # sees its caller's event, so the input must win over github.event.schedule.
  plan:
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.p.outputs.model }}
    steps:
      - id: p
        env:
          MODEL: ${{ inputs.model }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -z "$MODEL" ]; then
            case "$SCHEDULE" in
              "0 10 * * *") MODEL=mmmu-kimi ;;
              "0 17 * * *") MODEL=mmmu-gemma4-qwen35 ;;
              "") MODEL=all ;;
              # Never fall back to `all`: that would put every eval on the slices.
              *) echo "::error::no selection for schedule '$SCHEDULE'"; exit 1 ;;
            esac
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "selection: $MODEL"

  # Standalone runs build their own image; the nightly passes one in so every
  # stage of the run tests a single build.
  build:
    if: ${{ (inputs.image || '') == '' }}
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  accuracy:
    needs: [build, plan]
    # `build` may be skipped (image passed in); !cancelled() keeps this alive then.
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","nightly","gpt-oss-120b"]'), needs.plan.outputs.model) }}
    strategy:
      # A broken benchmark must not cancel the others' scores.
      fail-fast: false
      matrix:
        # One suite (= one file, one job, one slice) per benchmark, each paired
        # with the name its Kubernetes objects get. JobSet validates the POD name,
        # tpu-ci-<run_name>-<5 rand>-slice-0-0-<5 rand>, against 63 chars, which
        # leaves run_name 34; the suite itself (38-41) is rejected at admission.
        # Suites stay spelled out: the pr-gate lint greps this file for each
        # nightly-accuracy registration's literal suite. The next model adds its
        # legs here and a choice above; selection stays in the job-level `if`
        # while a single model is the only single-host entrant.
        include:
          - suite: nightly-tpu-accuracy-gpt-oss-120b-aime
            run_name: accuracy-gpt-oss-120b-aime
          - suite: nightly-tpu-accuracy-gpt-oss-120b-gpqa
            run_name: accuracy-gpt-oss-120b-gpqa
          - suite: nightly-tpu-accuracy-gpt-oss-120b-gsm8k
            run_name: accuracy-gpt-oss-120b-gsm8k
          - suite: nightly-tpu-accuracy-gpt-oss-120b-mmlupro
            run_name: accuracy-gpt-oss-120b-mmlupro
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      run_name: ${{ matrix.run_name }}
      nightly: true
      weights_pvc: model-weights
      # Admission is separate; each eval file gets a 90-minute runtime budget.
      timeout_per_file: 5400
    permissions:
      contents: read
      id-token: write

  accuracy-gpt-oss-20b:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","nightly","full-set","gpt-oss-20b"]'), needs.plan.outputs.model) }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: nightly-tpu-accuracy-gpt-oss-20b
      run_name: accuracy-gpt-oss-20b
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 10800
    permissions:
      contents: read
      id-token: write

  accuracy-gemma4:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","nightly","full-set","gemma4"]'), needs.plan.outputs.model) }}
    strategy:
      fail-fast: false
      matrix:
        # One suite per benchmark and checkpoint, each with a 90-minute budget.
        include:
          - suite: nightly-tpu-accuracy-gemma4-31b-aime
            run_name: accuracy-gemma4-31b-aime
          - suite: nightly-tpu-accuracy-gemma4-31b-gpqa
            run_name: accuracy-gemma4-31b-gpqa
          - suite: nightly-tpu-accuracy-gemma4-26b-a4b-aime
            run_name: accuracy-gemma4-26b-a4b-aime
          - suite: nightly-tpu-accuracy-gemma4-26b-a4b-gpqa
            run_name: accuracy-gemma4-26b-a4b-gpqa
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      run_name: ${{ matrix.run_name }}
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 5400
    permissions:
      contents: read
      id-token: write

  # The 5 PM slot, not the nightly: 77 min (31B) and 98 min (26B) measured.
  accuracy-gemma4-mmmupro:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","gemma4","mmmu-gemma4-qwen35"]'), needs.plan.outputs.model) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: nightly-tpu-accuracy-gemma4-31b-mmmupro
            run_name: accuracy-gemma4-31b-mmmupro
          - suite: nightly-tpu-accuracy-gemma4-26b-a4b-mmmupro
            run_name: accuracy-gemma4-26b-a4b-mmmupro
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      run_name: ${{ matrix.run_name }}
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 9000
    permissions:
      contents: read
      id-token: write

  # Scheduled and manually dispatched accuracy share the same multihost suite.
  discover-multihost:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","nightly","full-set","mmmu-kimi","mmmu-gemma4-qwen35","deepseek-r1-0528","deepseek-v3-1","kimi-k26","qwen3-5-397b"]'), needs.plan.outputs.model) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        env:
          MODEL: ${{ needs.plan.outputs.model }}
          TEST_FILTER: ${{ inputs.test_filter }}
          UPDATE_DASHBOARD: ${{ inputs.update-dashboard }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ] && [ "$UPDATE_DASHBOARD" = "true" ]; then
            echo "::error::test_filter cannot be combined with update-dashboard"
            exit 1
          fi
          groups="$(python3 .github/tpu-ci/discover_multihost.py \
                      --suite nightly-tpu-multihost-accuracy)"
          # Each file declares its lane in MULTIHOST_LAUNCH["schedule"]; a model
          # name still selects by file name, for a one-off dispatch.
          case "$MODEL" in
            all|full-set) keep='.' ;;
            nightly|mmmu-kimi|mmmu-gemma4-qwen35) keep='map(select(.schedule == $m))' ;;
            *) keep='map(select(.name | contains($m | gsub("-"; "_"))))' ;;
          esac
          groups="$(jq -c --arg m "$MODEL" "$keep" <<< "$groups")"
          if [ -n "$TEST_FILTER" ]; then
            groups="$(jq -c --arg f "$TEST_FILTER" \
                        '[.[] | select(.files | contains($f))]' <<< "$groups")"
            if [ "$groups" = "[]" ]; then
              echo "::error::test_filter matched no multihost tests"
              exit 1
            fi
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  accuracy-multihost:
    needs: [build, plan, discover-multihost]
    if: >-
      ${{ !cancelled() && needs.discover-multihost.result == 'success'
          && needs.discover-multihost.outputs.groups != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover-multihost.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      display_name: ${{ matrix.group.name }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      timeout_per_file: ${{ matrix.group.timeout_per_file }}
      # The group's COMPACT name (discovery hashes the path): the file stem would
      # push the pod name past 63 chars for deepseek-r1-0528. The test stays
      # legible in the job name and in the job's own "== test files: ==" line.
      run_name: ${{ matrix.group.run_name }}
    permissions:
      contents: read
      id-token: write

  collect-full-evaluations:
    needs: accuracy-multihost
    if: ${{ always() && needs.accuracy-multihost.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Collect predictions and validate full MMMU-Pro coverage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/tpu-ci/collect_full_evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-evaluation-results
          path: full-eval-results/
          if-no-files-found: ignore
          retention-days: 30
