# TPU accuracy evals -- test/registered/tpu/nightly-accuracy/ via run_suite, ONE
# JOB PER BENCHMARK so each eval takes its own slice, runs in parallel, and gets
# its own runtime budget (a slow AIME cannot cost GPQA its score). Each score is
# published, then checked against a lenient floor (baseline - atol in the test).
# The accuracy stage: it runs on its own 10 AM / 5 PM schedule below rather
# than inside the nightly, and is also the isolated trigger, for collecting a
# datapoint on demand without waiting for a slot:
#   gh workflow run accuracy-test-tpu.yml [-f model=gpt-oss-120b] [-f ref=<branch>]
#
# Single-host models go through run_suite; multihost accuracy uses JobSets.
# Each model uses the same serving recipe for scheduled and manual runs.
# Accuracy stays off the 1 AM nightly, whose feature and perf jobs already fill
# both lanes; each daytime slot fills the lane its MMMU-Pro legs leave idle.
name: Accuracy Test (TPU)
run-name: "Accuracy Test (TPU)${{ inputs.update-dashboard && ' [publish]' || '' }}"

on:
  # Pacific time, DST-aware like the nightly. `plan` maps each cron to its tests,
  # so a changed cron must change there too.
  schedule:
    - cron: "0 10 * * *"  # day-10am: Kimi MMMU on the 2-host slices, single-host accuracy on the 1-host ones
      timezone: "America/Los_Angeles"
    - cron: "0 17 * * *"  # day-5pm: Gemma4/Qwen3.5/Qwen3.8 MMMU on 1-host, DeepSeek accuracy on 2-host
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      model:
        # `day-*` are the two daytime slots; `all` and `full-set` are everything.
        description: "Which model to evaluate"
        required: false
        default: all
        type: choice
        options: [all, full-set, day-10am, day-5pm, gpt-oss-120b, gpt-oss-20b, gemma4, deepseek-r1-0528, deepseek-v3-1, kimi-k26, qwen3-5-397b, qwen3-8-27b]
      test_filter:
        description: "Substring of a multihost test file path; runs only matching tests"
        required: false
        default: ""
        type: string
      update-dashboard:
        description: "Publish this run's results to the dashboard (main only)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      model:
        required: false
        default: all
        type: string
      test_filter:
        required: false
        default: ""
        type: string
      image:
        required: false
        default: ""
        type: string

concurrency:
  # Only governs standalone runs (a called workflow rides the caller's group).
  # Keyed on ref and model: one group per selection, so a re-dispatch of the
  # same selection waits for the previous run.
  # Each schedule slot gets its own group: a late Kimi run must not hold 5 PM back.
  group: tpu-accuracy-${{ github.event.schedule || inputs.ref || github.ref }}-${{ inputs.model || 'all' }}
  cancel-in-progress: false

jobs:
  # The selection every job below filters on: the input when given (a dispatch or
  # a caller), else the schedule slot that fired. A called workflow sees its
  # caller's event, so the input must win over github.event.schedule.
  plan:
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.p.outputs.model }}
    steps:
      - id: p
        env:
          MODEL: ${{ inputs.model }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -z "$MODEL" ]; then
            case "$SCHEDULE" in
              "0 10 * * *") MODEL=day-10am ;;
              "0 17 * * *") MODEL=day-5pm ;;
              "") MODEL=all ;;
              # Never fall back to `all`: that would put every eval on the slices.
              *) echo "::error::no selection for schedule '$SCHEDULE'"; exit 1 ;;
            esac
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "selection: $MODEL"

  # Standalone runs build their own image; the nightly passes one in so every
  # stage of the run tests a single build.
  build:
    if: ${{ (inputs.image || '') == '' }}
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  accuracy:
    needs: [build, plan]
    # `build` may be skipped (image passed in); !cancelled() keeps this alive then.
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","day-10am","gpt-oss-120b"]'), needs.plan.outputs.model) }}
    strategy:
      # A broken benchmark must not cancel the others' scores.
      fail-fast: false
      matrix:
        # One suite (= one file, one job, one slice) per benchmark, each paired
        # with the name its Kubernetes objects get. JobSet validates the POD name,
        # tpu-ci-<run_name>-<5 rand>-slice-0-0-<5 rand>, against 63 chars, which
        # leaves run_name 34; the suite itself (38-41) is rejected at admission.
        # Suites stay spelled out: the pr-gate lint greps this file for each
        # nightly-accuracy registration's literal suite. The next model adds its
        # legs here and a choice above; selection stays in the job-level `if`
        # while a single model is the only single-host entrant.
        include:
          - suite: nightly-tpu-accuracy-gpt-oss-120b-aime
            run_name: accuracy-gpt-oss-120b-aime
          - suite: nightly-tpu-accuracy-gpt-oss-120b-gpqa
            run_name: accuracy-gpt-oss-120b-gpqa
          - suite: nightly-tpu-accuracy-gpt-oss-120b-gsm8k
            run_name: accuracy-gpt-oss-120b-gsm8k
          - suite: nightly-tpu-accuracy-gpt-oss-120b-mmlupro
            run_name: accuracy-gpt-oss-120b-mmlupro
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      run_name: ${{ matrix.run_name }}
      nightly: true
      weights_pvc: model-weights
      # Admission is separate; each eval file gets a 90-minute runtime budget.
      timeout_per_file: 5400
    permissions:
      contents: read
      id-token: write

  accuracy-gpt-oss-20b:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","day-10am","gpt-oss-20b"]'), needs.plan.outputs.model) }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: nightly-tpu-accuracy-gpt-oss-20b
      run_name: accuracy-gpt-oss-20b
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 10800
    permissions:
      contents: read
      id-token: write

  accuracy-gemma4:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","day-10am","gemma4"]'), needs.plan.outputs.model) }}
    strategy:
      fail-fast: false
      matrix:
        # One suite per benchmark and checkpoint; 2 h covers ~21 min of bring-up
        # plus the ~77 min of eval measured in CI.
        include:
          - suite: nightly-tpu-accuracy-gemma4-31b-aime
            run_name: accuracy-gemma4-31b-aime
          - suite: nightly-tpu-accuracy-gemma4-31b-gpqa
            run_name: accuracy-gemma4-31b-gpqa
          - suite: nightly-tpu-accuracy-gemma4-26b-a4b-aime
            run_name: accuracy-gemma4-26b-a4b-aime
          - suite: nightly-tpu-accuracy-gemma4-26b-a4b-gpqa
            run_name: accuracy-gemma4-26b-a4b-gpqa
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      run_name: ${{ matrix.run_name }}
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 7200
    permissions:
      contents: read
      id-token: write

  accuracy-qwen3-8:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","day-10am","qwen3-8-27b"]'), needs.plan.outputs.model) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: nightly-tpu-accuracy-qwen3-8-27b-gpqa
            run_name: accuracy-qwen3-8-27b-gpqa
          - suite: nightly-tpu-accuracy-qwen3-8-27b-aime
            run_name: accuracy-qwen3-8-27b-aime
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      run_name: ${{ matrix.run_name }}
      nightly: true
      weights_pvc: model-weights
      # GPQA's four 80k-budget passes measured 5113 s with a warm compile cache.
      timeout_per_file: 10800
    permissions:
      contents: read
      id-token: write

  # The 5 PM slot. 26B measured 8915 s in CI with bring-up; the
  # JobSet deadline is 1.5 x est_time and the admission wait is the 6 h cap's rest.
  accuracy-gemma4-mmmupro:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","gemma4","day-5pm"]'), needs.plan.outputs.model) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: nightly-tpu-accuracy-gemma4-31b-mmmupro
            run_name: accuracy-gemma4-31b-mmmupro
          - suite: nightly-tpu-accuracy-gemma4-26b-a4b-mmmupro
            run_name: accuracy-gemma4-26b-a4b-mmmupro
    name: ${{ matrix.suite }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: ${{ matrix.suite }}
      run_name: ${{ matrix.run_name }}
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 10800
    permissions:
      contents: read
      id-token: write

  # The 5 PM slot with the Gemma4 MMMU-Pro legs. FP8 fits one host (bf16 needs
  # two); the full set measured 2 h 22 min in CI.
  accuracy-qwen3-5-mmmupro:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","qwen3-5-397b","day-5pm"]'), needs.plan.outputs.model) }}
    name: nightly-tpu-accuracy-qwen3-5-397b-mmmupro
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: nightly-tpu-accuracy-qwen3-5-397b-mmmupro
      run_name: accuracy-qwen3-5-397b-mmmupro
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 10800
    permissions:
      contents: read
      id-token: write

  # The 5 PM slot. BF16 TP8 fits one host; the full set measured 5490 s in CI
  # with bring-up.
  accuracy-qwen3-8-mmmupro:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","qwen3-8-27b","day-5pm"]'), needs.plan.outputs.model) }}
    name: nightly-tpu-accuracy-qwen3-8-27b-mmmupro
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      lane: nightly
      hosts: 1
      suite: nightly-tpu-accuracy-qwen3-8-27b-mmmupro
      run_name: accuracy-qwen3-8-27b-mmmupro
      nightly: true
      weights_pvc: model-weights
      timeout_per_file: 10800
    permissions:
      contents: read
      id-token: write

  # Scheduled and manually dispatched accuracy share the same multihost suite.
  discover-multihost:
    needs: [build, plan]
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && contains(fromJSON('["all","full-set","day-10am","day-5pm","deepseek-r1-0528","deepseek-v3-1","kimi-k26","qwen3-5-397b"]'), needs.plan.outputs.model) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        env:
          MODEL: ${{ needs.plan.outputs.model }}
          TEST_FILTER: ${{ inputs.test_filter }}
          UPDATE_DASHBOARD: ${{ inputs.update-dashboard }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ] && [ "$UPDATE_DASHBOARD" = "true" ]; then
            echo "::error::test_filter cannot be combined with update-dashboard"
            exit 1
          fi
          groups="$(python3 .github/tpu-ci/discover_multihost.py \
                      --suite nightly-tpu-multihost-accuracy)"
          # Test files only say "nightly"; the slot is decided here. The 10 AM slot
          # takes the Kimi MMMU shards, the 5 PM slot every other file, so a new
          # file runs without picking a slot. A model name selects by file name.
          kimi='test("^test_tpu_kimi_k26_mmmu_")'
          case "$MODEL" in
            all|full-set) keep='.' ;;
            day-10am) keep="map(select(.name | $kimi))" ;;
            day-5pm) keep="map(select(.name | $kimi | not))" ;;
            *) keep='map(select(.name | contains($m | gsub("-"; "_"))))' ;;
          esac
          groups="$(jq -c --arg m "$MODEL" "$keep" <<< "$groups")"
          if [ -n "$TEST_FILTER" ]; then
            groups="$(jq -c --arg f "$TEST_FILTER" \
                        '[.[] | select(.files | contains($f))]' <<< "$groups")"
            if [ "$groups" = "[]" ]; then
              echo "::error::test_filter matched no multihost tests"
              exit 1
            fi
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  accuracy-multihost:
    needs: [build, plan, discover-multihost]
    if: >-
      ${{ !cancelled() && needs.discover-multihost.result == 'success'
          && needs.discover-multihost.outputs.groups != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover-multihost.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      display_name: ${{ matrix.group.name }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      timeout_per_file: ${{ matrix.group.timeout_per_file }}
      # The group's COMPACT name (discovery hashes the path): the file stem would
      # push the pod name past 63 chars for deepseek-r1-0528. The test stays
      # legible in the job name and in the job's own "== test files: ==" line.
      run_name: ${{ matrix.group.run_name }}
    permissions:
      contents: read
      id-token: write

  collect-full-evaluations:
    needs: accuracy-multihost
    if: ${{ always() && needs.accuracy-multihost.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Collect predictions and validate full MMMU-Pro coverage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/tpu-ci/collect_full_evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-evaluation-results
          path: full-eval-results/
          if-no-files-found: ignore
          retention-days: 30
