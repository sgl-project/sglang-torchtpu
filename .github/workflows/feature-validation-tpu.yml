# TPU feature validation -- the nightly's feature stage (nightly-test-tpu.yml calls
# this workflow with a prebuilt image), and its own dispatchable trigger for
# running the stage, or a single test, without a full nightly:
#   gh workflow run feature-validation-tpu.yml [-f only=<job>] [-f ref=<branch>]
#
# Jobs:
#   * single-host  -> one job per nightly-tpu-4-v7 test (discover_tests.py).
#   * multi-host   -> discover_multihost.py finds multi-host test files
#                     (MULTIHOST_LAUNCH) registered to nightly-tpu-multihost and
#                     GROUPS them by launch spec; one JobSet per group (launch
#                     once, rank-0 runs the group's files).
#   * pd-*         -> static P/D disaggregation gates (2 engines per job).
# Most feature validation runs on the external cluster instead
# (nightly-test-external-tpu.yml, the external-nightly-* suites); what stays here
# is waiting on its weights in the external bucket.
# Every job runs in the `nightly` lane (topology.yaml) and maps to exactly ONE
# test file, so a red job names its test (the dashboard contract).
name: Feature Validation (TPU)
run-name: "Feature Validation (TPU)${{ inputs.update-dashboard && ' [publish]' || '' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      only:
        description: "Run only one part"
        required: false
        default: all
        type: choice
        options:
          - all
          - mh
          - pd-sh-qwen3-vl-30b
          - sh
      test_filter:
        description: "Substring of a test file path; runs only matching tests"
        required: false
        default: ""
        type: string
      update-dashboard:
        description: "Publish this run's results to the dashboard (main only)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        required: false
        default: main
        type: string
      only:
        required: false
        default: all
        type: string
      image:
        required: false
        default: ""
        type: string
      test_filter:
        required: false
        default: ""
        type: string
      # Forwarded so the test_filter guard below sees it on the nightly path
      # too; a called workflow does not inherit the caller's inputs.
      update-dashboard:
        required: false
        default: false
        type: boolean

concurrency:
  # Only governs standalone dispatches (a called workflow rides the caller's
  # group). Keyed on ref so branches proceed in parallel; same ref serializes.
  group: tpu-feature-validation-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  # Standalone runs build their own image; the nightly passes one in so every
  # stage of the run tests a single build.
  build:
    if: ${{ (inputs.image || '') == '' }}
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  discover-tests:
    needs: build
    # `build` may be skipped (image passed in); !cancelled() keeps this alive then.
    if: ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      single_host: ${{ steps.tests.outputs.single_host }}
      pd_singlehost_qwen3_vl_30b: ${{ steps.tests.outputs.pd_singlehost_qwen3_vl_30b }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: tests
        env:
          # Read through env rather than inline interpolation so a filter string
          # cannot break out of the shell command.
          TEST_FILTER: ${{ inputs.test_filter }}
          UPDATE_DASHBOARD: ${{ inputs.update-dashboard }}
        run: |
          set -euo pipefail
          # A filtered run is a partial nightly, and ingestion replaces the
          # datapoints for a (run_id, attempt) -- publishing one would overwrite
          # the trend with a subset. Mutually exclusive by construction.
          if [ -n "$TEST_FILTER" ] && [ "$UPDATE_DASHBOARD" = "true" ]; then
            echo "::error::test_filter cannot be combined with update-dashboard"
            exit 1
          fi
          single_host=$(python3 .github/tpu-ci/discover_tests.py --suite nightly-tpu-4-v7 --nightly)
          if [ -n "$TEST_FILTER" ]; then
            single_host=$(printf '%s' "$single_host" \
              | python3 .github/tpu-ci/filter_tests.py --filter "$TEST_FILTER")
            echo "test_filter=$TEST_FILTER kept: $single_host"
          fi
          echo "single_host=$single_host" >> "$GITHUB_OUTPUT"
          discover_files='python3 .github/tpu-ci/discover_files.py'
          echo "pd_singlehost_qwen3_vl_30b=$($discover_files --entry test/registered/tpu/e2e/test_tpu_qwen3_vl_30b_a3b_pd_singlehost_mmmu.py)" >> "$GITHUB_OUTPUT"

  single-host:
    needs: [build, discover-tests]
    if: >-
      ${{ !cancelled() && needs.discover-tests.result == 'success'
          && ((inputs.only || 'all') == 'all' || inputs.only == 'sh')
          && needs.discover-tests.outputs.single_host != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-tests.outputs.single_host) }}
    name: ${{ matrix.test.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      display_name: ${{ matrix.test.name }}
      lane: nightly
      suite: ${{ matrix.test.suite }}
      test_file: ${{ matrix.test.file }}
      nightly: true
      # nightly-tpu-4-v7 runs mode B like the PR gate; multi-host, P/D, accuracy
      # and perf lanes stay on mode A, so each test runs in one mode only.
      platform: tpu_oot
      run_name: ${{ matrix.test.run_name }}
      weights_pvc: ${{ matrix.test.weights_pvc || 'model-weights' }}
    permissions:
      contents: read
      id-token: write

  # Qwen3-VL-30B-A3B MMMU-Pro on the raiden P/D pair: the prefill runs the ViT,
  # so image-derived KV crosses into a fused-MoE decode. Same serving settings
  # and gate as the single-host Qwen3-VL-30B-A3B test, which isolates the handoff.
  # In-project: its weights are not staged for the external cluster (no internet egress there).
  pd-sh-qwen3-vl-30b:
    needs: [build, discover-tests]
    if: >-
      ${{ !cancelled() && needs.discover-tests.result == 'success'
          && contains(fromJSON('["all","pd-sh-qwen3-vl-30b"]'), inputs.only || 'all')
          && contains('test/registered/tpu/e2e/test_tpu_qwen3_vl_30b_a3b_pd_singlehost_mmmu.py', inputs.test_filter) }}
    name: ${{ fromJSON(needs.discover-tests.outputs.pd_singlehost_qwen3_vl_30b)[0].name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      display_name: test_tpu_qwen3_vl_30b_a3b_pd_singlehost_mmmu
      lane: nightly
      hosts: 1
      pd_prefill_hosts: 1
      pd_decode_hosts: 1
      exec_cmd: python3 test/registered/tpu/e2e/test_tpu_qwen3_vl_30b_a3b_pd_singlehost_mmmu.py integration
      files: test/registered/tpu/e2e/test_tpu_qwen3_vl_30b_a3b_pd_singlehost_mmmu.py
      weights_pvc: model-weights
      run_name: ${{ fromJSON(needs.discover-tests.outputs.pd_singlehost_qwen3_vl_30b)[0].run_name }}
    permissions:
      contents: read
      id-token: write

  # Discover multi-host launch groups from the test files (test-owned launch specs).
  discover:
    needs: build
    if: >-
      ${{ !cancelled() && (inputs.image != '' || needs.build.result == 'success')
          && ((inputs.only || 'all') == 'all' || inputs.only == 'mh') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      groups: ${{ steps.d.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: d
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          groups="$(python3 .github/tpu-ci/discover_multihost.py --suite nightly-tpu-multihost)"
          if [ -n "$TEST_FILTER" ]; then
            groups=$(printf '%s' "$groups" \
              | python3 .github/tpu-ci/filter_tests.py --filter "$TEST_FILTER")
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "discovered groups: $groups"

  # A typo'd filter selects nothing, GitHub skips the jobs it emptied, and a
  # skipped job reads as a pass -- a green run that tested nothing. No single
  # job below can see that: each knows only its own family. So the filter is
  # checked against every test this stage can run, and with no `needs` it
  # fails in seconds rather than after the image build.
  filter-matched:
    if: ${{ inputs.test_filter != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - env:
          # Read through env rather than inline interpolation so a filter
          # string cannot break out of the shell command.
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          set -euo pipefail
          python3 .github/tpu-ci/filter_tests.py --filter "$TEST_FILTER" --verify

  # One JobSet per launch group. matrix.group is a discovered object.
  multi-host:
    needs: [build, discover]
    if: >-
      ${{ !cancelled() && needs.discover.result == 'success'
          && needs.discover.outputs.groups != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.discover.outputs.groups) }}
    name: ${{ matrix.group.name }}
    uses: ./.github/workflows/_tpu-test.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ inputs.image || needs.build.outputs.digest }}
      display_name: ${{ matrix.group.name }}
      lane: nightly
      nightly: true
      launch_script: ${{ matrix.group.launch_script }}
      files: ${{ matrix.group.files }}
      hosts: ${{ matrix.group.hosts }}
      weights_pvc: ${{ matrix.group.weights_pvc }}
      timeout_per_file: ${{ matrix.group.timeout_per_file }}
      run_name: ${{ matrix.group.run_name }}
    permissions:
      contents: read
      id-token: write
