# Nightly TPU e2e with Remote Wheel override and automated baseline comparison.
#
# Automated workflow lifecycle:
# 1. Resolves the latest nightly run on `main`: pulls its built container digest and
#    its job-level pass/fail results as the benchmark baseline.
# 2. Performs a fast single-layer mutation via Cloud Build (~45 seconds): pulls the
#    resolved nightly container, reinstalls the torch_tpu wheel from the private
#    torch-tpu registry (or user-specified wheel), logs the exact wheel version, and
#    pushes the new image.
# 3. Runs the test suites in parallel on GKE Cloud TPU hardware against the mutated container:
#      feature validation | perf  (accuracy runs on its own daytime schedule)
# 4. Compares current run results against the nightly main baseline, printing a
#    job-level pass/fail diff table with regressions and fixes to the GitHub Summary.
name: Nightly Test (TPU - Remote Wheel)
run-name: "Nightly Test (TPU - Remote Wheel)${{ inputs.update-dashboard && ' [publish]' || '' }}"

on:
  # Dispatch-only: run it against a candidate wheel before bumping the torch_tpu pin.
  # A daily run replayed the whole nightly on the nightly slices it shares.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        default: main
      wheel:
        description: "Package specifier from PyPI (default: torch_tpu latest) or URL"
        required: false
        default: "torch_tpu"
        type: string
      wheel_gcs_url:
        description: "Optional GCS URL to candidate torch_tpu wheel (e.g. gs://bucket/path/to/torch_tpu-*.whl). Overrides 'wheel'."
        required: false
        default: ""
        type: string
      base_image:
        description: "Existing SGLang TPU image digest (optional: if omitted, automatically uses latest nightly image)"
        required: false
        default: ""
        type: string
      rebuild_base:
        description: "Force full build from source instead of reusing latest nightly image"
        required: false
        default: false
        type: boolean
      only:
        description: "Run only one stage (or one feature-validation part)"
        required: false
        default: all
        type: choice
        options:
          - all
          - feature-validation
          - perf
          - mh
          - pd-mh-gpt-120b
          - pd-mh-gpt-120b-pc-offload
          - pd-mh-gpt-120b-spec
          - pd-mh-gpt-120b-pc-offload-spec
          - pd-mh-gpt-120b-pc-offload-spec-reshard
          - pd-mh-gpt-120b-tp-reshard
          - pd-sh-gpt-120b
          - pd-sh-gpt-120b-spec
          - sh
      test_filter:
        description: "Substring of a test file path; runs only matching tests"
        required: false
        default: ""
        type: string
      update-dashboard:
        description: "Publish this run's results to the dashboard (main only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Optional: full rebuild from scratch only if rebuild_base is requested
  build-from-scratch:
    if: ${{ inputs.rebuild_base }}
    uses: ./.github/workflows/_tpu-build.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
    permissions:
      contents: read
      id-token: write

  # Step 1: Pull container image and job-level baseline from latest nightly run on main
  resolve-baseline:
    needs: [build-from-scratch]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      baseline_run_id: ${{ steps.resolve.outputs.baseline_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: resolve
        env:
          INPUT_BASE_IMAGE: ${{ inputs.base_image }}
          REBUILD_IMAGE: ${{ needs.build-from-scratch.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p baseline_data
          echo "Resolving baseline metadata and image from latest nightly run on main..."
          python3 .github/tpu-ci/resolve_nightly_baseline.py --output-json baseline_data/baseline.json > baseline_data/resolved_image.txt
          resolved_image="$(cat baseline_data/resolved_image.txt)"
          baseline_run_id="$(python3 -c 'import json; print(json.load(open("baseline_data/baseline.json")).get("run_id", ""))')"

          if [ -n "$INPUT_BASE_IMAGE" ]; then
            echo "Using user-specified base image: $INPUT_BASE_IMAGE"
            final_image="$INPUT_BASE_IMAGE"
          elif [ -n "$REBUILD_IMAGE" ]; then
            echo "Using freshly rebuilt base image: $REBUILD_IMAGE"
            final_image="$REBUILD_IMAGE"
          else
            echo "Using resolved nightly main image: $resolved_image"
            final_image="$resolved_image"
          fi

          echo "image=$final_image" >> "$GITHUB_OUTPUT"
          echo "baseline_run_id=$baseline_run_id" >> "$GITHUB_OUTPUT"

      - name: Upload baseline metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-baseline-metadata
          path: baseline_data/baseline.json

  # Step 2: Single-layer mutation via Cloud Build (~45s)
  override-wheel:
    needs: [resolve-baseline]
    if: ${{ !cancelled() && needs.resolve-baseline.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      GCP_PROJECT: sglang-torchtpu
      AR_IMAGE: us-central1-docker.pkg.dev/sglang-torchtpu/sglang-torchtpu-ci/sglang-tpu
      WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
      CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
          token_format: 'access_token'
          create_credentials_file: false
      - uses: google-github-actions/setup-gcloud@v2
      - id: build
        env:
          CI_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          BASE_IMAGE: ${{ needs.resolve-baseline.outputs.image }}
          WHEEL: ${{ inputs.wheel_gcs_url || inputs.wheel || 'torch_tpu' }}
          INPUT_REF: ${{ inputs.ref || 'main' }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
          ORIGIN_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          tokfile="${RUNNER_TEMP}/tpu-ci.token"
          printf '%s' "$CI_ACCESS_TOKEN" > "$tokfile"
          trap 'rm -f "$tokfile"' EXIT

          mkdir -p "$GITHUB_WORKSPACE/wheel_override"
          if [[ "$WHEEL" == gs://* ]]; then
            echo "Downloading GCS candidate wheel in runner: $WHEEL"
            gcloud storage cp "$WHEEL" "$GITHUB_WORKSPACE/wheel_override/" --access-token-file="$tokfile"
            echo "Staged GCS wheel: $(ls -lh "$GITHUB_WORKSPACE/wheel_override")"
          elif [[ "$WHEEL" == http://* || "$WHEEL" == https://* ]]; then
            echo "Downloading HTTP candidate wheel in runner: $WHEEL"
            curl -sSL -H "Authorization: Bearer $CI_ACCESS_TOKEN" -O --output-dir "$GITHUB_WORKSPACE/wheel_override" "$WHEEL"
            echo "Staged HTTP wheel: $(ls -lh "$GITHUB_WORKSPACE/wheel_override")"
          fi

          bucket="${GCP_PROJECT}_cloudbuild"
          src="${RUNNER_TEMP}/source.tgz"
          tar --exclude=./.git -czf "$src" -C "$GITHUB_WORKSPACE" .

          safe_ref="$(printf '%s' "$INPUT_REF" | tr -c 'A-Za-z0-9_.-' '-')"
          safe_trigger="$(printf '%s' "$TRIGGER_ACTOR" | tr -c 'A-Za-z0-9_.-' '-')"
          safe_origin="$(printf '%s' "$ORIGIN_ACTOR" | tr -c 'A-Za-z0-9_.-' '-')"
          who="${safe_trigger:0:20}"
          if [ "$safe_trigger" != "$safe_origin" ]; then
            who="${safe_trigger:0:20}-rr-${safe_origin:0:20}"
          fi
          tag="$(date -u +%Y%m%d)-${who}-${safe_ref:0:12}-wheel-${{ github.run_id }}.${{ github.run_attempt }}"
          object="source/${tag}.tgz"

          gcloud storage cp "$src" "gs://${bucket}/${object}" --project "$GCP_PROJECT" \
            --access-token-file="$tokfile"

          echo "Triggering Cloud Build single-layer wheel mutation..."
          digest="$(python3 .github/tpu-ci/run_cloudbuild.py \
            --project "$GCP_PROJECT" --config docker/cloudbuild.tpu-remote-wheel.yaml \
            --bucket "$bucket" --object "$object" --tag "$tag" --token-file "$tokfile" \
            --substitutions "_BASE_IMAGE=${BASE_IMAGE}" "_WHEEL=${WHEEL}" \
            --max-attempts 2)"

          echo "digest=${AR_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "built ${AR_IMAGE}@${digest}"

  # Step 3: Run test suites against the overridden container
  feature-validation:
    needs: override-wheel
    if: ${{ !cancelled() && needs.override-wheel.result == 'success' && (inputs.only || 'all') != 'perf' }}
    uses: ./.github/workflows/feature-validation-tpu.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.override-wheel.outputs.digest }}
      only: ${{ contains(fromJSON('["all","feature-validation"]'), inputs.only || 'all') && 'all' || inputs.only }}
      test_filter: ${{ inputs.test_filter || '' }}
      update-dashboard: ${{ inputs.update-dashboard || false }}
    permissions:
      contents: read
      id-token: write

  perf:
    needs: override-wheel
    if: ${{ !cancelled() && needs.override-wheel.result == 'success' && contains(fromJSON('["all","perf"]'), inputs.only || 'all') }}
    uses: ./.github/workflows/perf-test-tpu.yml
    with:
      ref: ${{ inputs.ref || 'main' }}
      image: ${{ needs.override-wheel.outputs.digest }}
      model: all
    permissions:
      contents: read
      id-token: write

  # Step 4: Compare current run results against the nightly main baseline
  report-baseline-diff:
    needs: [resolve-baseline, override-wheel, feature-validation, perf]
    if: ${{ always() && !cancelled() && needs.resolve-baseline.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Download baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: nightly-baseline-metadata
          path: baseline_data
      - name: Generate baseline comparison report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/tpu-ci/compare_against_baseline.py \
            --baseline-json baseline_data/baseline.json \
            --current-run-id "${{ github.run_id }}" \
            --output-markdown baseline_comparison.md
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: baseline-comparison-report
          path: baseline_comparison.md
