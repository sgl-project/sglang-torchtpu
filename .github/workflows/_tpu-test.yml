# Reusable: render the unified JobSet onto the already-built `image` (digest), stream
# its logs, and gate on the JobSet Completed/Failed condition. Two modes:
#   * single-host suite  -> pass `suite` (run_suite runs it; hosts=1)
#   * multi-host group    -> pass `launch_script` + `files` + `hosts` (+ weights_pvc)
# A single-host suite may also race for any single-host slot (multihost_slots /
# external_slots): it is submitted to every eligible target and the first to start wins.
name: _tpu-test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      image:
        required: true
        type: string          # repo@sha256:... from _tpu-build
      nightly:
        required: false
        type: boolean
        default: false
      # --- single-host suite mode ---
      suite:
        required: false
        type: string
        default: ""
      test_file:
        required: false
        type: string
        default: ""
      # --- multi-host launch-group mode ---
      launch_script:
        required: false
        type: string
        default: ""
      files:
        required: false
        type: string
        default: ""           # space-separated test files rank-0 runs
      hosts:
        required: false
        type: number
        default: 1
      # Which lane's pools to use (topology.yaml). Both lanes own 1- and 2-host slices, so
      # host count alone no longer picks a pool. nightly-test-tpu.yml passes `nightly`.
      lane:
        required: false
        type: string
        default: pr-gate
      weights_pvc:
        required: false
        type: string
        default: ""
      timeout_per_file:
        required: false
        type: number
        default: 3600
      # Chip sharing: run this many `chips=1` tests at once on the slice the job
      # already holds, instead of giving every test all four chips. Whole-node
      # tests still run alone, after the shared ones have released their chips.
      tpu_chip_workers:
        required: false
        type: number
        default: 0
      partition_id:
        required: false
        type: number
        default: -1
      partition_size:
        required: false
        type: number
        default: 0
      run_name:
        required: false
        type: string
        default: ""
      # Names this job. Nested two deep (nightly -> stage -> here) the Actions
      # sidebar shows ONLY this job's name per leg, so it must be the test; the
      # fallbacks cover callers whose suite already is the test.
      display_name:
        required: false
        type: string
        default: ""
      # --- exec mode: every host runs this command; pod exit codes gate the JobSet ---
      exec_cmd:
        required: false
        type: string
        default: ""
      # --- P/D mode: prefill + decode groups, each on its own slice; needs
      # exec_cmd. `hosts` = the per-role slice size.
      pd_prefill_hosts:
        required: false
        type: number
        default: 0
      pd_decode_hosts:
        required: false
        type: number
        default: 0
      # --- single-host slot racing (suite mode only) ---
      # Also take one host of this lane's 2-host slice.
      multihost_slots:
        required: false
        type: boolean
        default: false
      # Also take one host of the external cluster while no external nightly is live.
      # Needs `secrets: inherit` and `actions: read` from the caller.
      external_slots:
        required: false
        type: boolean
        default: false

# No permissions block: a called workflow may not exceed its caller's grant, and only
# external_slots callers grant actions: read. Every caller sets contents + id-token.

concurrency:
  # Per-run group: supersession only. Slice contention is Kueue's job -- a shared
  # GitHub group keeps one job pending and cancels the rest.
  group: tpu-test-${{ github.run_id }}-${{ inputs.run_name || inputs.test_file || inputs.files || inputs.suite }}
  cancel-in-progress: false

env:
  GCP_PROJECT: sglang-torchtpu
  GKE_ZONE: us-central1-c
  GKE_CLUSTER: tpu-cluster
  WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc-v2
  CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com

jobs:
  test:
    name: ${{ inputs.display_name || inputs.suite || inputs.run_name || 'test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's hard cap for hosted runners; cannot be raised
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
      - id: in-ctx
        run: |
          echo "ctx=$(kubectl config current-context)" >> "$GITHUB_OUTPUT"
          echo "kubeconfig=${KUBECONFIG}" >> "$GITHUB_OUTPUT"
      - if: inputs.external_slots
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.EXTERNAL_CLUSTER }}
          location: us-central1
          project_id: ${{ secrets.EXTERNAL_PROJECT }}
          use_dns_based_endpoint: true
      - id: ext-ctx
        if: inputs.external_slots
        # get-gke-credentials writes a fresh kubeconfig per call, so merge both clusters into one.
        # Bare kubectl (discover_pools, reconcile_quota) must keep talking to the in-project cluster.
        run: |
          echo "ctx=$(kubectl config current-context)" >> "$GITHUB_OUTPUT"
          merged="$RUNNER_TEMP/kubeconfig-merged"
          KUBECONFIG="${{ steps.in-ctx.outputs.kubeconfig }}:${KUBECONFIG}" kubectl config view --flatten > "$merged"
          echo "KUBECONFIG=${merged}" >> "$GITHUB_ENV"
          KUBECONFIG="$merged" kubectl config use-context '${{ steps.in-ctx.outputs.ctx }}'

      - name: TPU inventory
        continue-on-error: true
        run: |
          python3 .github/tpu-ci/tpu_inventory.py --summary "$GITHUB_STEP_SUMMARY" \
            --context 'internal=${{ steps.in-ctx.outputs.ctx }}' \
            --context 'external=${{ steps.ext-ctx.outputs.ctx }}'

      - name: Render + acquire a TPU slot
        id: acquire
        env:
          IN_CTX: ${{ steps.in-ctx.outputs.ctx }}
          EXT_CTX: ${{ steps.ext-ctx.outputs.ctx }}
          GH_TOKEN: ${{ github.token }}
          # Mirror _external-tpu-test.yml: one line per nodepool_vars entry in external-topology.yaml.
          EXTERNAL_NODEPOOL_2X2X2_0: ${{ inputs.external_slots && secrets.EXTERNAL_NODEPOOL_2X2X2_0 || '' }}
          EXTERNAL_NODEPOOL_2X2X2_1: ${{ inputs.external_slots && secrets.EXTERNAL_NODEPOOL_2X2X2_1 || '' }}
          EXTERNAL_NODEPOOL_2X2X2_2: ${{ inputs.external_slots && secrets.EXTERNAL_NODEPOOL_2X2X2_2 || '' }}
          EXTERNAL_NODEPOOL_2X2X2_3: ${{ inputs.external_slots && secrets.EXTERNAL_NODEPOOL_2X2X2_3 || '' }}
          EXTERNAL_NODEPOOL_2X2X4_0: ${{ inputs.external_slots && secrets.EXTERNAL_NODEPOOL_2X2X4_0 || '' }}
          EXTERNAL_NODEPOOL_2X2X4_1: ${{ inputs.external_slots && secrets.EXTERNAL_NODEPOOL_2X2X4_1 || '' }}
        run: |
          set -euo pipefail
          label='${{ inputs.run_name || inputs.test_file || inputs.files || inputs.suite }}'
          JOB_CEILING_S=21600        # 360m, the GitHub cap
          suite='${{ inputs.suite }}'
          python3 -m pip install --quiet --disable-pip-version-check pyyaml >/dev/null 2>&1 || true
          multihost_slots='${{ inputs.multihost_slots }}'
          external_slots='${{ inputs.external_slots }}'
          if { [ "$multihost_slots" = true ] || [ "$external_slots" = true ]; } && \
             { [ -z "$suite" ] || [ -n "${{ inputs.launch_script }}${{ inputs.exec_cmd }}" ] || \
               [ '${{ inputs.hosts }}' != 1 ] || [ '${{ inputs.pd_prefill_hosts }}' != 0 ]; }; then
            echo "::error::multihost_slots/external_slots need single-host suite mode"; exit 1
          fi
          render() {  # extra render_jobset.py args...
            python3 .github/tpu-ci/render_jobset.py \
            --image '${{ inputs.image }}' \
            --suite '${{ inputs.suite }}' \
            --test-file '${{ inputs.test_file }}' \
            --launch-script '${{ inputs.launch_script }}' \
            --files '${{ inputs.files }}' \
            --exec '${{ inputs.exec_cmd }}' \
            --hosts '${{ inputs.hosts }}' \
            --lane '${{ inputs.lane }}' \
            --pd-prefill-hosts '${{ inputs.pd_prefill_hosts }}' \
            --pd-decode-hosts '${{ inputs.pd_decode_hosts }}' \
            --weights-pvc '${{ inputs.weights_pvc }}' \
            --timeout-per-file '${{ inputs.timeout_per_file }}' \
            --tpu-chip-workers '${{ inputs.tpu_chip_workers }}' \
            --partition-id '${{ inputs.partition_id }}' \
            --partition-size '${{ inputs.partition_size }}' \
            --name '${{ inputs.run_name }}' \
            ${{ inputs.nightly && '--nightly' || '' }} "$@"
          }
          # Targets: id -> kube context, namespace, manifest, and whether Kueue admits it.
          declare -A T_CTX T_NS T_FILE T_KUEUE T_NAME
          targets=()
          add_target() {  # id ctx ns kueue(1|"") render-args...
            local id="$1" ctx="$2" ns="$3" kueue="$4"; shift 4
            render "$@" > "/tmp/job-${id}.yaml"
            T_CTX[$id]="$ctx"; T_NS[$id]="$ns"; T_FILE[$id]="/tmp/job-${id}.yaml"; T_KUEUE[$id]="$kueue"
            targets+=("$id")
            echo "== rendered ${id} (key fields) =="
            grep -nE 'completions:|gke-tpu-topology:|ci-tpu-pool:|gke-nodepool|claimName:|bash "benchmark|for f in|run_suite.py' "/tmp/job-${id}.yaml" | head
          }
          # Resolve pools before rendering, because the pod's nodeAffinity is baked in at
          # render time. Unions topology.yaml's list with any pool labelled
          # ci-tpu-lane=<lane> of this slice shape, and registers a new pool's Kueue flavor,
          # so adding a slice needs no code change. Fails open to topology.yaml.
          pools="$(python3 .github/tpu-ci/discover_pools.py \
                     --lane '${{ inputs.lane }}' --hosts '${{ inputs.hosts }}' --sync)"
          echo "pools for lane=${{ inputs.lane }} hosts=${{ inputs.hosts }}: ${pools}"
          add_target slice "$IN_CTX" tpu-ci 1 --pools "${pools}" \
            --service-account '${{ vars.TPU_CI_POD_KSA }}'
          if [ "$multihost_slots" = true ]; then
            pools2="$(python3 .github/tpu-ci/discover_pools.py --lane '${{ inputs.lane }}' --hosts 2 --sync)"
            echo "pools for lane=${{ inputs.lane }} hosts=2 (one host per job): ${pools2}"
            add_target host-of-2h "$IN_CTX" tpu-ci 1 --pools "${pools2}" --slice-hosts 2 \
              --service-account '${{ vars.TPU_CI_POD_KSA }}'
          fi

          # The external nightly owns the external cluster while any run of it is live.
          # Fail closed: an unreadable run list counts as live.
          external_nightly_live() {
            local n
            n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-test-external-tpu.yml/runs?per_page=20" \
                   --jq '[.workflow_runs[] | select(.status != "completed")] | length')" || return 0
            [ "$n" != 0 ]
          }
          if [ "$external_slots" = true ]; then
            ext_pools=""
            for v in $(python3 -c 'import yaml; s=yaml.safe_load(open(".github/tpu-ci/external/external-topology.yaml"))["suites"]; print(" ".join(dict.fromkeys(v for x in s.values() for v in x["nodepool_vars"])))'); do
              [ -n "${!v:-}" ] || { echo "::error::repo secret ${v} is not set (external/README.md 'Configuration')"; exit 1; }
              ext_pools="${ext_pools} ${!v}"
            done
            if external_nightly_live; then
              echo "external nightly is live; external slots stay off for this job"
            else
              add_target external "$EXT_CTX" default "" --external-pools "${ext_pools}"
            fi
          fi
          # Quota tracks live capacity, checked here rather than on a timer: it only has to
          # be right at the moment admission is decided. Fails open -- a stale quota is
          # survivable (waitForPodsReady evicts and requeues), a blocked test is not.
          # A (lane, hosts) can own several interchangeable slices, so reconcile each of its
          # pools: --pool drives the one-slice-per-pool guard, and a resized multi-host pool
          # must fail the job that would have straddled it.
          for t in "${targets[@]}"; do
            for p in $(grep -o '^# ci-tpu-pools: .*' "${T_FILE[$t]}" | cut -d' ' -f3-); do
              python3 .github/tpu-ci/reconcile_quota.py --pool="$p"
            done
          done

          kt() { local t="$1"; shift; kubectl --context="${T_CTX[$t]}" -n "${T_NS[$t]}" "$@"; }
          cleanup() {
            for t in "${!T_NAME[@]}"; do kt "$t" delete "${T_NAME[$t]}" --ignore-not-found --wait=false || true; done
          }
          trap cleanup EXIT
          for t in "${targets[@]}"; do
            T_NAME[$t]="$(kt "$t" create -f "${T_FILE[$t]}" -o name)"
            echo "Created ${T_NAME[$t]} on ${t}"
            [ -n "${T_KUEUE[$t]}" ] || continue
            # No Workload means Kueue ignored this JobSet and it would run with no gang
            # admission -- silent, and on a multi-host slice it ends as two half-placed gangs
            # deadlocked until their deadline. Fail closed instead.
            uid="$(kt "$t" get "${T_NAME[$t]}" -o jsonpath='{.metadata.uid}')"
            wl_sel="kueue.x-k8s.io/job-uid=${uid}"
            for _ in $(seq 1 15); do
              [ -n "$(kt "$t" get workloads -l "$wl_sel" -o name 2>/dev/null)" ] && break
              sleep 2
            done
            if [ -z "$(kt "$t" get workloads -l "$wl_sel" -o name 2>/dev/null)" ]; then
              echo "❌ ${label}: no Kueue Workload for ${T_NAME[$t]} -- admission control is OFF."
              echo "   Check: queue-name label on the JobSet, jobset in integrations.frameworks,"
              echo "   and that LocalQueue $(grep -o 'queue-name: .*' "${T_FILE[$t]}" | awk '{print $2}') exists in tpu-ci."
              kt "$t" get localqueues 2>/dev/null || true
              exit 1
            fi
            echo "Kueue Workload present on ${t}; admission control active."
          done

          # Runtime budget, computed here because the admission budget is whatever is left
          # of the runner's lifetime after it.
          #   * single-host: scales with the shard's registered est_time
          #     (max(sum(est_time)*1.5, 360s)). run_suite's
          #     --timeout-per-file still bounds each file.
          #   * multi-host: the JobSet caps the run at activeDeadlineSeconds
          #     (3600s bring-up + files x timeout_per_file, the render_jobset.py
          #     formula), and this must OUTLAST it so the JobSet -- not this loop --
          #     decides the outcome.
          if [ '${{ inputs.pd_prefill_hosts }}' != '0' ]; then
            wait_s=9300          # outlast P/D mode's activeDeadlineSeconds=8700 + margin
          elif [ -n "${{ inputs.launch_script }}" ]; then
            nf=$(wc -w <<< "${{ inputs.files }}")
            wait_s=$(( 3600 + nf * ${{ inputs.timeout_per_file }} + 600 ))  # deadline + margin
          elif [ -n "${{ inputs.exec_cmd }}" ]; then
            wait_s=7800          # outlast exec mode's activeDeadlineSeconds=7200 + margin
          else
            # +600 for the same reason as the other two modes: the JobSet's deadline is
            # the same est_time figure, and the poll must outlast it so the JobSet reports
            # the outcome rather than this loop racing it to a generic timeout.
            wait_s=$(( $(python3 .github/tpu-ci/render_jobset.py \
              --suite "$suite" \
              --test-file '${{ inputs.test_file }}' \
              --tpu-chip-workers '${{ inputs.tpu_chip_workers }}' \
              --partition-id '${{ inputs.partition_id }}' \
              --partition-size '${{ inputs.partition_size }}' \
              ${{ inputs.nightly && '--nightly' || '' }} \
              --print-wait-seconds) + 600 ))
          fi

          # One slice runs one job at a time, so the wait is however long everything queued
          # ahead finishes in -- there is no useful smaller number. Spend the whole runner
          # budget on it: ceiling minus this job's own runtime, the bind/pull window and
          # setup. A fixed 1h was the reason four of five multi-host jobs failed in run
          # 31834592348 while the slice was busy.
          # The kubeconfig holds a one-hour access token minted at job start,
          # and the org policy does not allow longer ones. A job that queues
          # behind other PRs on the slice outlives it, so re-mint the token
          # from a fresh GitHub OIDC token (the same exchange the auth action
          # does) and swap it into the kubeconfig before it can expire.
          refresh_cluster_token() {
            local oidc sts sa_token user
            oidc="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${WIF_PROVIDER}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || return 1
            sts="$(curl -sSf -X POST https://sts.googleapis.com/v1/token \
              -H 'Content-Type: application/json' \
              -d "{\"audience\":\"//iam.googleapis.com/${WIF_PROVIDER}\",
                   \"grantType\":\"urn:ietf:params:oauth:grant-type:token-exchange\",
                   \"requestedTokenType\":\"urn:ietf:params:oauth:token-type:access_token\",
                   \"scope\":\"https://www.googleapis.com/auth/cloud-platform\",
                   \"subjectTokenType\":\"urn:ietf:params:oauth:token-type:jwt\",
                   \"subjectToken\":\"${oidc}\"}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')" || return 1
            # userinfo.email is required: without it GKE sees a numeric id and RBAC denies.
            sa_token="$(curl -sSf -X POST \
              "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${CI_SA}:generateAccessToken" \
              -H "Authorization: Bearer ${sts}" -H 'Content-Type: application/json' \
              -d '{"scope":["https://www.googleapis.com/auth/cloud-platform","https://www.googleapis.com/auth/userinfo.email"],"lifetime":"3600s"}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')" || return 1
            # Every context: an external-slots job holds the in-project and external clusters.
            for user in $(kubectl config view -o jsonpath='{.users[*].name}'); do
              kubectl config set-credentials "$user" --token "$sa_token" >/dev/null
            done
            echo "refreshed cluster credentials at $(date -u +%FT%TZ)"
          }


          # A target holds its slot once Kueue releases pods (in-project) or the default
          # scheduler binds the pod (external, no Kueue).
          started() {
            local t="$1" out
            local sel="jobset.sigs.k8s.io/jobset-name=${T_NAME[$t]##*/}"
            if [ -n "${T_KUEUE[$t]}" ]; then
              out="$(kt "$t" get pods -l "$sel" -o name 2>&1)" || return 2
            else
              out="$(kt "$t" get pods -l "$sel" -o jsonpath='{.items[*].spec.nodeName}' 2>&1)" || return 2
            fi
            [ -n "$out" ]
          }
          withdraw() {  # t reason
            echo "withdrawing ${T_NAME[$1]} from $1: $2"
            kt "$1" delete "${T_NAME[$1]}" --ignore-not-found --wait=false || true
            unset "T_NAME[$1]"
          }

          admit_s=$(( JOB_CEILING_S - wait_s - 900 - 600 ))
          echo "budgets for ${label}: admission ${admit_s}s, runtime ${wait_s}s"
          echo "racing for a slot on: ${targets[*]}"
          kt slice get workloads 2>/dev/null | tail -n +2 | wc -l | xargs echo "  in-project workloads queued:"
          admit_deadline=$(( $(date +%s) + admit_s ))
          next_refresh=$(( $(date +%s) + 2400 ))
          next_gate=$(( $(date +%s) + 30 ))
          auth_fails=0
          winner=""
          while true; do
            # A dead kubectl looks identical to "no pods yet" with errors
            # suppressed, so track it explicitly and recover the credentials
            # instead of reporting NOT ADMITTED with an expired kubeconfig.
            for t in "${targets[@]}"; do
              [ -n "${T_NAME[$t]:-}" ] || continue
              rc=0; started "$t" || rc=$?
              if [ "$rc" = 0 ]; then winner="$t"; break; fi
              if [ "$rc" = 2 ]; then
                if ! out="$(kt "$t" get "${T_NAME[$t]}" 2>&1)" && grep -q NotFound <<<"$out"; then
                  # The external nightly's drain deletes PR pods that never started.
                  echo "${T_NAME[$t]} on ${t} was deleted externally; dropping ${t}"
                  unset "T_NAME[$t]"
                else
                  auth_fails=$((auth_fails + 1))
                fi
              fi
            done
            [ -n "$winner" ] && break
            if [ "$auth_fails" -ge 3 ]; then
              refresh_cluster_token || echo "credential refresh failed; will retry"
              auth_fails=0
            fi
            if [ -n "${T_NAME[external]:-}" ] && [ "$(date +%s)" -ge "$next_gate" ]; then
              external_nightly_live && withdraw external "external nightly went live"
              next_gate=$(( $(date +%s) + 30 ))
            fi
            if [ "${#T_NAME[@]}" = 0 ]; then
              echo "❌ ${label}: every target was withdrawn or deleted before starting"; exit 1
            fi
            if [ "$(date +%s)" -ge "$next_refresh" ]; then
              if refresh_cluster_token; then
                next_refresh=$(( $(date +%s) + 2400 ))
              else
                # The current token dies at the hour mark; retry well before
                # then rather than running blind for another 40 minutes.
                echo "credential refresh failed; retrying in 45s"
                next_refresh=$(( $(date +%s) + 45 ))
              fi
            fi
            if [ "$(date +%s)" -ge "$admit_deadline" ]; then
              echo "❌ ${label} NOT ADMITTED after ${admit_s}s -- no slot freed on ${!T_NAME[*]}"
              for t in "${!T_NAME[@]}"; do
                [ -n "${T_KUEUE[$t]}" ] && { kt "$t" get workloads 2>/dev/null | grep -- "${T_NAME[$t]##*/}" || true; }
                kt "$t" describe "${T_NAME[$t]}" 2>/dev/null | tail -n 40 || true
              done
              exit 1
            fi
            sleep 10
          done
          for t in "${!T_NAME[@]}"; do
            [ "$t" = "$winner" ] || withdraw "$t" "${winner} started first"
          done
          echo "${label} runs on ${winner}"
          name="${T_NAME[$winner]}"
          case "$winner" in
            external)   where="EXTERNAL cluster: one host of a partner tpu7x slice" ;;
            host-of-2h) where="INTERNAL cluster: one host of the ${{ inputs.lane }} 2x2x2 slice" ;;
            *)          topo="$(grep -om1 'gke-tpu-topology: .*' "${T_FILE[$winner]}" | awk '{print $2}' | tr -d '"')"
                        where="INTERNAL cluster: ${{ inputs.lane }} ${topo} slice" ;;
          esac
          echo "where=${where}" >> "$GITHUB_OUTPUT"
          echo "::notice title=TPU target::${label} -> ${where}"
          {
            echo "### TPU target"
            echo
            echo "| test | runs on | JobSet |"
            echo "|---|---|---|"
            echo "| ${label} | **${where}** | ${name##*/} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Hand the winner to the next step, named after the target; it owns cleanup from here.
          { declare -p T_CTX T_NS T_KUEUE label winner wait_s name; declare -f refresh_cluster_token; } \
            > "$RUNNER_TEMP/tpu-run-state.sh"
          trap - EXIT

      - name: Run on ${{ steps.acquire.outputs.where }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/tpu-run-state.sh"
          K=(kubectl --context="${T_CTX[$winner]}" -n "${T_NS[$winner]}")
          trap '"${K[@]}" delete "$name" --ignore-not-found --wait=false || true' EXIT
          short="${name##*/}"
          sel="jobset.sigs.k8s.io/jobset-name=${short}"

          # Admitted, but pods still bind and pull -- don't charge the pull to the test.
          running_deadline=$(( $(date +%s) + 900 ))
          until "${K[@]}" get pods -l "$sel" \
                  -o jsonpath='{.items[*].status.phase}' 2>/dev/null | grep -q Running; do
            if [ "$(date +%s)" -ge "$running_deadline" ]; then
              echo "⚠️  ${label}: no pod Running 900s after admission; continuing anyway"
              break
            fi
            sleep 5
          done
          "${K[@]}" get pods -l "$sel" -o wide || true

          # The stream below can outlive the token it starts with; start it fresh.
          refresh_cluster_token || echo "credential refresh failed; continuing with the current token"

          # Stream logs from every host, re-attaching on a drop while the JobSet is
          # live: the pod log is the only egress from a JobSet, results included.
          rm -f "$RUNNER_TEMP/tpu-pod-logs.txt"
          since=""
          while "${K[@]}" get "$name" >/dev/null 2>&1; do
            jok="$("${K[@]}" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || true)"
            jbad="$("${K[@]}" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            { [ "$jok" = "True" ] || [ "$jbad" = "True" ]; } && break
            if [ -n "$since" ]; then
              echo "--- [$(date +%T)] log stream ended while ${label} is still running; re-attaching ---"
              refresh_cluster_token || echo "credential refresh failed; continuing with the current token"
              range=(--since-time="$since")
            else
              range=(--tail=-1)
            fi
            "${K[@]}" logs -f -l "$sel" --all-containers=true --prefix=true \
              --max-log-requests=10 --pod-running-timeout=15m "${range[@]}" \
              2>&1 | tee -a "$RUNNER_TEMP/tpu-pod-logs.txt" || true
            since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 10
          done

          # Runtime clock starts now: queue time is not charged to the test.
          deadline=$(( $(date +%s) + wait_s ))
          auth_fails=0
          # The stream may have run for a long time; poll with a fresh token.
          refresh_cluster_token || echo "credential refresh failed; continuing with the current token"
          next_refresh=$(( $(date +%s) + 2400 ))
          iter=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$(date +%s)" -ge "$next_refresh" ]; then
              if refresh_cluster_token; then
                next_refresh=$(( $(date +%s) + 2400 ))
              else
                echo "credential refresh failed; retrying in 45s"
                next_refresh=$(( $(date +%s) + 45 ))
              fi
            fi
            # Multi-host pods can sit unschedulable for a long time with nothing
            # else printed between the log stream and the verdict; surface where
            # each pod landed once a minute (12 x the 5s poll below).
            if [ $(( iter % 12 )) -eq 0 ]; then
              echo "--- [$(date +%T)] Pod Status for ${label} ---"
              "${K[@]}" get pods -l "$sel" -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,NODE:.spec.nodeName,IP:.status.podIP 2>/dev/null || true
            fi
            iter=$(( iter + 1 ))
            # A dead kubectl looks identical to "no condition yet" with errors
            # suppressed, so track it explicitly instead of polling blind until
            # the budget runs out; try one refresh before giving up.
            if ! out="$("${K[@]}" get "$name" 2>&1)"; then
              if grep -q NotFound <<<"$out"; then
                echo "❌ ${label}: ${name} was deleted mid-run (on ${winner}: the external nightly preempts PR slots it waited too long for)"
                exit 1
              fi
              auth_fails=$((auth_fails + 1))
              [ "$auth_fails" -eq 3 ] && refresh_cluster_token || true
              if [ "$auth_fails" -ge 12 ]; then
                echo "❌ ${label}: lost cluster access while polling (credentials likely expired); JobSet outcome unknown"
                exit 1
              fi
              sleep 5; continue
            fi
            auth_fails=0
            ok="$("${K[@]}" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || true)"
            bad="$("${K[@]}" get "$name" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            [ "$ok" = "True" ]  && { echo "✅ ${label} PASSED"; exit 0; }
            [ "$bad" = "True" ] && {
              echo "❌ ${label} FAILED"
              # Scheduling/admission evidence: pod placement, Kueue workload
              # state, and recent namespace events tell apart "test failed"
              # from "pods never got hardware".
              "${K[@]}" get pods -l "$sel" -o wide || true
              # Late-arriving pods never join the initial `logs -f` stream, so
              # re-collect every pod's tail before the JobSet is deleted.
              "${K[@]}" logs -l "$sel" --all-containers --prefix --tail=150 2>/dev/null || true
              [ -n "${T_KUEUE[$winner]}" ] && { "${K[@]}" get workloads -o wide 2>/dev/null || true; }
              "${K[@]}" get events --sort-by=.lastTimestamp 2>/dev/null | tail -n 40 || true
              "${K[@]}" describe "$name" | tail -n 200
              exit 1
            }
            sleep 5
          done
          echo "❌ ${label} TIMED OUT after ${wait_s}s"
          "${K[@]}" get pods -l "$sel" -o wide || true
          "${K[@]}" describe "$name" | tail -n 120 || true
          exit 1

      # A benchmark test prints its results JSON between markers, because the pod
      # log is the only thing that leaves a JobSet. Lift it into a downloadable
      # artifact + the run summary so a result is findable in the GitHub UI without
      # scrolling a multi-host log. No-op (and non-fatal) for tests that emit
      # nothing, which is every functional test.
      - name: Publish benchmark results
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/tpu-pod-logs.txt"
          out="$RUNNER_TEMP/bench-result.json"
          [ -f "$log" ] || { echo "no pod log captured"; exit 0; }
          # Take the LAST marker block, not a sed range over all of them: a launch
          # group can run several test files against one server (the 30B group
          # already runs two), and a sed range would splice every block into one
          # invalid document -- dropping every result instead of one.
          # The pod log is prefixed per container by --prefix=true; strip that too.
          awk '/TPU_BENCH_RESULT_JSON BEGIN/ {buf=""; inblk=1; next}
               /TPU_BENCH_RESULT_JSON END/   {last=buf; inblk=0; next}
               inblk                          {buf = buf $0 "\n"}
               END                            {printf "%s", last}' "$log" \
            | sed -e 's/^\[[^]]*\] //' | tr -d '\r' > "$out" || true
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$out" 2>/dev/null; then
            echo "no benchmark results in this run's log"
            rm -f "$out"
            exit 0
          fi
          echo "extracted results -> $out ($(wc -c <"$out") bytes)"
          python3 - "$out" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          s = json.load(open(sys.argv[1]))
          run, totals = s.get("run", {}), s.get("totals", {})
          print(f"## {run.get('benchmark', 'TPU benchmark')} — {run.get('mode', '?')}")
          print()
          print(f"- model `{run.get('model')}`  profile `{run.get('profile')}`  "
                f"commit `{(run.get('git', {}).get('commit') or '')[:12]}`")
          print(f"- {totals.get('legs_ok', 0)}/{totals.get('legs_total', 0)} legs ok, "
                f"{totals.get('warnings', 0)} warning(s)")
          print()
          print("| leg | status | out tok/s | prompt tok/s | TTFT p50 ms | ITL p50 ms | prefix hit |")
          print("|---|---|---:|---:|---:|---:|---:|")
          for leg in s.get("legs", []):
              m, d = leg.get("metrics") or {}, leg.get("derived") or {}
              hit = (leg.get("feature_derived") or {}).get("prefix_cache_hit_rate")
              f = lambda v, spec=".1f": format(v, spec) if isinstance(v, (int, float)) else "-"
              print(f"| {leg.get('mode')}/{leg.get('tag')} | {leg.get('status')} "
                    f"| {f(m.get('output_throughput'))} | {f(d.get('prompt_throughput'))} "
                    f"| {f(m.get('median_ttft_ms'), '.0f')} | {f(m.get('median_itl_ms'))} "
                    f"| {(format(hit, '.1%') if isinstance(hit, float) else '-')} |")
          PY

      - name: Upload benchmark results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tpu-bench-result-${{ inputs.run_name || inputs.suite || 'test' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-result.json
          if-no-files-found: ignore
          retention-days: 30
