# Reusable: render the unified JobSet onto the already-built `image` (digest), stream
# its logs, and gate on the JobSet Completed/Failed condition. Two modes:
#   * single-host suite  -> pass `suite` (run_suite runs it; hosts=1)
#   * multi-host group    -> pass `launch_script` + `files` + `hosts` (+ weights_pvc)
name: _tpu-test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      image:
        required: true
        type: string          # repo@sha256:... from _tpu-build
      nightly:
        required: false
        type: boolean
        default: false
      # --- single-host suite mode ---
      suite:
        required: false
        type: string
        default: ""
      # --- multi-host launch-group mode ---
      launch_script:
        required: false
        type: string
        default: ""
      files:
        required: false
        type: string
        default: ""           # space-separated test files rank-0 runs
      hosts:
        required: false
        type: number
        default: 1
      # Which lane's pools to use (topology.yaml). Both lanes own 1- and 2-host slices, so
      # host count alone no longer picks a pool. nightly-test-tpu.yml passes `nightly`.
      lane:
        required: false
        type: string
        default: pr-gate
      weights_pvc:
        required: false
        type: string
        default: ""
      run_name:
        required: false
        type: string
        default: ""
      # --- exec mode: every host runs this command; pod exit codes gate the JobSet ---
      exec_cmd:
        required: false
        type: string
        default: ""
      # --- P/D mode: prefill + decode groups, each on its own slice; needs exec_cmd.
      # Callers should also pass `hosts` = the per-role slice size so the
      # concurrency group serializes with other runs contending for the slices.
      pd_prefill_hosts:
        required: false
        type: number
        default: 0
      pd_decode_hosts:
        required: false
        type: number
        default: 0

permissions:
  contents: read
  id-token: write

concurrency:
  # Keyed per job so it never gates: Kueue owns slice admission now (kueue-tpu.yaml), and
  # the callers' workflow-level groups already stop a workflow stacking on itself.
  group: tpu-test-${{ github.run_id }}-${{ inputs.run_name || inputs.suite }}
  cancel-in-progress: false

env:
  GCP_PROJECT: sglang-torchtpu
  GKE_ZONE: us-central1-c
  GKE_CLUSTER: tpu-cluster
  WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc
  CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's hard cap for hosted runners; cannot be raised
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Render + run on TPU
        run: |
          set -euo pipefail
          label='${{ inputs.run_name || inputs.suite }}'
          JOB_CEILING_S=21600        # 360m, the GitHub cap
          suite='${{ inputs.suite }}'
          python3 -m pip install --quiet --disable-pip-version-check pyyaml >/dev/null 2>&1 || true
          # Resolve pools before rendering, because the pod's nodeAffinity is baked in at
          # render time. Unions topology.yaml's list with any pool labelled
          # ci-tpu-lane=<lane> of this slice shape, and registers a new pool's Kueue flavor,
          # so adding a slice needs no code change. Fails open to topology.yaml.
          pools="$(python3 .github/tpu-ci/discover_pools.py \
                     --lane '${{ inputs.lane }}' --hosts '${{ inputs.hosts }}' --sync)"
          echo "pools for lane=${{ inputs.lane }} hosts=${{ inputs.hosts }}: ${pools}"
          python3 .github/tpu-ci/render_jobset.py \
            --image '${{ inputs.image }}' \
            --suite '${{ inputs.suite }}' \
            --launch-script '${{ inputs.launch_script }}' \
            --files '${{ inputs.files }}' \
            --exec '${{ inputs.exec_cmd }}' \
            --hosts '${{ inputs.hosts }}' \
            --lane '${{ inputs.lane }}' \
            --pools "${pools}" \
            --pd-prefill-hosts '${{ inputs.pd_prefill_hosts }}' \
            --pd-decode-hosts '${{ inputs.pd_decode_hosts }}' \
            --weights-pvc '${{ inputs.weights_pvc }}' \
            --name '${{ inputs.run_name }}' \
            ${{ inputs.nightly && '--nightly' || '' }} > /tmp/job.yaml
          echo "== rendered (key fields) =="
          grep -nE 'completions:|gke-tpu-topology:|ci-tpu-pool:|claimName:|bash "benchmark|for f in|run_suite.py' /tmp/job.yaml | head
          # Quota tracks live capacity, checked here rather than on a timer: it only has to
          # be right at the moment admission is decided. Fails open -- a stale quota is
          # survivable (waitForPodsReady evicts and requeues), a blocked test is not.
          # A (lane, hosts) can own several interchangeable slices, so reconcile each of its
          # pools: --pool drives the one-slice-per-pool guard, and a resized multi-host pool
          # must fail the job that would have straddled it.
          for p in $(grep -o '^# ci-tpu-pools: .*' /tmp/job.yaml | cut -d' ' -f3-); do
            python3 .github/tpu-ci/reconcile_quota.py --pool="$p"
          done

          name="$(kubectl -n tpu-ci create -f /tmp/job.yaml -o name)"
          echo "Created ${name}"
          trap 'kubectl -n tpu-ci delete '"${name}"' --ignore-not-found --wait=false' EXIT

          short="${name##*/}"
          sel="jobset.sigs.k8s.io/jobset-name=${short}"

          # No Workload means Kueue ignored this JobSet and it would run with no gang
          # admission -- silent, and on a multi-host slice it ends as two half-placed gangs
          # deadlocked until their deadline. Fail closed instead.
          uid="$(kubectl -n tpu-ci get "$name" -o jsonpath='{.metadata.uid}')"
          wl_sel="kueue.x-k8s.io/job-uid=${uid}"
          for _ in $(seq 1 15); do
            [ -n "$(kubectl -n tpu-ci get workloads -l "$wl_sel" -o name 2>/dev/null)" ] && break
            sleep 2
          done
          if [ -z "$(kubectl -n tpu-ci get workloads -l "$wl_sel" -o name 2>/dev/null)" ]; then
            echo "❌ ${label}: no Kueue Workload for ${short} -- admission control is OFF."
            echo "   Check: queue-name label on the JobSet, jobset in integrations.frameworks,"
            echo "   and that LocalQueue $(grep -o 'queue-name: .*' /tmp/job.yaml | awk '{print $2}') exists in tpu-ci."
            kubectl -n tpu-ci get localqueues 2>/dev/null || true
            exit 1
          fi
          echo "Kueue Workload present; admission control active."

          # Runtime budget, computed here because the admission budget is whatever is left
          # of the runner's lifetime after it.
          #   * single-host: scales with the suite's registered est_time (static AST scan in
          #     render_jobset.py -> max(sum(est_time)*1.5, 360s)). run_suite's
          #     --timeout-per-file still bounds each file.
          #   * multi-host: the JobSet caps the run at activeDeadlineSeconds (9000s for
          #     launch mode: ~30m bring-up + 2 files x `timeout 3600`, gsm8k on R1 needs
          #     the full hour), and this must OUTLAST it so the JobSet -- not this loop --
          #     decides the outcome.
          if [ '${{ inputs.pd_prefill_hosts }}' != '0' ]; then
            wait_s=11400         # outlast P/D mode's activeDeadlineSeconds=10800 + margin
          elif [ -n "${{ inputs.launch_script }}" ]; then
            wait_s=9600          # activeDeadlineSeconds 9000 + streaming/scheduling margin
          elif [ -n "${{ inputs.exec_cmd }}" ]; then
            wait_s=7800          # outlast exec mode's activeDeadlineSeconds=7200 + margin
          else
            # +600 for the same reason as the other two modes: the JobSet's deadline is
            # the same est_time figure, and the poll must outlast it so the JobSet reports
            # the outcome rather than this loop racing it to a generic timeout.
            wait_s=$(( $(python3 .github/tpu-ci/render_jobset.py --suite "$suite" --print-wait-seconds) + 600 ))
          fi

          # One slice runs one job at a time, so the wait is however long everything queued
          # ahead finishes in -- there is no useful smaller number. Spend the whole runner
          # budget on it: ceiling minus this job's own runtime, the bind/pull window and
          # setup. A fixed 1h was the reason four of five multi-host jobs failed in run
          # 31834592348 while the slice was busy.
          admit_s=$(( JOB_CEILING_S - wait_s - 900 - 600 ))
          echo "budgets for ${label}: admission ${admit_s}s, runtime ${wait_s}s"
          echo "queued in this ClusterQueue right now:"
          kubectl -n tpu-ci get workloads 2>/dev/null | tail -n +2 | wc -l | xargs echo "  workloads:"
          admit_deadline=$(( $(date +%s) + admit_s ))
          until [ -n "$(kubectl -n tpu-ci get pods -l "$sel" -o name 2>/dev/null)" ]; do
            if [ "$(date +%s)" -ge "$admit_deadline" ]; then
              echo "❌ ${label} NOT ADMITTED after ${admit_s}s -- slice quota never freed"
              kubectl -n tpu-ci get workloads 2>/dev/null | grep -- "${short}" || true
              kubectl -n tpu-ci describe "$name" 2>/dev/null | tail -n 40 || true
              exit 1
            fi
            sleep 10
          done

          # Admitted, but pods still bind and pull -- don't charge the pull to the test.
          running_deadline=$(( $(date +%s) + 900 ))
          until kubectl -n tpu-ci get pods -l "$sel" \
                  -o jsonpath='{.items[*].status.phase}' 2>/dev/null | grep -q Running; do
            if [ "$(date +%s)" -ge "$running_deadline" ]; then
              echo "⚠️  ${label}: no pod Running 900s after admission; continuing anyway"
              break
            fi
            sleep 5
          done
          kubectl -n tpu-ci get pods -l "$sel" -o wide || true

          # Stream logs from every host (best effort; may restart while pods come up).
          # Tee'd because the pod log is the ONLY egress from a JobSet: a benchmark
          # test emits its results JSON into it, and the next step lifts that out.
          kubectl -n tpu-ci logs -f -l "$sel" --all-containers=true --prefix=true \
            --max-log-requests=10 --pod-running-timeout=15m --tail=-1 \
            2>&1 | tee "$RUNNER_TEMP/tpu-pod-logs.txt" || true

          # Runtime clock starts now: queue time is not charged to the test.
          deadline=$(( $(date +%s) + wait_s ))
          auth_fails=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # The workload-identity credentials can expire before very long
            # runs end; a dead kubectl looks identical to "no condition yet"
            # with errors suppressed, so track it explicitly instead of
            # polling blind until the budget runs out.
            if ! kubectl -n tpu-ci get "$name" >/dev/null 2>&1; then
              auth_fails=$((auth_fails + 1))
              if [ "$auth_fails" -ge 12 ]; then
                echo "❌ ${label}: lost cluster access while polling (credentials likely expired); JobSet outcome unknown"
                exit 1
              fi
              sleep 5; continue
            fi
            auth_fails=0
            ok="$(kubectl -n tpu-ci get "$name" -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || true)"
            bad="$(kubectl -n tpu-ci get "$name" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            [ "$ok" = "True" ]  && { echo "✅ ${label} PASSED"; exit 0; }
            [ "$bad" = "True" ] && {
              echo "❌ ${label} FAILED"
              # Scheduling/admission evidence: pod placement, Kueue workload
              # state, and recent namespace events tell apart "test failed"
              # from "pods never got hardware".
              kubectl -n tpu-ci get pods -l "$sel" -o wide || true
              # Late-arriving pods never join the initial `logs -f` stream, so
              # re-collect every pod's tail before the JobSet is deleted.
              kubectl -n tpu-ci logs -l "$sel" --all-containers --prefix --tail=150 2>/dev/null || true
              kubectl -n tpu-ci get workloads -o wide 2>/dev/null || true
              kubectl -n tpu-ci get events --sort-by=.lastTimestamp 2>/dev/null | tail -n 40 || true
              kubectl -n tpu-ci describe "$name" | tail -n 200
              exit 1
            }
            sleep 5
          done
          echo "❌ ${label} TIMED OUT after ${wait_s}s"
          kubectl -n tpu-ci get pods -l "$sel" -o wide || true
          kubectl -n tpu-ci describe "$name" | tail -n 120 || true
          exit 1

      # A benchmark test prints its results JSON between markers, because the pod
      # log is the only thing that leaves a JobSet. Lift it into a downloadable
      # artifact + the run summary so a result is findable in the GitHub UI without
      # scrolling a multi-host log. No-op (and non-fatal) for tests that emit
      # nothing, which is every functional test.
      - name: Publish benchmark results
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/tpu-pod-logs.txt"
          out="$RUNNER_TEMP/bench-result.json"
          [ -f "$log" ] || { echo "no pod log captured"; exit 0; }
          # Take the LAST marker block, not a sed range over all of them: a launch
          # group can run several test files against one server (the 30B group
          # already runs two), and a sed range would splice every block into one
          # invalid document -- dropping every result instead of one.
          # The pod log is prefixed per container by --prefix=true; strip that too.
          awk '/TPU_BENCH_RESULT_JSON BEGIN/ {buf=""; inblk=1; next}
               /TPU_BENCH_RESULT_JSON END/   {last=buf; inblk=0; next}
               inblk                          {buf = buf $0 "\n"}
               END                            {printf "%s", last}' "$log" \
            | sed -e 's/^\[[^]]*\] //' | tr -d '\r' > "$out" || true
          if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$out" 2>/dev/null; then
            echo "no benchmark results in this run's log"
            rm -f "$out"
            exit 0
          fi
          echo "extracted results -> $out ($(wc -c <"$out") bytes)"
          python3 - "$out" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          s = json.load(open(sys.argv[1]))
          run, totals = s.get("run", {}), s.get("totals", {})
          print(f"## {run.get('benchmark', 'TPU benchmark')} — {run.get('mode', '?')}")
          print()
          print(f"- model `{run.get('model')}`  profile `{run.get('profile')}`  "
                f"commit `{(run.get('git', {}).get('commit') or '')[:12]}`")
          print(f"- {totals.get('legs_ok', 0)}/{totals.get('legs_total', 0)} legs ok, "
                f"{totals.get('warnings', 0)} warning(s)")
          print()
          print("| leg | status | out tok/s | prompt tok/s | TTFT p50 ms | ITL p50 ms | prefix hit |")
          print("|---|---|---:|---:|---:|---:|---:|")
          for leg in s.get("legs", []):
              m, d = leg.get("metrics") or {}, leg.get("derived") or {}
              hit = (leg.get("feature_derived") or {}).get("prefix_cache_hit_rate")
              f = lambda v, spec=".1f": format(v, spec) if isinstance(v, (int, float)) else "-"
              print(f"| {leg.get('mode')}/{leg.get('tag')} | {leg.get('status')} "
                    f"| {f(m.get('output_throughput'))} | {f(d.get('prompt_throughput'))} "
                    f"| {f(m.get('median_ttft_ms'), '.0f')} | {f(m.get('median_itl_ms'))} "
                    f"| {(format(hit, '.1%') if isinstance(hit, float) else '-')} |")
          PY

      - name: Upload benchmark results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tpu-bench-result-${{ inputs.run_name || inputs.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/bench-result.json
          if-no-files-found: ignore
          retention-days: 30
