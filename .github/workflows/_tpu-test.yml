# Reusable: render the unified JobSet onto the already-built `image` (digest), stream
# its logs, and gate on the JobSet Completed/Failed condition. Two modes:
#   * single-host suite  -> pass `suite` (run_suite runs it; hosts=1)
#   * multi-host group    -> pass `launch_script` + `files` + `hosts` (+ weights_pvc)
name: _tpu-test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      image:
        required: true
        type: string          # repo@sha256:... from _tpu-build
      nightly:
        required: false
        type: boolean
        default: false
      # --- single-host suite mode ---
      suite:
        required: false
        type: string
        default: ""
      # --- multi-host launch-group mode ---
      launch_script:
        required: false
        type: string
        default: ""
      files:
        required: false
        type: string
        default: ""           # space-separated test files rank-0 runs
      hosts:
        required: false
        type: number
        default: 1
      weights_pvc:
        required: false
        type: string
        default: ""
      run_name:
        required: false
        type: string
        default: ""
      # --- exec mode: every host runs this command; pod exit codes gate the JobSet ---
      exec_cmd:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  # Runs sharing a slice must serialize (no gang scheduler -> two multi-host JobSets on
  # one pool could deadlock). Key on host count == the slice: all multi-host runs
  # (hosts=2) serialize on the 2x2x2 pool; single-host (hosts=1) runs on pr-gate.
  group: tpu-slice-${{ inputs.hosts }}
  cancel-in-progress: false

env:
  GCP_PROJECT: sglang-torchtpu
  GKE_ZONE: us-central1-c
  GKE_CLUSTER: tpu-cluster
  WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc
  CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Render + run on TPU
        run: |
          set -euo pipefail
          label='${{ inputs.run_name || inputs.suite }}'
          suite='${{ inputs.suite }}'
          python3 -m pip install --quiet --disable-pip-version-check pyyaml >/dev/null 2>&1 || true
          python3 .github/tpu-ci/render_jobset.py \
            --image '${{ inputs.image }}' \
            --suite '${{ inputs.suite }}' \
            --launch-script '${{ inputs.launch_script }}' \
            --files '${{ inputs.files }}' \
            --exec '${{ inputs.exec_cmd }}' \
            --hosts '${{ inputs.hosts }}' \
            --weights-pvc '${{ inputs.weights_pvc }}' \
            --name '${{ inputs.run_name }}' \
            ${{ inputs.nightly && '--nightly' || '' }} > /tmp/job.yaml
          echo "== rendered (key fields) =="
          grep -nE 'completions:|gke-tpu-topology:|ci-tpu-pool:|claimName:|bash "benchmark|for f in|run_suite.py' /tmp/job.yaml | head
          name="$(kubectl -n tpu-ci create -f /tmp/job.yaml -o name)"
          echo "Created ${name}"
          trap 'kubectl -n tpu-ci delete '"${name}"' --ignore-not-found --wait=false' EXIT

          short="${name##*/}"
          sel="jobset.sigs.k8s.io/jobset-name=${short}"
          for _ in $(seq 1 120); do
            [ -n "$(kubectl -n tpu-ci get pods -l "$sel" -o name 2>/dev/null)" ] && break || sleep 5
          done

          # Stream logs from every host (best effort; may restart while pods come up).
          kubectl -n tpu-ci logs -f -l "$sel" --all-containers=true --prefix=true \
            --max-log-requests=10 --pod-running-timeout=15m --tail=-1 || true

          # Poll budget = how long we watch the JobSet before declaring a timeout.
          #   * single-host: scales with the suite's registered est_time (static AST scan
          #     in render_jobset.py -> max(sum(est_time)*1.5, 360s)) so long suites don't
          #     hit a fixed ceiling. run_suite's --timeout-per-file still bounds each file.
          #   * multi-host: the JobSet itself caps the run at activeDeadlineSeconds=5400s
          #     (~20m server bring-up + up to 2 files x `timeout 1800`). The poll must
          #     OUTLAST that so the JobSet -- not this loop -- decides the outcome, hence
          #     6000s = 5400 + streaming/scheduling margin.
          if [ -n "${{ inputs.launch_script }}" ]; then
            wait_s=6000
          elif [ -n "${{ inputs.exec_cmd }}" ]; then
            wait_s=7800   # outlast exec mode's activeDeadlineSeconds=7200 + margin
          else
            wait_s="$(python3 .github/tpu-ci/render_jobset.py --suite "$suite" --print-wait-seconds)"
          fi
          echo "CI poll budget for ${label}: ${wait_s}s"
          deadline=$(( $(date +%s) + wait_s ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            ok="$(kubectl -n tpu-ci get "$name" -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || true)"
            bad="$(kubectl -n tpu-ci get "$name" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            [ "$ok" = "True" ]  && { echo "✅ ${label} PASSED"; exit 0; }
            [ "$bad" = "True" ] && { echo "❌ ${label} FAILED"; kubectl -n tpu-ci describe "$name" | tail -n 80; exit 1; }
            sleep 5
          done
          echo "❌ ${label} TIMED OUT after ${wait_s}s"; exit 1
