# Reusable: render the single-host JobSet for `suite` onto the already-built `image`
# (digest), stream its logs, and gate on the JobSet Completed/Failed condition.
name: _tpu-test

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      image:
        required: true
        type: string          # repo@sha256:... from _tpu-build
      suite:
        required: true
        type: string
      nightly:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Runs of the same suite share a slice -> serialize them; different suites run free.
  group: tpu-test-${{ inputs.suite }}
  cancel-in-progress: false

env:
  GCP_PROJECT: sglang-torchtpu
  GKE_ZONE: us-central1-c
  GKE_CLUSTER: tpu-cluster
  WIF_PROVIDER: projects/180183988733/locations/global/workloadIdentityPools/github/providers/github-oidc
  CI_SA: tpu-ci@sglang-torchtpu.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Render + run suite on TPU
        run: |
          set -euo pipefail
          suite='${{ inputs.suite }}'
          python3 -m pip install --quiet --disable-pip-version-check pyyaml >/dev/null 2>&1 || true
          python3 .github/tpu-ci/render_jobset.py \
            --image '${{ inputs.image }}' \
            --suite '${{ inputs.suite }}' \
            ${{ inputs.nightly && '--nightly' || '' }} > /tmp/job.yaml
          echo "== rendered (key fields) =="
          grep -nE 'completions:|gke-tpu-topology:|ci-tpu-pool:|run_suite.py' /tmp/job.yaml | head
          name="$(kubectl -n tpu-ci create -f /tmp/job.yaml -o name)"
          echo "Created ${name}"
          trap 'kubectl -n tpu-ci delete '"${name}"' --ignore-not-found --wait=false' EXIT

          short="${name##*/}"
          sel="jobset.sigs.k8s.io/jobset-name=${short}"
          for _ in $(seq 1 120); do
            [ -n "$(kubectl -n tpu-ci get pods -l "$sel" -o name 2>/dev/null)" ] && break || sleep 5
          done

          # Stream logs (best effort; may restart while pods come up).
          kubectl -n tpu-ci logs -f -l "$sel" --all-containers=true --prefix=true \
            --max-log-requests=10 --pod-running-timeout=15m --tail=-1 || true

          # Poll budget scales with the suite's registered est_time (static AST scan in
          # render_jobset.py -> max(sum(est_time)*1.5, 360s)), so long suites don't hit
          # a fixed ceiling. run_suite's own --timeout-per-file still bounds each file.
          wait_s="$(python3 .github/tpu-ci/render_jobset.py --suite "$suite" --print-wait-seconds)"
          echo "CI poll budget for ${suite}: ${wait_s}s"
          deadline=$(( $(date +%s) + wait_s ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            ok="$(kubectl -n tpu-ci get "$name" -o jsonpath='{.status.conditions[?(@.type=="Completed")].status}' 2>/dev/null || true)"
            bad="$(kubectl -n tpu-ci get "$name" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            [ "$ok" = "True" ]  && { echo "✅ ${suite} PASSED"; exit 0; }
            [ "$bad" = "True" ] && { echo "❌ ${suite} FAILED"; kubectl -n tpu-ci describe "$name" | tail -n 80; exit 1; }
            sleep 5
          done
          echo "❌ ${suite} TIMED OUT after ${wait_s}s"; exit 1
