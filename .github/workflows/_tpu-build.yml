# Reusable: build the TPU base image (if changed) and final SGLang TPU image
# (Cloud Build as tpu-ci, keyless WIF) from `ref`, push to Artifact Registry,
# and output the immutable digest for the test jobs.
name: _tpu-build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      # Release version baked into the image's sglang / sglang-tpu metadata.
      # Empty for CI builds, which keep setuptools-scm's 0.0.0.dev0 fallback
      # (the build context has no .git to read a version from).
      version:
        required: false
        type: string
        default: ""
    outputs:
      digest:
        description: "Digest-pinned image reference (repo@sha256:...)"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: ${{ vars.TPU_GCP_PROJECT }}
  AR_BASE_IMAGE: ${{ vars.TPU_AR_BASE_IMAGE }}
  AR_IMAGE: ${{ vars.TPU_AR_IMAGE }}
  WIF_PROVIDER: ${{ vars.TPU_WIF_PROVIDER }}
  CI_SA: ${{ vars.TPU_CI_SA }}
  BUILD_BUCKET: ${{ vars.TPU_BUILD_BUCKET }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # This job holds cloud credentials, so never build or run a pull request
      # ref here. Fork PR code must not reach the CI service account.
      - name: Reject pull request refs
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            refs/pull/*|pull/*)
              echo "::error::Refusing to run with cloud credentials on pull request ref $REF"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Validate deployment configuration
        shell: bash
        run: |
          : "${WIF_PROVIDER:?Missing required TPU CI repository variable; see .github/tpu-ci/README.md}"
          : "${CI_SA:?Missing required TPU CI repository variable; see .github/tpu-ci/README.md}"
          : "${GCP_PROJECT:?Missing required TPU CI repository variable; see .github/tpu-ci/README.md}"
          : "${AR_IMAGE:?Missing required TPU CI repository variable; see .github/tpu-ci/README.md}"
          : "${AR_BASE_IMAGE:?Missing required TPU CI repository variable; see .github/tpu-ci/README.md}"
          : "${BUILD_BUCKET:?Missing required TPU CI repository variable; see .github/tpu-ci/README.md}"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
          # Mint a plain tpu-ci access token; used via --access-token-file below.
          token_format: 'access_token'
          create_credentials_file: false
      - uses: google-github-actions/setup-gcloud@v2
      - id: build
        env:
          CI_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          # Tag the image with the ref we actually checked out and built (inputs.ref),
          # not the workflow's github.sha (the caller's commit, which can differ).
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          # Both actors, passed via env rather than inline interpolation so neither
          # can be shell-interpreted. They differ on a re-run: triggering_actor is
          # whoever pressed re-run, actor stays the original initiator (and is the
          # identity whose privileges -- and OIDC claims -- the re-run uses).
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
          ORIGIN_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          tokfile="${RUNNER_TEMP}/tpu-ci.token"
          printf '%s' "$CI_ACCESS_TOKEN" > "$tokfile"
          trap 'rm -f "$tokfile"' EXIT

          # 1. Compute deterministic hash for base image dependencies
          base_hash=$(sha256sum python/pyproject_tpu.toml docker/tpu-base.Dockerfile scripts/ci/tpu/warm_mmlu_cache.py | sha256sum | head -c 16)
          base_tag="base-${base_hash}"
          echo "Base image tag: ${base_tag}"

          # 2. Check if the base image already exists in Artifact Registry
          bucket="${BUILD_BUCKET:?Set repository variable TPU_BUILD_BUCKET}"
          src="${RUNNER_TEMP}/source.tgz"
          tar --exclude=./.git -czf "$src" -C "$GITHUB_WORKSPACE" .

          # Image describe also queries Container Analysis, which requires unrelated
          # permissions. Query tags only, and let lookup errors fail the build rather
          # than silently turning authentication/service failures into cache misses.
          cached_tag=$(gcloud artifacts docker tags list "$AR_BASE_IMAGE" \
            --filter="tag~'/tags/${base_tag}$'" --format='value(tag)' \
            --project "$GCP_PROJECT" --access-token-file="$tokfile")
          if [ -n "$cached_tag" ]; then
            echo "Base image ${AR_BASE_IMAGE}:${base_tag} already exists; reusing."
          else
            echo "Base image ${AR_BASE_IMAGE}:${base_tag} not found; building base image on Cloud Build."
            base_object="source/base-${base_tag}-${{ github.run_id }}.tgz"
            gcloud storage cp "$src" "gs://${bucket}/${base_object}" --project "$GCP_PROJECT" \
              --access-token-file="$tokfile"
            # run_cloudbuild.py streams the Cloud Build log into this step's
            # output (the only build log external collaborators can read) and
            # retries once on intermittent build failures.
            python3 .github/tpu-ci/run_cloudbuild.py \
              --project "$GCP_PROJECT" --config docker/cloudbuild.tpu-base.yaml \
              --bucket "$bucket" --object "$base_object" --tag "$base_tag" --token-file "$tokfile" \
              --service-account "$CI_SA" --logs-bucket "gs://${bucket}/logs" \
              --substitutions "_IMAGE=${AR_BASE_IMAGE}" \
              --max-attempts 2
          fi

          # 3. Build the final SGLang image on top of the base image
          safe_ref="$(printf '%s' "$INPUT_REF" | tr -c 'A-Za-z0-9_.-' '-')"
          safe_trigger="$(printf '%s' "$TRIGGER_ACTOR" | tr -c 'A-Za-z0-9_.-' '-')"
          safe_origin="$(printf '%s' "$ORIGIN_ACTOR" | tr -c 'A-Za-z0-9_.-' '-')"
          who="${safe_trigger:0:20}"
          if [ "$safe_trigger" != "$safe_origin" ]; then
            who="${safe_trigger:0:20}-rr-${safe_origin:0:20}"
          fi
          tag="$(date -u +%Y%m%d)-${who}-${safe_ref:0:12}-${{ github.run_id }}.${{ github.run_attempt }}"
          object="source/${tag}.tgz"

          gcloud storage cp "$src" "gs://${bucket}/${object}" --project "$GCP_PROJECT" \
            --access-token-file="$tokfile"
          digest="$(python3 .github/tpu-ci/run_cloudbuild.py \
            --project "$GCP_PROJECT" --config docker/cloudbuild.tpu.yaml \
            --bucket "$bucket" --object "$object" --tag "$tag" --token-file "$tokfile" \
            --service-account "$CI_SA" --logs-bucket "gs://${bucket}/logs" \
            --substitutions "_IMAGE=${AR_IMAGE}" "_BASE_IMAGE=${AR_BASE_IMAGE}:${base_tag}" "_VERSION=${INPUT_VERSION}" \
            --max-attempts 2)"
          echo "digest=${AR_IMAGE}@${digest}" >> "$GITHUB_OUTPUT"
          echo "built ${AR_IMAGE}@${digest}"
