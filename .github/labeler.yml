      - 'python/sglang/multimodal_gen/runtime/layers/attention/layer.py'
      - 'python/sglang/multimodal_gen/runtime/models/dits/zimage.py'
      - 'python/sglang/multimodal_gen/test/unit/test_usp_*.py'
      - 'python/sglang/multimodal_gen/test/unit/test_wan_sp_padding.py'
      # LTX-2 two-stage placement on platforms whose subgroup collectives need every rank.
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/ltx_2/denoising_av.py'
