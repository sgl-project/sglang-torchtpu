# Configuration for the GitHub Labeler action
# Automatically adds labels to PRs based on the files changed

# Kernel specific
sgl-kernel:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/kernels/aot/**/*'

# JIT kernel specific
jit-kernel:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/kernels/!(*.md)'
      - 'python/sglang/kernels/!(aot)/**/*'

# Documentation
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**/*'
      - 'README*'
      - 'docs/**/*'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - '**/requirements*.txt'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pyproject*.toml'
      - '**/setup.py'
      - '**/poetry.lock'
      - '**/package.json'
      - '**/package-lock.json'

# Multi-modal
Multi-modal:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*multimodal*'
      - '**/*vision*'
      - '**/*vlm*'

# Diffusion
diffusion:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/multimodal_gen/**/*'

# LoRA
lora:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*lora*'

# Quantization
quant:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*quant*'
      - '**/*quantization*'

# Speculative decoding
speculative-decoding:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*speculative*'

# AMD specific
amd:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*amd*'
      - '**/*rocm*'

# NPU specific
npu:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*npu*'
      - '**/*ascend*'

# TPU specific -- auto-label ONLY for the TPU backend + explicit TPU files.
# Deliberately NOT a broad '**/*tpu*' glob: shared code (python/sglang/srt/**,
# scheduler/model_runner/etc.) is left to MANUAL labeling. Keep this list in sync
# with the `tpu` path filter in .github/workflows/pr-test-tpu.yml.
tpu:
  - changed-files:
    - any-glob-to-any-file:
      - 'sglang_tpu/**'
      - 'python/sglang/srt/hardware_backend/tpu/**'
      - 'python/sglang/srt/layers/attention/pallas/**'
      - 'python/sglang/srt/layers/moe/pallas/**'
      - 'python/sglang/srt/disaggregation/tpu/**'
      - 'python/sglang/test/tpu/**'
      - 'python/sglang/multimodal_gen/runtime/platforms/tpu.py'
      - 'python/sglang/multimodal_gen/runtime/platforms/__init__.py'
      # Shared diffusion files whose TPU paths (platform hooks, RoPE, compile
      # guards) are tested only in the TPU unit lane, and the core tests the TPU
      # wrappers import.
      - 'python/sglang/multimodal_gen/configs/models/base.py'
      - 'python/sglang/multimodal_gen/configs/models/vaes/base.py'
      - 'python/sglang/multimodal_gen/configs/sample/sampling_params.py'
      - 'python/sglang/multimodal_gen/runtime/distributed/utils.py'
      - 'python/sglang/multimodal_gen/runtime/layers/attention/backends/attention_backend.py'
      - 'python/sglang/multimodal_gen/runtime/layers/attention/selector.py'
      - 'python/sglang/multimodal_gen/runtime/layers/parallel_conv.py'
      - 'python/sglang/multimodal_gen/runtime/layers/rotary_embedding/mrope.py'
      - 'python/sglang/multimodal_gen/runtime/layers/rotary_embedding/utils.py'
      - 'python/sglang/multimodal_gen/runtime/layers/usp.py'
      - 'python/sglang/multimodal_gen/runtime/models/dits/lingbot_world.py'
      - 'python/sglang/multimodal_gen/runtime/models/dits/ltx_2.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/schedule_batch.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/decoding.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/denoising.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/ltx_2/denoising.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/ltx_2/denoising_av.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/mova.py'
      - 'python/sglang/multimodal_gen/configs/pipeline_configs/ltx_2.py'
      - 'python/sglang/multimodal_gen/runtime/server_args/server_args.py'
      - 'python/sglang/multimodal_gen/test/unit/test_attention_backend_selector.py'
      - 'python/sglang/multimodal_gen/test/unit/test_compile_cache_key.py'
      - 'python/sglang/multimodal_gen/test/unit/test_compile_graph_breaks.py'
      - 'python/sglang/multimodal_gen/test/unit/test_decoding_stage_parallelism.py'
      - 'python/sglang/multimodal_gen/test/unit/test_ltx2_sp_padding_mask.py'
      - 'python/sglang/multimodal_gen/test/unit/test_server_args.py'
      - 'python/sglang/multimodal_gen/test/unit/test_vae_spatial_parallel_decode.py'
      - 'python/sglang/multimodal_gen/test/unit/test_wan_temb_table_slices.py'
      - 'python/sglang/multimodal_gen/test/unit/test_wan_ti2v_helpers.py'
      # Shared diffusion files carrying a TPU-only branch.
      - 'python/sglang/multimodal_gen/runtime/layers/custom_op.py'
      - 'python/sglang/multimodal_gen/runtime/layers/layernorm.py'
      - 'python/sglang/multimodal_gen/runtime/layers/vocab_parallel_embedding.py'
      - 'python/sglang/multimodal_gen/runtime/distributed/parallel_state.py'
      - 'python/sglang/multimodal_gen/runtime/disaggregation/transport/manager.py'
      - 'python/sglang/multimodal_gen/runtime/managers/memory_managers/layerwise_offload.py'
      - 'python/sglang/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages/minimax_h3/stages/denoising.py'
