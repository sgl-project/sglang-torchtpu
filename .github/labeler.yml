# Configuration for the GitHub Labeler action
# Automatically adds labels to PRs based on the files changed

# Router specific (Rust code in sgl-model-gateway)
model-gateway:
  - changed-files:
    - any-glob-to-any-file: 'sgl-model-gateway/**/*'

# Kernel specific
sgl-kernel:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/kernels/aot/**/*'

# JIT kernel specific
jit-kernel:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/kernels/!(*.md)'
      - 'python/sglang/kernels/!(aot)/**/*'

# Documentation
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**/*'
      - 'README*'
      - 'docs/**/*'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - '**/requirements*.txt'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/pyproject*.toml'
      - '**/setup.py'
      - '**/poetry.lock'
      - '**/package.json'
      - '**/package-lock.json'

# Multi-modal
Multi-modal:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*multimodal*'
      - '**/*vision*'
      - '**/*vlm*'

# Diffusion
diffusion:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/multimodal_gen/**/*'

# LoRA
lora:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*lora*'

# Quantization
quant:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*quant*'
      - '**/*quantization*'

# Speculative decoding
speculative-decoding:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*speculative*'

# AMD specific
amd:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*amd*'
      - '**/*rocm*'

# NPU specific
npu:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*npu*'
      - '**/*ascend*'

# TPU specific -- auto-label ONLY for the TPU backend + explicit TPU files.
# Deliberately NOT a broad '**/*tpu*' glob: shared code (python/sglang/srt/**,
# scheduler/model_runner/etc.) is left to MANUAL labeling. Keep this list in sync
# with the `tpu` path filter in .github/workflows/pr-test-tpu.yml.
tpu:
  - changed-files:
    - any-glob-to-any-file:
      - 'sglang_tpu/**'
      - 'python/sglang/srt/hardware_backend/tpu/**'
      - 'python/sglang/srt/layers/attention/pallas/**'
      - 'python/sglang/srt/layers/moe/pallas/**'
      - 'python/sglang/srt/disaggregation/tpu/**'
      - 'python/sglang/test/tpu/**'
      - 'python/sglang/multimodal_gen/runtime/platforms/tpu.py'
      - 'python/sglang/multimodal_gen/runtime/platforms/__init__.py'
      # Shared diffusion files carrying a TPU-only branch.
      - 'python/sglang/multimodal_gen/runtime/layers/custom_op.py'
      - 'python/sglang/multimodal_gen/runtime/layers/layernorm.py'
      - 'python/sglang/multimodal_gen/runtime/layers/vocab_parallel_embedding.py'
      - 'python/sglang/multimodal_gen/runtime/distributed/parallel_state.py'
      - 'python/sglang/multimodal_gen/runtime/disaggregation/transport/manager.py'
      - 'python/sglang/multimodal_gen/runtime/managers/memory_managers/layerwise_offload.py'
      - 'python/sglang/multimodal_gen/test/unit/test_tpu_*.py'
      - 'python/sglang/multimodal_gen/test/unit/test_platform_detection.py'
      - 'python/pyproject_tpu.toml'
      - 'benchmark/tpu/**'
      - 'docker/tpu.Dockerfile'
      - 'docker/tpu-base.Dockerfile'
      - 'docker/cloudbuild.tpu.yaml'
      - 'docker/cloudbuild.tpu-base.yaml'
      - 'test/registered/tpu/**'
      - 'test/registered/unit/hardware_backend/tpu/**'
      - 'test/registered/unit/layers/attention/pallas/**'
      - 'test/registered/unit/layers/moe/pallas/**'
      - 'test/registered/e2e/tpu/**'
      - 'test/registered/e2e/hardware_backend/tpu/**'
      - '.github/tpu-ci/**'
      - '.github/workflows/_tpu-build.yml'
      - '.github/workflows/_tpu-test.yml'
      - '.github/workflows/pr-test-tpu.yml'
      - '.github/workflows/nightly-test-tpu.yml'
      - '.github/workflows/feature-validation-tpu.yml'
      - '.github/workflows/accuracy-test-tpu.yml'
      - '.github/workflows/perf-test-tpu.yml'

# Blackwell
blackwell:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*nvfp4*'
      - 'python/sglang/srt/layers/attention/trtllm_mla_backend.py'
      - 'python/sglang/srt/layers/attention/trtllm_mha_backend.py'

# DeepSeek specific
deepseek:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*deepseek*'

memory-pool:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/srt/mem_cache/pool/**/*'
      - 'python/sglang/srt/mem_cache/allocator/**/*'
      - 'python/sglang/srt/mem_cache/layout/**/*'
      - 'python/sglang/srt/mem_cache/**/*memory_pool*'
      - 'test/registered/mem_cache/**/*'

unified-radix-cache:
  - changed-files:
    - any-glob-to-any-file:
      - 'python/sglang/srt/mem_cache/unified_cache/**/*'
      - 'python/sglang/srt/mem_cache/**/*radix*'
      - 'python/sglang/srt/mem_cache/evict_policy.py'
      - 'python/sglang/srt/mem_cache/base_prefix_cache.py'
      - 'test/registered/radix_cache/**/*'

hicache:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*hicache*'
      - '**/HiCache/**/*'
      - 'benchmark/hicache/**/*'
      - 'test/registered/hicache/**/*'
      - 'python/sglang/srt/managers/cache_controller.py'
      - 'python/sglang/srt/mem_cache/pool_host/**/*'
      - 'python/sglang/srt/mem_cache/hybrid_cache/**/*'
      - 'python/sglang/srt/mem_cache/storage/**/*'
      - 'python/sglang/srt/mem_cache/buffer_mode/**/*'
      - 'python/sglang/srt/mem_cache/**/*host*'
      - 'python/sglang/srt/mem_cache/**/*storage*'
      - 'python/sglang/srt/mem_cache/l2_transfer.py'

# A *mooncake* filename glob also matches benchmark/datasets/mooncake.py.
mooncake:
  - changed-files:
    - any-glob-to-any-file:
      # PD KV transfer.
      - 'python/sglang/srt/disaggregation/mooncake/**/*'
      - 'python/sglang/srt/distributed/device_communicators/mooncake_transfer_engine.py'
      - 'python/sglang/srt/observability/mooncake_trace.py'
      - 'test/registered/unit/disaggregation/**/*mooncake*'
      - 'test/manual/kv_transfer/**/*mooncake*'
      # HiCache store.
      - 'python/sglang/srt/mem_cache/storage/mooncake_store/**/*'
      - 'python/sglang/test/mooncake_utils.py'
      - 'test/registered/unit/mem_cache/**/*mooncake*'
      - 'test/registered/hicache/**/*mooncake*'
      # MoE EP. elastic_ep.py also implements nixl.
      - 'python/sglang/srt/layers/moe/token_dispatcher/mooncake.py'
      - 'python/sglang/srt/elastic_ep/expert_backup_client.py'
      - 'python/sglang/srt/elastic_ep/expert_backup_manager.py'
      - 'test/registered/ep/**/*mooncake*'
      - 'test/manual/ep/**/*mooncake*'

# Deterministic
deterministic:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/srt/batch_invariant_ops/**/*'

# Piecewise CUDA Graph
piecewise-cuda-graph:
  - changed-files:
    - any-glob-to-any-file: 'python/sglang/srt/compilation/**/*'

# Moore Threads specific
mthreads:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*mthreads*'
      - '**/*musa*'
      - '**/musa/**'

# Apple Silicon specific
apple-silicon:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*metal*'
      - '**/*mlx*'
      - '**/mlx/**'
      - '**/*mps*'

rust-processor:
  - changed-files:
    - any-glob-to-any-file:
      - 'rust/sglang-processor/**/*'
